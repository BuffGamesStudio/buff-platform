services:
  movie-buff-live-runner:
    build:
      context: .
      dockerfile: docker/movie-buff-live-runner.Dockerfile
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: "1.0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      MOVIE_BUFF_LIVE_RUNNER_ENABLED: ${MOVIE_BUFF_LIVE_RUNNER_ENABLED:-true}
      MOVIE_BUFF_LIVE_SHOW_KEY: ${MOVIE_BUFF_LIVE_SHOW_KEY:-main}
      MOVIE_BUFF_LIVE_RUNNER_POLL_MS: ${MOVIE_BUFF_LIVE_RUNNER_POLL_MS:-1000}
      MOVIE_BUFF_EXPECTED_SUPABASE_REF: ${MOVIE_BUFF_EXPECTED_SUPABASE_REF:-}
      MOVIE_BUFF_BROADCAST_PROVIDER: ${MOVIE_BUFF_BROADCAST_PROVIDER:-mux}
      MOVIE_BUFF_PUBLIC_PLAYBACK_URL: ${MOVIE_BUFF_PUBLIC_PLAYBACK_URL:-}
      MOVIE_BUFF_AI_HOST_PROVIDER: ${MOVIE_BUFF_AI_HOST_PROVIDER:-livekit}
      MOVIE_BUFF_AI_HOST_ENABLED: ${MOVIE_BUFF_AI_HOST_ENABLED:-false}
      MOVIE_BUFF_AI_MODEL_PROVIDER: ${MOVIE_BUFF_AI_MODEL_PROVIDER:-livekit_inference}
      MOVIE_BUFF_BROADCAST_COMPOSITION_URL: ${MOVIE_BUFF_BROADCAST_COMPOSITION_URL:-}
      MUX_LIVE_STREAM_INGEST_URL: ${MUX_LIVE_STREAM_INGEST_URL:-}
      MOVIE_BUFF_BROADCAST_EGRESS_ENABLED: ${MOVIE_BUFF_BROADCAST_EGRESS_ENABLED:-false}
      MOVIE_BUFF_BROADCAST_EGRESS_APPLY: ${MOVIE_BUFF_BROADCAST_EGRESS_APPLY:-false}
      MOVIE_BUFF_BROADCAST_EGRESS_SUPERVISOR_ENABLED: ${MOVIE_BUFF_BROADCAST_EGRESS_SUPERVISOR_ENABLED:-false}
      MOVIE_BUFF_BROADCAST_EGRESS_REQUIRED: ${MOVIE_BUFF_BROADCAST_EGRESS_REQUIRED:-false}
      MOVIE_BUFF_BROADCAST_EGRESS_POLL_MS: ${MOVIE_BUFF_BROADCAST_EGRESS_POLL_MS:-30000}
      MOVIE_BUFF_LIVE_PROVIDER_BRIDGE_ENABLED: ${MOVIE_BUFF_LIVE_PROVIDER_BRIDGE_ENABLED:-false}
      MOVIE_BUFF_LIVE_PROVIDER_BRIDGE_REQUIRED: ${MOVIE_BUFF_LIVE_PROVIDER_BRIDGE_REQUIRED:-false}
      MOVIE_BUFF_LIVEKIT_CONTROL_ROOM: ${MOVIE_BUFF_LIVEKIT_CONTROL_ROOM:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL is required}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required}
