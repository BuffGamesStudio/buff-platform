name: Movie Buff exact full three-client browser journey v2

on:
  push:
    branches: [validation/MOV-15-19-integrated-twin-v3]
    paths:
      - ".github/workflows/movie-buff-three-client-full-journey-v2.yml"
      - "scripts/movie-buff-three-client-full-journey-v2.mjs"
      - "src/components/movie-buff/MovieBuffAuthoritativePlayClient.tsx"
      - "src/app/games/movie-buff/layout.tsx"
      - "src/app/games/movie-buff/visual-runtime-preview/page.tsx"
      - "src/components/movie-buff/visual/**"
      - "src/lib/movie-buff/**"
      - "src/app/api/movie-buff/**"
      - "src/lib/game/**"
      - "src/lib/server/**"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: validation/MOV-15-19-integrated-twin-v3
  PARENT_SHA: c03f952483920e8609f688ee3bfb6a0843598052
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  exact-full-three-client-browser-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Bind exact source and validate harness
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          git merge-base --is-ancestor "${PARENT_SHA}" HEAD
          node --check scripts/movie-buff-three-client-full-journey-v2.mjs
          node --test tests/movie-buff-phase-digest-schema-repair.test.mjs tests/movie-buff-visual-runtime.test.mjs
          test "$(supabase --version)" = "2.111.0"
          ffmpeg -version | head -1
          ffprobe -version | head -1
          test -z "$(git status --porcelain)"

      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Execute disposable exact-SHA browser journey v2
        shell: bash
        run: |
          set +e
          set -uo pipefail
          evidence="${RUNNER_TEMP}/movie-buff-three-client-full-v2"
          raw="${RUNNER_TEMP}/movie-buff-three-client-full-v2-raw"
          work="${RUNNER_TEMP}/movie-buff-three-client-full-v2-stack"
          users="${RUNNER_TEMP}/movie-buff-three-client-full-v2-users.json"
          playwright_root="${RUNNER_TEMP}/movie-buff-three-client-full-v2-playwright"
          fixture="public/media/movie-buff/browser-journey-fixture.mp4"
          app_pid=""
          overall=0
          failure_step=""
          build_marker="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${evidence}" "${raw}" "${work}" "$(dirname "${fixture}")"
          cp -a supabase "${work}/supabase"

          python3 - "${work}/supabase/config.toml" "full-browser-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); text=p.read_text(encoding="utf-8"); project=sys.argv[2]
          text,n=re.subn(r'(?m)^project_id\s*=\s*"[^"]+"\s*$',f'project_id = "{project}"',text,count=1)
          text,m=re.subn(r'(?ms)(^\[db\.seed\]\s*.*?^enabled\s*=\s*)true(\s*$)',r'\1false\2',text,count=1)
          if n != 1 or m != 1: raise SystemExit("ephemeral config rewrite failed")
          p.write_text(text,encoding="utf-8")
          PY
          config_exit=$?; echo "${config_exit}" >"${raw}/config.exit"
          if [ "${config_exit}" -ne 0 ]; then overall=1; failure_step=config; fi

          if [ "${overall}" -eq 0 ]; then
            (cd "${work}" && supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor) >"${raw}/supabase-start.log" 2>&1
            start_exit=$?; echo "${start_exit}" >"${raw}/supabase-start.exit"
            if [ "${start_exit}" -ne 0 ]; then overall=1; failure_step=supabase-start; fi
          fi

          if [ "${overall}" -eq 0 ]; then
            (cd "${work}" && supabase db reset --local) >"${raw}/database-reset.log" 2>&1
            reset_exit=$?; echo "${reset_exit}" >"${raw}/database-reset.exit"
            if [ "${reset_exit}" -ne 0 ]; then overall=1; failure_step=database-reset; fi
          fi

          if [ "${overall}" -eq 0 ]; then
            status_env="$(cd "${work}" && supabase status -o env 2>"${raw}/supabase-status.error")"
            status_exit=$?; echo "${status_exit}" >"${raw}/supabase-status.exit"
            if [ "${status_exit}" -eq 0 ]; then
              eval "${status_env}"
              api_url="${API_URL:-http://127.0.0.1:54321}"
              publishable_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
              service_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
              database_url="${DB_URL:-}"
              if [ -z "${publishable_key}" ] || [ -z "${service_key}" ] || [ -z "${database_url}" ]; then overall=1; failure_step=credential-shape; fi
            else
              overall=1; failure_step=supabase-status
            fi
          fi

          if [ "${overall}" -eq 0 ]; then
            psql "${database_url}" -X -v ON_ERROR_STOP=1 \
              -c "truncate table public.movie_categories, public.clips, public.movies, public.categories, public.content_types restart identity cascade" \
              >"${raw}/content-reset.log" 2>&1
            content_reset_exit=$?; echo "${content_reset_exit}" >"${raw}/content-reset.exit"
            if [ "${content_reset_exit}" -ne 0 ]; then overall=1; failure_step=content-reset; fi
          fi

          if [ "${overall}" -eq 0 ]; then
            psql "${database_url}" -X -v ON_ERROR_STOP=1 -f scripts/generated/movie-buff-launch-bootstrap.sql \
              >"${raw}/content-bootstrap.log" 2>&1
            bootstrap_exit=$?; echo "${bootstrap_exit}" >"${raw}/content-bootstrap.exit"
            if [ "${bootstrap_exit}" -ne 0 ]; then overall=1; failure_step=content-bootstrap; fi
          fi

          if [ "${overall}" -eq 0 ]; then
            ffmpeg -hide_banner -loglevel error -y \
              -f lavfi -i "testsrc2=size=640x360:rate=24:duration=60" \
              -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=60" \
              -c:v libx264 -preset ultrafast -crf 24 -pix_fmt yuv420p \
              -c:a aac -b:a 128k -shortest -movflags +faststart "${fixture}" \
              >"${raw}/fixture-generation.log" 2>&1
            fixture_exit=$?; echo "${fixture_exit}" >"${raw}/fixture-generation.exit"
            if [ "${fixture_exit}" -ne 0 ]; then overall=1; failure_step=fixture-generation; fi
          fi

          if [ "${overall}" -eq 0 ]; then
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "${fixture}" \
              >"${raw}/fixture-duration.txt" 2>"${raw}/fixture-probe.error"
            probe_exit=$?; echo "${probe_exit}" >"${raw}/fixture-probe.exit"
            if [ "${probe_exit}" -ne 0 ]; then overall=1; failure_step=fixture-probe; fi
          fi

          if [ "${overall}" -eq 0 ]; then
            psql "${database_url}" -X -v ON_ERROR_STOP=1 \
              -c "update public.clips set clip_type='video', media_url='/media/movie-buff/browser-journey-fixture.mp4', source_url=null where is_active=true" \
              >"${raw}/fixture-bind.log" 2>&1
            fixture_bind_exit=$?; echo "${fixture_bind_exit}" >"${raw}/fixture-bind.exit"
            if [ "${fixture_bind_exit}" -ne 0 ]; then overall=1; failure_step=fixture-bind; fi
          fi

          if [ "${overall}" -eq 0 ]; then
            psql "${database_url}" -X -Atq -c \
              "select json_build_object('active_clips',(select count(*) from public.clips where is_active),'fixture_clips',(select count(*) from public.clips where is_active and media_url='/media/movie-buff/browser-journey-fixture.mp4' and clip_type='video'))" \
              >"${raw}/fixture-counts.json" 2>"${raw}/fixture-counts.error"
            counts_exit=$?; echo "${counts_exit}" >"${raw}/fixture-counts.exit"
            if [ "${counts_exit}" -ne 0 ]; then overall=1; failure_step=fixture-counts; fi
          fi

          if [ "${overall}" -eq 0 ]; then
            python3 - "${raw}/fixture-counts.json" <<'PY'
          import json,pathlib,sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if value.get("active_clips",0) < 1 or value.get("active_clips") != value.get("fixture_clips"):
              raise SystemExit("not every active clip is bound to the local fixture")
          PY
            readiness_exit=$?; echo "${readiness_exit}" >"${raw}/fixture-readiness.exit"
            if [ "${readiness_exit}" -ne 0 ]; then overall=1; failure_step=fixture-readiness; fi
          fi

          if [ "${overall}" -eq 0 ]; then
            NEXT_PUBLIC_SUPABASE_URL="${api_url}" \
            SUPABASE_SERVICE_ROLE_KEY="${service_key}" \
            MOVIE_BUFF_LOCAL_USERS_OUTPUT="${users}" \
            MOVIE_BUFF_LOCAL_RUN_ID="full-browser-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              node scripts/movie-buff-core-v11-local-users.mjs >"${raw}/local-users.log" 2>&1
            users_exit=$?; echo "${users_exit}" >"${raw}/local-users.exit"
            if [ "${users_exit}" -ne 0 ]; then overall=1; failure_step=local-users; fi
          fi

          if [ "${overall}" -eq 0 ]; then
            NEXT_PUBLIC_SUPABASE_URL="${api_url}" \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${publishable_key}" \
            SUPABASE_SERVICE_ROLE_KEY="${service_key}" \
            MOVIE_BUFF_APP_URL="http://127.0.0.1:3001" \
            NEXT_PUBLIC_MOVIE_BUFF_BUILD_BRANCH="${GITHUB_REF_NAME}" \
            NEXT_PUBLIC_MOVIE_BUFF_BUILD_SHA="${GITHUB_SHA}" \
            NEXT_PUBLIC_MOVIE_BUFF_BUILD_MARKER="${build_marker}" \
              npm run build >"${raw}/build.log" 2>&1
            build_exit=$?; echo "${build_exit}" >"${raw}/build.exit"
            if [ "${build_exit}" -ne 0 ]; then overall=1; failure_step=build; fi
          fi

          if [ "${overall}" -eq 0 ]; then
            NEXT_PUBLIC_SUPABASE_URL="${api_url}" \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${publishable_key}" \
            SUPABASE_SERVICE_ROLE_KEY="${service_key}" \
            MOVIE_BUFF_APP_URL="http://127.0.0.1:3001" \
            NEXT_PUBLIC_MOVIE_BUFF_BUILD_BRANCH="${GITHUB_REF_NAME}" \
            NEXT_PUBLIC_MOVIE_BUFF_BUILD_SHA="${GITHUB_SHA}" \
            NEXT_PUBLIC_MOVIE_BUFF_BUILD_MARKER="${build_marker}" \
              npm run start -- --hostname 127.0.0.1 --port 3001 >"${raw}/application.log" 2>&1 &
            app_pid=$!
            app_health=1
            for attempt in $(seq 1 120); do
              if curl --fail --silent --show-error http://127.0.0.1:3001/sign-in >/dev/null 2>>"${raw}/application-health.log"; then app_health=0; break; fi
              sleep 1
            done
            echo "${app_health}" >"${raw}/application-health.exit"
            if [ "${app_health}" -ne 0 ]; then overall=1; failure_step=application-health; fi
          fi

          if [ "${overall}" -eq 0 ]; then
            mkdir -p "${playwright_root}"
            (
              cd "${playwright_root}"
              npm init -y >/dev/null 2>&1
              npm install --ignore-scripts --no-audit --no-fund playwright@1.54.2
              npx playwright install --with-deps chromium
            ) >"${raw}/playwright-install.log" 2>&1
            playwright_exit=$?; echo "${playwright_exit}" >"${raw}/playwright-install.exit"
            if [ "${playwright_exit}" -ne 0 ]; then overall=1; failure_step=playwright-install; fi
          fi

          if [ "${overall}" -eq 0 ]; then
            MOVIE_BUFF_EXPECTED_BRANCH="${EXPECTED_BRANCH}" \
            MOVIE_BUFF_EXPECTED_GIT_SHA="${GITHUB_SHA}" \
            MOVIE_BUFF_BUILD_MARKER="${build_marker}" \
            MOVIE_BUFF_PARENT_SHA="${PARENT_SHA}" \
            MOVIE_BUFF_APP_URL="http://127.0.0.1:3001" \
            MOVIE_BUFF_LOCAL_USERS_OUTPUT="${users}" \
            MOVIE_BUFF_EVIDENCE_DIR="${evidence}" \
            PLAYWRIGHT_PACKAGE_ROOT="${playwright_root}" \
              node scripts/movie-buff-three-client-full-journey-v2.mjs >"${raw}/three-client-browser-v2.log" 2>&1
            browser_exit=$?; echo "${browser_exit}" >"${raw}/three-client-browser-v2.exit"
            if [ "${browser_exit}" -ne 0 ]; then overall=1; failure_step=three-client-browser-v2; fi
          fi

          if [ -n "${app_pid}" ]; then
            kill "${app_pid}" >/dev/null 2>&1 || true
            wait "${app_pid}" >/dev/null 2>&1 || true
          fi
          (cd "${work}" && supabase stop --no-backup) >"${raw}/cleanup.log" 2>&1
          cleanup_exit=$?; echo "${cleanup_exit}" >"${raw}/cleanup.exit"
          if [ "${cleanup_exit}" -ne 0 ]; then overall=1; [ -n "${failure_step}" ] || failure_step=cleanup; fi
          rm -rf "${work}" "${users}" "${playwright_root}"

          git status --porcelain >"${raw}/git-status-before-repair.txt"
          python3 - "${raw}/git-status-before-repair.txt" "${fixture}" <<'PY'
          import pathlib,sys
          status=pathlib.Path(sys.argv[1]).read_text().splitlines(); fixture=sys.argv[2]
          allowed={"next-env.d.ts",fixture}
          unexpected=[]
          for line in status:
              path=line[3:].strip()
              if " -> " in path: path=path.split(" -> ",1)[1]
              if path not in allowed: unexpected.append(line)
          if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))
          PY
          status_shape_exit=$?; echo "${status_shape_exit}" >"${raw}/git-status-shape.exit"
          if [ "${status_shape_exit}" -ne 0 ]; then overall=1; [ -n "${failure_step}" ] || failure_step=postflight-status-shape; fi
          rm -f "${fixture}"
          git checkout -- next-env.d.ts >/dev/null 2>&1 || true
          rmdir public/media/movie-buff public/media 2>/dev/null || true

          python3 - "${raw}" "${evidence}" <<'PY'
          import pathlib,re,sys
          raw=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); out.mkdir(parents=True,exist_ok=True)
          patterns=[
            (r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+','[REDACTED_JWT]'),
            (r'postgres(?:ql)?://[^\s]+','postgresql://[REDACTED_LOCAL_DB_URL]'),
            (r'sb_(?:secret|publishable)_[A-Za-z0-9_-]+','[REDACTED_SUPABASE_KEY]'),
            (r'(?i)(authorization:\s*bearer\s+)[A-Za-z0-9._-]+',r'\1[REDACTED]'),
          ]
          for p in raw.iterdir():
            if not p.is_file(): continue
            text=p.read_text(encoding='utf-8',errors='replace')
            for pattern,replacement in patterns: text=re.sub(pattern,replacement,text)
            (out/p.name).write_text(text,encoding='utf-8')
          PY

          {
            echo "classification=$([ "${overall}" -eq 0 ] && echo PASS || echo FAIL)"
            echo "failure_step=${failure_step}"
            echo "repository=BuffGamesStudio/buff-platform"
            echo "source_branch=${GITHUB_REF_NAME}"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "source_parents=$(git show -s --format=%P HEAD)"
            echo "parent_sha=${PARENT_SHA}"
            echo "build_marker=${build_marker}"
            echo "target=disposable-localhost"
            echo "media_fixture=locally-generated-60-second-testsrc2-with-audio"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >"${evidence}/metadata.txt"

          (cd "${evidence}" && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 sha256sum >sha256.txt && sha256sum -c sha256.txt) || overall=1
          git diff --check || overall=1
          test -z "$(git status --porcelain)" || overall=1
          exit "${overall}"

      - name: Upload exact full browser evidence v2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-three-client-full-v2-${{ github.sha }}
          path: ${{ runner.temp }}/movie-buff-three-client-full-v2
          if-no-files-found: error
          retention-days: 7

      - name: Verify clean postflight
        if: always()
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
