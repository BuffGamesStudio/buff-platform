name: Movie Buff RC-4 combined runtime

on:
  push:
    branches: [validation/movie-buff-rc4-runtime-20260806]
    paths:
      - ".github/workflows/movie-buff-rc4-combined-runtime.yml"
      - "scripts/movie-buff-release-train-combined-runtime-lab.sh"
      - "scripts/movie-buff-release-train-canonical-leave-race.mjs"
      - "scripts/movie-buff-release-train-patch-owner-fixtures.py"
  pull_request:
    branches: [integration/movie-buff]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-runtime:
    name: Disposable RC-4 MOV-15/MOV-16/MOV-17 race matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PRODUCT_SHA: 69a8c14043cde8f32e369e0f9363d117d2210098
      PRODUCT_TREE: fd04c088efbf1f93317eca79c45f247efa4e1968
      EXPECTED_BRANCH: validation/movie-buff-rc4-runtime-20260806
      EVIDENCE_DIR: ${{ runner.temp }}/movie-buff-rc4-runtime
      STACK_ROOT: ${{ runner.temp }}/movie-buff-rc4-stack
      PROOF_ROOT: ${{ runner.temp }}/movie-buff-rc4-worktree
      USERS_FILE: ${{ runner.temp }}/movie-buff-rc4-users.json
    steps:
      - name: Check out exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Execute exact disposable runtime matrix
        shell: bash
        run: |
          cp scripts/movie-buff-release-train-combined-runtime-lab.sh "${RUNNER_TEMP}/runtime-lab.sh"
          python3 - "${RUNNER_TEMP}/runtime-lab.sh" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          text=p.read_text()
          old='[[ "$(git -C "$SOURCE_ROOT" rev-parse HEAD^)" == "$PRODUCT_SHA" ]] || { fail_step wrong-product-parent; return; }'
          new='git -C "$SOURCE_ROOT" merge-base --is-ancestor "$PRODUCT_SHA" HEAD || { fail_step product-not-ancestor; return; }'
          if old not in text: raise SystemExit('runtime identity marker missing')
          p.write_text(text.replace(old,new,1))
          PY
          bash "${RUNNER_TEMP}/runtime-lab.sh" "${EXPECTED_SHA}" "${PRODUCT_SHA}" "${PRODUCT_TREE}" "${EXPECTED_BRANCH}" "${EVIDENCE_DIR}" "${STACK_ROOT}" "${PROOF_ROOT}" "${USERS_FILE}"
      - name: Upload combined runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-rc4-runtime-${{ env.EXPECTED_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
