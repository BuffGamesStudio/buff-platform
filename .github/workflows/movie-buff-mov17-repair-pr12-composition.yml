name: MOV-17 repair with PR12 exact composition

on:
  push:
    branches:
      - validation/movie-buff-mov17-repair-pr12-20260805
    paths:
      - .github/workflows/movie-buff-mov17-repair-pr12-composition.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: validation/movie-buff-mov17-repair-pr12-20260805
  COMPOSITION_SHA: 659eb5508ad8b160faa22feb677203b86b63b6de
  COMPOSITION_TREE: a34b4ccd9434d4eb001b19af189012a14a215d80
  CORE_PARENT_SHA: 3207712d0fa33c93107a9264a15d6db19f534ba0
  MOV17_PARENT_SHA: 807ea113974c7c17ad3a1f7ac4adefdb72347161
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-placeholder
  SUPABASE_SERVICE_ROLE_KEY: local-placeholder

jobs:
  exact-composition:
    name: Validate signed composition
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Check out exact validation controller
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Bind immutable composition and controller-only delta
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_EVIDENCE=${RUNNER_TEMP}/mov17-repair-pr12-source" >> "${GITHUB_ENV}"
          echo "DATABASE_EVIDENCE=${RUNNER_TEMP}/mov17-repair-pr12-database" >> "${GITHUB_ENV}"
          mkdir -p \
            "${RUNNER_TEMP}/mov17-repair-pr12-source" \
            "${RUNNER_TEMP}/mov17-repair-pr12-database"

          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          test "$(git rev-parse HEAD^)" = "${COMPOSITION_SHA}"
          test "$(git rev-parse "${COMPOSITION_SHA}^{tree}")" = "${COMPOSITION_TREE}"
          test "$(git rev-parse "${COMPOSITION_SHA}^1")" = "${CORE_PARENT_SHA}"
          test "$(git rev-parse "${COMPOSITION_SHA}^2")" = "${MOV17_PARENT_SHA}"

          mapfile -t changed < <(git diff --name-only "${COMPOSITION_SHA}" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/movie-buff-mov17-repair-pr12-composition.yml"
          test -z "$(git status --porcelain)"
          test ! -f supabase/.temp/project-ref
          test "$(supabase --version)" = "2.111.0"
          node --check tests/movie-buff-active-leave-boundary.test.mjs
          bash -n scripts/movie-buff-mov17-buster-leave-evidence.sh
          docker --version
          psql --version

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run exact source contract
        shell: bash
        run: |
          set -o pipefail
          node --test tests/movie-buff-active-leave-boundary.test.mjs \
            2>&1 | tee "${SOURCE_EVIDENCE}/contracts.tap"

      - name: Run TypeScript and production build
        shell: bash
        run: |
          set -o pipefail
          npx --no-install tsc --noEmit \
            2>&1 | tee "${SOURCE_EVIDENCE}/typescript.txt"
          npm run build \
            2>&1 | tee "${SOURCE_EVIDENCE}/build.txt"

      - name: Run disposable database rollback and reapply rehearsal
        shell: bash
        run: |
          bash scripts/movie-buff-mov17-buster-leave-evidence.sh \
            "${EXPECTED_SHA}" "${DATABASE_EVIDENCE}"

      - name: Finalize composition evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "${SOURCE_EVIDENCE}"
          classification=PASS
          git diff --check >"${SOURCE_EVIDENCE}/git-diff-check.txt" 2>&1 \
            || classification=FAIL
          test -z "$(git status --porcelain)" || classification=FAIL
          {
            echo "lane=MOV-17-repair-with-PR12-composition"
            echo "classification=${classification}"
            echo "repository=BuffGamesStudio/buff-platform"
            echo "validation_sha=$(git rev-parse HEAD)"
            echo "validation_tree=$(git rev-parse HEAD^{tree})"
            echo "validation_ref=${GITHUB_REF_NAME}"
            echo "composition_sha=${COMPOSITION_SHA}"
            echo "composition_tree=${COMPOSITION_TREE}"
            echo "core_parent_sha=${CORE_PARENT_SHA}"
            echo "mov17_parent_sha=${MOV17_PARENT_SHA}"
            echo "controller_delta=.github/workflows/movie-buff-mov17-repair-pr12-composition.yml"
            echo "combined_race_behavior=UNKNOWN"
            echo "browser_behavior=UNKNOWN"
            echo "hosted_state=UNKNOWN"
            echo "production_state=UNTOUCHED"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >"${SOURCE_EVIDENCE}/metadata.txt"
          (
            cd "${SOURCE_EVIDENCE}" || exit 1
            find . -type f ! -name sha256.txt -print0 \
              | sort -z | xargs -0 sha256sum >sha256.txt
            sha256sum -c sha256.txt
          )
          test "${classification}" = PASS

      - name: Upload exact composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mov17-repair-pr12-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/mov17-repair-pr12-source
            ${{ runner.temp }}/mov17-repair-pr12-database
          if-no-files-found: error
          retention-days: 7

      - name: Verify clean postflight
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
