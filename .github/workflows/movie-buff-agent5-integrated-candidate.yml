name: Movie Buff Agent 5 exact integrated candidate v2

on:
  push:
    branches:
      - validation/movie-buff-integrated-candidate-v1
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: validation/movie-buff-integrated-candidate-v1
  PR_NUMBER: "107"
  PRODUCT_SHA: 0eccbdedb49342ef2f04b237899e9c246442c0ec
  PRODUCT_TREE: 5a53aa117838561bcf8e698b63e6ac69ce174e05
  PREVIOUS_PRODUCT_SHA: 2be790c88bc7f34969fe607bb78fd7535b621190
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  linux-exact-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EVIDENCE: ${{ runner.temp }}/agent5-linux-${{ github.run_id }}-${{ github.run_attempt }}
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-mock-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: local-mock-service-role-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact controller, product, components, and protected blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE}"
          observed_sha="$(git rev-parse HEAD)"
          observed_tree="$(git rev-parse 'HEAD^{tree}')"
          observed_branch="${GITHUB_REF_NAME}"
          test "${observed_branch}" = "${EXPECTED_BRANCH}"
          test "${observed_sha}" = "${GITHUB_SHA}"
          test "$(git rev-parse "${PRODUCT_SHA}^{tree}")" = "${PRODUCT_TREE}"
          git merge-base --is-ancestor "${PRODUCT_SHA}" HEAD

          pr_head=""
          for attempt in $(seq 1 12); do
            pr_head="$(curl -fsSL "https://api.github.com/repos/BuffGamesStudio/buff-platform/pulls/${PR_NUMBER}" | jq -r '.head.sha')"
            if [ "${pr_head}" = "${observed_sha}" ]; then break; fi
            sleep 5
          done
          test "${pr_head}" = "${observed_sha}"

          cat >"${EVIDENCE}/components.tsv" <<'EOF'
          integration	movie-buff	bf316a15a2120e32d8a32e479df2ae439081f9a1	12f425f4c56fb3f3c66df6f3a6543d7fd8b6ef34
          pr3_visuals	movie-buff-origin-main-integration-20260803-155410	f692e82a5d524c950011e0300908c9cbec2389cb	621bd5d39059f76773d84b5a0d1dce851e2ff0de
          pr5_hardening	movie-buff-security-hardening-packet-20260804	91eac0d55abb1a9568017df687e8395771d24780	1ae3ed427b2c1b38c3731cc9532b5d0fb0c6336f
          mov15	MOV-15-public-matchmaking	48d44bb156b71060d1b9adcc7a2a3f014cf92060	e010c949920f84e5f7aaca9d50ebf39d6ea13309
          mov16	MOV-16-vip-authority	f169d652a9199a65afd5369c52c0584f635d7031	3a66c05277eb0907aba7f3f4f0506fb2eb162259
          mov17	MOV-17-shared-phase-machine	f17234debfb8942e1998306a12dc33301c1c5440	56c63df56f085c256289a8e4510ba05cbea3d9d1
          mov18	MOV-18-visual-motion-runtime	64ffcc4b2fcb4cb833f18912358861847b385fc7	51d5a9387a10a8d3a227bda619f8605efdf39138
          pr12_encoding	MOV-14-migration-encoding	d1f7ca58b534cbccd3071743d542f5788c0e9173	ea817ad706f4107fc16482cbe6cc40ec6a012ee0
          agent6_security	movie-buff-rls-acl-staging	9d1d1392bf5ff0e6961182050dbf902d0001d2c2	5c634f5234063f0dc0a72721acfd4b566ae907f3
          mov19_validator	MOV-19-security-validation	46c549675d44f19c22a7786421cf2581dc22af3c	d37a8ec456ff079da9f83da5c9fa058867ddf401
          EOF
          sed -i 's/^          //' "${EVIDENCE}/components.tsv"

          while IFS=$'\t' read -r id ref sha tree; do
            test "$(git rev-parse "${sha}^{tree}")" = "${tree}"
            if [ "${id}" != "integration" ]; then
              git merge-base --is-ancestor "${sha}" "${PRODUCT_SHA}"
            fi
            case "${id}" in
              integration) remote_ref="refs/heads/integration/${ref}" ;;
              pr3_visuals) remote_ref="refs/heads/cursor/${ref}" ;;
              pr5_hardening) remote_ref="refs/heads/automation/${ref}" ;;
              agent6_security) remote_ref="refs/heads/security/${ref}" ;;
              *) remote_ref="refs/heads/copilot/${ref}" ;;
            esac
            remote_sha="$(git ls-remote origin "${remote_ref}" | cut -f1)"
            test "${remote_sha}" = "${sha}"
          done <"${EVIDENCE}/components.tsv"

          test "$(git rev-parse HEAD:src/app/games/movie-buff/board-preview/page.tsx)" = "ee4ef8bae382aebc1e2242a8342d3858ecbc922c"
          test "$(git rev-parse HEAD:src/app/games/movie-buff/play/page.tsx)" = "2115b1f81a1dd64fa0998ebffcd2ca4ef605f0d5"
          test "$(git rev-parse HEAD:src/components/movie-buff/MovieBuffBoardRoomClient.tsx)" = "da8ea21aba760e51ffb37fa32e8906e5825cf86f"

          cat >"${EVIDENCE}/expected-delta.txt" <<'EOF'
          .github/workflows/movie-buff-migration-encoding.yml
          .github/workflows/movie-buff-mov16-exact-validation.yml
          .github/workflows/movie-buff-mov18-authoritative-adapter-evidence.yml
          docs/security/movie-buff-agent6-rls-acl-staging-status-2026-08-06.md
          scripts/movie-buff-mov16-linux-exact-validation-v2.sh
          scripts/movie-buff-mov16-windows-digital-twin.ps1
          scripts/movie-buff-vip-authority-personas-impl.mjs
          scripts/movie-buff-vip-authority-personas.mjs
          src/components/movie-buff/visual/MovieBuffAuthoritativePhaseVisualAdapter.tsx
          src/lib/movie-buff/authoritativeVisualAdapter.ts
          supabase/migrations/20260805155000_movie_buff_function_security_finalizer.sql
          supabase/migrations/20260805160000_movie_buff_six_table_rls_reconciliation.sql
          supabase/migrations/20260805160500_public_rls_auto_enable_event_trigger_contract.sql
          supabase/migrations/20260805161000_public_rls_auto_enable_acl_lockdown.sql
          supabase/rollbacks/20260804073100_movie_buff_vip_null_category_fail_closed.rollback.sql
          supabase/rollbacks/20260805155000_movie_buff_function_security_finalizer.rollback.sql
          supabase/rollbacks/20260805160000_movie_buff_six_table_rls_reconciliation.rollback.sql
          supabase/rollbacks/20260805160500_public_rls_auto_enable_event_trigger_contract.rollback.sql
          supabase/rollbacks/20260805161000_public_rls_auto_enable_acl_lockdown.rollback.sql
          supabase/tests/movie_buff_current_security_finalizer_rollback_test.sql
          supabase/tests/movie_buff_current_security_finalizer_test.sql
          tests/movie-buff-authoritative-visual-adapter.test.mjs
          tests/movie-buff-public-matchmaking-contract.test.mjs
          tests/movie-buff-vip-null-category-rollback-contract.test.mjs
          EOF
          sed -i 's/^          //' "${EVIDENCE}/expected-delta.txt"
          git diff --name-only "${PREVIOUS_PRODUCT_SHA}" "${PRODUCT_SHA}" | sort >"${EVIDENCE}/observed-delta.txt"
          diff -u "${EVIDENCE}/expected-delta.txt" "${EVIDENCE}/observed-delta.txt"

          {
            echo "repository=BuffGamesStudio/buff-platform"
            echo "branch=${observed_branch}"
            echo "expected_sha=${GITHUB_SHA}"
            echo "pr_head_sha=${pr_head}"
            echo "github_sha=${GITHUB_SHA}"
            echo "observed_sha=${observed_sha}"
            echo "expected_tree=${observed_tree}"
            echo "observed_tree=${observed_tree}"
            echo "product_sha=${PRODUCT_SHA}"
            echo "product_tree=${PRODUCT_TREE}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >"${EVIDENCE}/identity.txt"
          echo 0 >"${EVIDENCE}/source_assembly.exit"

      - name: Install committed dependency graph
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee "${EVIDENCE}/npm-ci.log"
          code=${PIPESTATUS[0]}; echo "${code}" >"${EVIDENCE}/dependency_install.exit"; exit "${code}"

      - name: Run all focused Movie Buff source contracts
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test tests/movie-buff-*.test.mjs 2>&1 | tee "${EVIDENCE}/focused-tests.tap"
          code=${PIPESTATUS[0]}; echo "${code}" >"${EVIDENCE}/focused_static_tests.exit"; exit "${code}"

      - name: TypeScript
        id: typescript
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee "${EVIDENCE}/typescript.log"
          code=${PIPESTATUS[0]}; echo "${code}" >"${EVIDENCE}/typescript.exit"; exit "${code}"

      - name: Production build with localhost placeholders
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "${EVIDENCE}/build.log"
          code=${PIPESTATUS[0]}; echo "${code}" >"${EVIDENCE}/production_build.exit"; exit "${code}"

      - name: Migration encoding and Agent 6 source package
        id: sql
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/movie-buff-migration-encoding-check.mjs \
            supabase/migrations supabase/rollbacks supabase/tests \
            2>&1 | tee "${EVIDENCE}/sql-encoding.log"
          code=${PIPESTATUS[0]}
          for file in \
            supabase/migrations/20260805155000_movie_buff_function_security_finalizer.sql \
            supabase/migrations/20260805160000_movie_buff_six_table_rls_reconciliation.sql \
            supabase/migrations/20260805160500_public_rls_auto_enable_event_trigger_contract.sql \
            supabase/migrations/20260805161000_public_rls_auto_enable_acl_lockdown.sql \
            supabase/rollbacks/20260805155000_movie_buff_function_security_finalizer.rollback.sql \
            supabase/rollbacks/20260805160000_movie_buff_six_table_rls_reconciliation.rollback.sql \
            supabase/rollbacks/20260805160500_public_rls_auto_enable_event_trigger_contract.rollback.sql \
            supabase/rollbacks/20260805161000_public_rls_auto_enable_acl_lockdown.rollback.sql \
            supabase/tests/movie_buff_current_security_finalizer_test.sql \
            supabase/tests/movie_buff_current_security_finalizer_rollback_test.sql
          do test -s "${file}" || code=1; done
          echo "${code}" >"${EVIDENCE}/sql_encoding.exit"; exit "${code}"

      - name: Secret scan and clean postflight
        id: hygiene
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          code=0
          if grep -RInE '(sb_secret_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.)' \
            docs/validation public/movie-buff-build-marker.json "${EVIDENCE}"; then
            code=1
          fi
          echo "${code}" >"${EVIDENCE}/secret_scan.exit"
          git diff --check || code=1
          if [ -n "$(git status --porcelain -- next-env.d.ts)" ]; then git checkout -- next-env.d.ts; fi
          test -z "$(git status --porcelain)" || code=1
          echo "${code}" >"${EVIDENCE}/clean_worktree.exit"
          exit "${code}"

      - name: Finalize portable Linux evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE}"
          node - "${EVIDENCE}" <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = process.argv[2];
          const names = [
            "source_assembly","dependency_install","focused_static_tests","typescript",
            "production_build","sql_encoding","secret_scan","clean_worktree"
          ];
          const result = {};
          for (const name of names) {
            const p = path.join(root, `${name}.exit`);
            const code = fs.existsSync(p) ? Number(fs.readFileSync(p, "utf8").trim()) : 99;
            result[name] = code === 0 ? "PASS" : "FAIL";
          }
          Object.assign(result, {
            local_database:"UNKNOWN", pgTAP:"UNKNOWN", personas:"UNKNOWN", races:"UNKNOWN",
            browser:"UNKNOWN", accessibility:"UNKNOWN", vercel_provenance:"UNKNOWN",
            hosted_supabase:"UNKNOWN", staging:"UNKNOWN", rollback:"UNKNOWN",
            containment:"UNKNOWN", forward_reapply:"UNKNOWN", backup_pitr:"UNKNOWN",
            production_target:"UNKNOWN", release:"NO-GO"
          });
          fs.writeFileSync(path.join(root, "status.json"), JSON.stringify(result, null, 2) + "\n");
          NODE
          (
            cd "${EVIDENCE}"
            find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 sha256sum >sha256.txt
            sha256sum -c sha256.txt
          )

      - name: Upload Linux exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-linux-${{ github.sha }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Linux result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for f in source_assembly dependency_install focused_static_tests typescript production_build sql_encoding secret_scan clean_worktree; do
            test "$(cat "${EVIDENCE}/${f}.exit")" = "0"
          done

  windows-digital-twin:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      EVIDENCE: ${{ runner.temp }}\agent5-windows-${{ github.run_id }}-${{ github.run_attempt }}
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-mock-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: local-mock-service-role-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install committed dependency graph
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Execute Agent 5 Windows digital twin
        shell: pwsh
        run: |
          ./scripts/movie-buff-agent5-windows-digital-twin.ps1 `
            -ExpectedSha $env:GITHUB_SHA `
            -ExpectedBranch $env:EXPECTED_BRANCH `
            -ProductSha $env:PRODUCT_SHA `
            -ProductTree $env:PRODUCT_TREE `
            -EvidenceDirectory $env:EVIDENCE

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-windows-${{ github.sha }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 7
