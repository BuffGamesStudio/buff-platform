name: Agent 5 Movie Buff exact-SHA candidate

on:
  push:
    branches:
      - validation/movie-buff-integrated-candidate-v1
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: validation/movie-buff-integrated-candidate-v1
  PRODUCT_SHA: 2be790c88bc7f34969fe607bb78fd7535b621190
  PRODUCT_TREE: cbd8061c9c4da410e39363beee02bf53194ed53f
  INTEGRATION_SHA: bf316a15a2120e32d8a32e479df2ae439081f9a1
  RECONCILIATION_BASE_SHA: cbf1c3e7c3fdd6925cf3ba473f9729a05d5fdfc7

jobs:
  linux-source-build:
    name: Exact identity, contracts, TypeScript, build, and integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-anon-placeholder
      SUPABASE_SERVICE_ROLE_KEY: local-service-role-placeholder

    steps:
      - name: Check out exact controller SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify identity, manifest, marker, components, and ownership
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/movie-buff-agent5-linux-evidence"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"

          remote="$(git remote get-url origin)"
          [[ "$remote" =~ BuffGamesStudio/buff-platform(\.git)?$ ]] || { echo 'Wrong repository remote'; exit 1; }
          [[ "$GITHUB_REF_NAME" == "$EXPECTED_BRANCH" ]] || { echo 'Wrong branch'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'Controller SHA mismatch'; exit 1; }
          git cat-file -e "${PRODUCT_SHA}^{commit}"
          [[ "$(git show -s --format=%T "$PRODUCT_SHA")" == "$PRODUCT_TREE" ]] || { echo 'Product tree mismatch'; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo 'Dirty checkout'; exit 1; }

          {
            echo "repository=BuffGamesStudio/buff-platform"
            echo "branch=$EXPECTED_BRANCH"
            echo "controller_sha=$GITHUB_SHA"
            echo "controller_tree=$(git show -s --format=%T "$GITHUB_SHA")"
            echo "product_sha=$PRODUCT_SHA"
            echo "product_tree=$PRODUCT_TREE"
            echo "captured_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$EVIDENCE_DIR/identity.txt"

          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('docs/validation/movie-buff-integrated-candidate-v1.manifest.json', 'utf8'));
          const marker = JSON.parse(fs.readFileSync('public/movie-buff-build-marker.json', 'utf8'));
          if (manifest.productComposition.sha !== process.env.PRODUCT_SHA || manifest.productComposition.treeSha !== process.env.PRODUCT_TREE) throw new Error('Manifest identity mismatch');
          if (marker.productCompositionSha !== process.env.PRODUCT_SHA || marker.productTreeSha !== process.env.PRODUCT_TREE) throw new Error('Marker identity mismatch');
          if (manifest.releaseClassification !== 'NO-GO' || marker.releaseClassification !== 'NO-GO') throw new Error('Candidate must remain NO-GO');
          NODE

          cat > "$EVIDENCE_DIR/components.tsv" <<'EOF'
          integration	bf316a15a2120e32d8a32e479df2ae439081f9a1
          pr3_visuals	f692e82a5d524c950011e0300908c9cbec2389cb
          pr5_hardening	91eac0d55abb1a9568017df687e8395771d24780
          mov15	dc9804cdae03d8627a89980dbcdf2292d2055372
          mov16	4a5e5591113b005f69fd34361becb2fd8d024897
          mov17	f17234debfb8942e1998306a12dc33301c1c5440
          mov18	780153d0624a8186db1c628f6bd93906bca41a30
          pr12_encoding	f86689895cb810831d9b4d6346ee95eed9439495
          mov19_validator	46c549675d44f19c22a7786421cf2581dc22af3c
          EOF
          : > "$EVIDENCE_DIR/merge-bases.tsv"
          while IFS=$'\t' read -r name sha; do
            git cat-file -e "${sha}^{commit}"
            tree="$(git show -s --format=%T "$sha")"
            merge_base="$(git merge-base "$INTEGRATION_SHA" "$sha")"
            printf '%s\t%s\t%s\t%s\n' "$name" "$sha" "$tree" "$merge_base" | tee -a "$EVIDENCE_DIR/merge-bases.tsv"
          done < "$EVIDENCE_DIR/components.tsv"

          check_blob() {
            local path="$1" expected="$2" actual
            actual="$(git rev-parse "$PRODUCT_SHA:$path")"
            [[ "$actual" == "$expected" ]] || { echo "Blob mismatch: $path expected $expected got $actual"; exit 1; }
            printf '%s\t%s\n' "$path" "$actual" >> "$EVIDENCE_DIR/protected-blobs.tsv"
          }
          : > "$EVIDENCE_DIR/protected-blobs.tsv"
          check_blob 'src/app/games/movie-buff/board-preview/page.tsx' 'ee4ef8bae382aebc1e2242a8342d3858ecbc922c'
          check_blob 'src/app/games/movie-buff/play/page.tsx' '2115b1f81a1dd64fa0998ebffcd2ca4ef605f0d5'
          check_blob 'src/components/movie-buff/MovieBuffBoardRoomClient.tsx' 'da8ea21aba760e51ffb37fa32e8906e5825cf86f'
          check_blob '.github/workflows/movie-buff-mov16-exact-validation.yml' 'fcc47d8db07b075f1b6de30c5c7671700454631a'
          check_blob 'src/app/games/movie-buff/round-results/page.tsx' '9282f124b85351a8569aa59d107a063862165afa'
          check_blob 'tests/movie-buff-authoritative-phase-runtime.test.mjs' '9334253a1f9481778ac9aa29cf7387b695cfcf8e'
          check_blob 'src/components/movie-buff/visual/MovieBuffAuthoritativePhaseVisualAdapter.tsx' '2396a59440f729dd9df9a7d6bd5da7ae4926c870'
          check_blob 'src/components/movie-buff/visual/index.ts' 'af974d079ff936131c52c1dff1c83915c36be70a'
          check_blob 'src/lib/movie-buff/authoritativeVisualAdapter.ts' 'e8ca8b79328ee55c176d2732670072174a08a2a9'
          check_blob 'tests/movie-buff-visual-runtime.test.mjs' 'bc245859b11595c72647a05071b0fa0cd2f5448a'
          check_blob 'scripts/movie-buff-migration-bom-only-check.mjs' '67123ea020c9ed245c4dacf9c5cdbce1c3ea0a64'
          check_blob 'tests/movie-buff-migration-encoding.test.mjs' 'a88adaffe01d00a3af38c0a48da255f526199ce6'

          cat > "$EVIDENCE_DIR/allowed-product-delta.txt" <<'EOF'
          .github/workflows/movie-buff-mov16-exact-validation.yml
          .github/workflows/movie-buff-mov19-validation.yml
          .github/workflows/movie-buff-mov19-windows-digital-twin.yml
          docs/security/movie-buff-go-no-go-v1.md
          docs/security/movie-buff-independent-validation-matrix-v1.md
          docs/security/movie-buff-rollback-readiness-v1.md
          scripts/movie-buff-migration-bom-only-check.mjs
          scripts/movie-buff-mov19-windows-digital-twin.ps1
          scripts/movie-buff-security-evidence.mjs
          scripts/movie-buff-three-client-validation.mjs
          src/app/games/movie-buff/round-results/page.tsx
          src/components/movie-buff/visual/MovieBuffAuthoritativePhaseVisualAdapter.tsx
          src/components/movie-buff/visual/index.ts
          src/lib/movie-buff/authoritativeVisualAdapter.ts
          supabase/tests/movie_buff_security_validation_test.sql
          tests/movie-buff-authoritative-phase-runtime.test.mjs
          tests/movie-buff-independent-security-validation.test.mjs
          tests/movie-buff-migration-encoding.test.mjs
          tests/movie-buff-release-evidence-integrity.test.mjs
          tests/movie-buff-visual-runtime.test.mjs
          EOF
          git diff --name-only "$RECONCILIATION_BASE_SHA" "$PRODUCT_SHA" | sort > "$EVIDENCE_DIR/actual-product-delta.txt"
          sort -o "$EVIDENCE_DIR/allowed-product-delta.txt" "$EVIDENCE_DIR/allowed-product-delta.txt"
          diff -u "$EVIDENCE_DIR/allowed-product-delta.txt" "$EVIDENCE_DIR/actual-product-delta.txt"

          git diff --name-only "$PRODUCT_SHA" "$GITHUB_SHA" | sort > "$EVIDENCE_DIR/controller-delta.txt"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/movie-buff-agent5-integrated-candidate.yml|docs/validation/movie-buff-integrated-candidate-v1.manifest.json|docs/validation/movie-buff-integrated-candidate-v1.md|public/movie-buff-build-marker.json|scripts/movie-buff-agent5-windows-digital-twin.ps1) ;;
              *) echo "Controller contains out-of-scope path: $path"; exit 1 ;;
            esac
          done < "$EVIDENCE_DIR/controller-delta.txt"

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run focused contracts from every included lane
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/movie-buff-public-matchmaking-contract.test.mjs \
            tests/movie-buff-public-matchmaking-handoff.test.mjs \
            tests/movie-buff-vip-authority.test.mjs \
            tests/movie-buff-vip-finalize-contract.test.mjs \
            tests/movie-buff-authoritative-phase-runtime.test.mjs \
            tests/movie-buff-server-phase-machine.test.mjs \
            tests/movie-buff-visual-runtime.test.mjs \
            tests/movie-buff-migration-encoding.test.mjs \
            tests/movie-buff-current-hardening-reconciliation.test.mjs \
            tests/movie-buff-independent-security-validation.test.mjs \
            tests/movie-buff-release-evidence-integrity.test.mjs \
            2>&1 | tee "$EVIDENCE_DIR/focused-tests.log"

      - name: Run TypeScript
        id: typescript
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee "$EVIDENCE_DIR/typescript.log"

      - name: Reject BOM-bearing SQL
        id: encoding
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node <<'NODE' | tee "$EVIDENCE_DIR/sql-encoding.log"
          const fs = require('node:fs');
          const path = require('node:path');
          const roots = ['supabase/migrations', 'supabase/rollbacks', 'supabase/tests'];
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (entry.isFile() && file.endsWith('.sql')) files.push(file);
            }
          }
          for (const root of roots) if (fs.existsSync(root)) walk(root);
          const failures = files.filter((file) => {
            const bytes = fs.readFileSync(file);
            return bytes.length >= 3 && bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf;
          });
          console.log(`scanned_sql_files=${files.length}`);
          if (failures.length) throw new Error(`UTF-8 BOM found: ${failures.join(', ')}`);
          NODE

      - name: Scan for obvious secret material
        id: secrets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE -- '-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|sk_live_[A-Za-z0-9]{16,}|sbp_[A-Za-z0-9]{20,}' "$PRODUCT_SHA" -- ':!package-lock.json' > "$EVIDENCE_DIR/secret-scan-findings.txt"; then
            cat "$EVIDENCE_DIR/secret-scan-findings.txt"
            exit 1
          fi
          echo 'obvious_secret_patterns=PASS' | tee "$EVIDENCE_DIR/secret-scan.txt"

      - name: Build with localhost placeholders and runtime marker
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cp public/movie-buff-build-marker.json "$EVIDENCE_DIR/source-build-marker.json"
          trap 'git checkout -- public/movie-buff-build-marker.json >/dev/null 2>&1 || true' EXIT
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'public/movie-buff-build-marker.json';
          const marker = JSON.parse(fs.readFileSync(file, 'utf8'));
          marker.controllerSha = process.env.GITHUB_SHA;
          marker.buildTimestampUtc = new Date().toISOString();
          marker.buildTimestampStatus = 'captured by exact-SHA GitHub Actions build';
          marker.workflowRunId = process.env.GITHUB_RUN_ID;
          fs.writeFileSync(file, JSON.stringify(marker, null, 2) + '\n');
          fs.copyFileSync(file, process.env.EVIDENCE_DIR + '/runtime-build-marker.json');
          NODE
          npm run build 2>&1 | tee "$EVIDENCE_DIR/production-build.log"

      - name: Finalize classifications and hashes
        if: always()
        shell: bash
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          TYPESCRIPT_OUTCOME: ${{ steps.typescript.outcome }}
          ENCODING_OUTCOME: ${{ steps.encoding.outcome }}
          SECRETS_OUTCOME: ${{ steps.secrets.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -u
          EVIDENCE_DIR="${EVIDENCE_DIR:-$RUNNER_TEMP/movie-buff-agent5-linux-evidence}"
          mkdir -p "$EVIDENCE_DIR"
          git checkout -- public/movie-buff-build-marker.json >/dev/null 2>&1 || true

          classify() {
            [[ "$1" == 'success' ]] && printf 'PASS' || printf 'FAIL'
          }

          clean='PASS'
          git diff --check || clean='FAIL'
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || clean='FAIL'

          {
            echo 'source_assembly=PASS'
            echo 'dependency_install=PASS'
            echo "focused_static_tests=$(classify "$FOCUSED_OUTCOME")"
            echo "typescript=$(classify "$TYPESCRIPT_OUTCOME")"
            echo "production_build=$(classify "$BUILD_OUTCOME")"
            echo "sql_encoding=$(classify "$ENCODING_OUTCOME")"
            echo 'changed_file_ownership=PASS'
            echo "secret_scan=$(classify "$SECRETS_OUTCOME")"
            echo "clean_worktree=$clean"
            echo 'database=UNKNOWN'
            echo 'browser=UNKNOWN'
            echo 'hosted_security=FAIL'
            echo 'isolated_staging=UNKNOWN'
            echo 'rollback=UNKNOWN'
            echo 'release=NO-GO'
          } | tee "$EVIDENCE_DIR/status.txt"

          find "$EVIDENCE_DIR" -maxdepth 1 -type f ! -name sha256.txt -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/sha256.txt"

          failed=0
          for outcome in "$FOCUSED_OUTCOME" "$TYPESCRIPT_OUTCOME" "$ENCODING_OUTCOME" "$SECRETS_OUTCOME" "$BUILD_OUTCOME"; do
            [[ "$outcome" == 'success' ]] || failed=1
          done
          [[ "$clean" == 'PASS' ]] || failed=1
          exit "$failed"

      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-linux-${{ github.sha }}
          path: ${{ runner.temp }}/movie-buff-agent5-linux-evidence
          if-no-files-found: error
          retention-days: 14

  windows-command-shell:
    name: Windows PowerShell command-shell digital twin
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000

    steps:
      - name: Check out exact controller SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Execute checked-in Agent 5 Windows wrapper
        shell: pwsh
        run: |
          ./scripts/movie-buff-agent5-windows-digital-twin.ps1 `
            -ExpectedSha '${{ github.sha }}' `
            -ProductSha '${{ env.PRODUCT_SHA }}' `
            -ExpectedBranch '${{ env.EXPECTED_BRANCH }}' `
            -EvidenceRoot '${{ runner.temp }}\movie-buff-agent5-windows-evidence'

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-windows-${{ github.sha }}
          path: ${{ runner.temp }}\movie-buff-agent5-windows-evidence
          if-no-files-found: error
          retention-days: 14
