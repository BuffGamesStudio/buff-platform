name: Movie Buff core v6 race and browser laboratories

on:
  push:
    branches:
      - validation/movie-buff-core-v6
    paths:
      - ".github/workflows/movie-buff-core-v6-race-browser.yml"
      - "scripts/movie-buff-core-v6-race-browser.sh"
      - "scripts/movie-buff-core-v6-local-users.mjs"
      - "scripts/movie-buff-core-v6-three-browser.mjs"
      - "scripts/movie-buff-public-matchmaking-evidence-runner.mjs"
      - "scripts/movie-buff-public-matchmaking-race.mjs"
      - "scripts/movie-buff-public-matchmaking-race-helper.sql"
      - "scripts/movie-buff-vip-authority-adversarial.mjs"
      - "scripts/movie-buff-vip-finalize-adversarial.mjs"
      - "scripts/movie-buff-three-client-phase-evidence-runner.mjs"
      - "scripts/movie-buff-three-client-phase-proof.mjs"
      - "scripts/movie-buff-reconnect-race-proof.mjs"
      - "src/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: validation/movie-buff-core-v6
  RAW_COMPOSITION_SHA: 61a7ab96904323e1cb6dfae0e54e900d12a83db0
  RAW_COMPOSITION_TREE: 167191fe2a143bae2f197218949fbe5b2195726a
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  exact-races:
    name: Exact matchmaking VIP phase and reconnect races
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Check out exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Verify exact identity and parse wrapper
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          git merge-base --is-ancestor "${RAW_COMPOSITION_SHA}" HEAD
          test "$(git rev-parse "${RAW_COMPOSITION_SHA}^{tree}")" = "${RAW_COMPOSITION_TREE}"
          test -z "$(git status --porcelain)"
          test ! -f supabase/.temp/project-ref
          test "$(supabase --version)" = "2.111.0"
          bash -n scripts/movie-buff-core-v6-race-browser.sh
          node --check scripts/movie-buff-core-v6-local-users.mjs
          node --check scripts/movie-buff-core-v6-three-browser.mjs
          docker --version
          psql --version
          python3 --version

      - name: Execute checked-in race wrapper
        shell: bash
        run: |
          bash scripts/movie-buff-core-v6-race-browser.sh \
            race \
            "${EXPECTED_SHA}" \
            "$(git rev-parse HEAD^{tree})" \
            "${RUNNER_TEMP}/movie-buff-core-v6-race"

      - name: Verify source remained clean
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Upload exact race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-core-v6-race-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/movie-buff-core-v6-race
          if-no-files-found: error
          retention-days: 7

  exact-three-browser:
    name: Exact three authenticated Chromium processes
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Check out exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Verify exact identity and parse wrapper
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          git merge-base --is-ancestor "${RAW_COMPOSITION_SHA}" HEAD
          test "$(git rev-parse "${RAW_COMPOSITION_SHA}^{tree}")" = "${RAW_COMPOSITION_TREE}"
          test -z "$(git status --porcelain)"
          test ! -f supabase/.temp/project-ref
          test "$(supabase --version)" = "2.111.0"
          bash -n scripts/movie-buff-core-v6-race-browser.sh
          node --check scripts/movie-buff-core-v6-local-users.mjs
          node --check scripts/movie-buff-core-v6-three-browser.mjs
          docker --version
          python3 --version

      - name: Execute checked-in browser wrapper
        shell: bash
        run: |
          bash scripts/movie-buff-core-v6-race-browser.sh \
            browser \
            "${EXPECTED_SHA}" \
            "$(git rev-parse HEAD^{tree})" \
            "${RUNNER_TEMP}/movie-buff-core-v6-browser"

      - name: Verify source remained clean
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Upload exact browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-core-v6-browser-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/movie-buff-core-v6-browser
          if-no-files-found: error
          retention-days: 7
