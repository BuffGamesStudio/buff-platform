name: Movie Buff validation-only composition evidence

on:
  push:
    branches:
      - validation/movie-buff-mov17-pr12-20260805-0235
  pull_request:
    branches:
      - integration/movie-buff
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

concurrency:
  group: movie-buff-validation-composition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repository:
    name: Composition Linux repository contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Check out exact composition SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          resolved_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${resolved_ref}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"
          node --version
          npm --version
      - name: Install committed lock without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check proof and wrapper syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/movie-buff-three-client-phase-proof.mjs
          node --check scripts/movie-buff-reconnect-race-proof.mjs
          node --check scripts/movie-buff-three-client-phase-evidence-runner.mjs
          bash -n scripts/movie-buff-mov17-local-supabase-evidence.sh
      - name: Run MOV-17 repository contract tests
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/composition-repository-evidence
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          node --test \
            tests/movie-buff-server-phase-machine.test.mjs \
            tests/movie-buff-authoritative-phase-runtime.test.mjs \
            tests/movie-buff-buster-safe-boundary.test.mjs \
            tests/movie-buff-phase-tile-mutation-guard.test.mjs \
            tests/movie-buff-match-start-handoff.test.mjs \
            2>&1 | tee "${EVIDENCE_DIR}/repository-contract-tests.tap"
      - name: Run TypeScript
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/composition-repository-evidence
        run: |
          set -euo pipefail
          npx --no-install tsc --noEmit 2>&1 | tee "${EVIDENCE_DIR}/typescript.txt"
      - name: Run production build with localhost-only placeholders
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/composition-repository-evidence
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-build-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: local-build-service-role-key
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "${EVIDENCE_DIR}/build.txt"
      - name: Verify clean postflight and metadata
        if: always()
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/composition-repository-evidence
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          git diff --check
          test -z "$(git status --porcelain)"
          {
            echo "classification=repository-static-and-localhost-placeholder-build"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_ref=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            echo "runner_os=${RUNNER_OS}"
            echo "node_version=$(node --version)"
            echo "npm_version=$(npm --version)"
            echo "database_behavior=UNKNOWN"
            echo "browser_behavior=UNKNOWN"
            echo "hosted_behavior=UNKNOWN"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${EVIDENCE_DIR}/metadata.txt"
          (
            cd "${EVIDENCE_DIR}"
            find . -maxdepth 1 -type f ! -name sha256.txt -print0 | sort -z | xargs -0 sha256sum > sha256.txt
            sha256sum -c sha256.txt
          )
      - name: Upload composition repository evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composition-repository-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/composition-repository-evidence
          if-no-files-found: error
          retention-days: 7

  windows-digital-twin:
    name: Composition Windows command-shell digital twin
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Check out exact composition SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact Windows runner identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resolvedRef = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          if ($resolvedRef -ne $env:EXPECTED_BRANCH) { throw "Branch mismatch: $resolvedRef" }
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'SHA mismatch' }
          if (git status --porcelain) { throw 'Checkout is not clean' }
          $PSVersionTable | Out-String
          node --version
          npm --version
      - name: Execute checked-in PowerShell wrapper
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'composition-windows-evidence'
          ./scripts/movie-buff-mov17-windows-digital-twin.ps1 `
            -ExpectedSha $env:EXPECTED_SHA `
            -EvidenceRoot $evidenceRoot
      - name: Upload composition Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composition-windows-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}\composition-windows-evidence
          if-no-files-found: error
          retention-days: 7

  encoding-linux:
    name: Composition Linux migration-byte proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      BASELINE_SHA: bf316a15a2120e32d8a32e479df2ae439081f9a1
    steps:
      - name: Check out exact composition SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          resolved_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${resolved_ref}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"
      - name: Run validator self-tests and repository scan
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/composition-encoding-linux
          MOVIE_BUFF_MIGRATION_ENCODING_OUTPUT: ${{ runner.temp }}/composition-encoding-linux/report.json
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          node --test tests/movie-buff-migration-encoding.test.mjs 2>&1 | tee "${EVIDENCE_DIR}/tests.tap"
          node scripts/movie-buff-migration-encoding-check.mjs \
            supabase/migrations supabase/rollbacks supabase/tests \
            > "${EVIDENCE_DIR}/scan.stdout.txt"
      - name: Prove migration edits remove only the leading BOM
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/composition-encoding-linux
          MOVIE_BUFF_BOM_ONLY_OUTPUT: ${{ runner.temp }}/composition-encoding-linux/bom-only-report.json
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASELINE_SHA}"
          node scripts/movie-buff-migration-bom-only-check.mjs "${BASELINE_SHA}" \
            > "${EVIDENCE_DIR}/bom-only.stdout.txt"
      - name: Verify clean postflight and metadata
        if: always()
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/composition-encoding-linux
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          git diff --check
          test -z "$(git status --porcelain)"
          {
            echo "classification=repository-byte-validation"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "baseline_sha=${BASELINE_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "node_version=$(node --version)"
            echo "hosted_state=UNKNOWN"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${EVIDENCE_DIR}/metadata.txt"
          (
            cd "${EVIDENCE_DIR}"
            find . -maxdepth 1 -type f ! -name sha256.txt -print0 | sort -z | xargs -0 sha256sum > sha256.txt
            sha256sum -c sha256.txt
          )
      - name: Upload composition Linux encoding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composition-encoding-linux-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/composition-encoding-linux
          if-no-files-found: error
          retention-days: 7

  encoding-windows:
    name: Composition Windows migration-byte proof
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      BASELINE_SHA: bf316a15a2120e32d8a32e479df2ae439081f9a1
    steps:
      - name: Check out exact composition SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact Windows checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resolvedRef = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          if ($resolvedRef -ne $env:EXPECTED_BRANCH) { throw "Branch mismatch: $resolvedRef" }
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'SHA mismatch' }
          if (git status --porcelain) { throw 'Checkout is not clean' }
      - name: Run validator self-tests and repository scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'composition-encoding-windows'
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          node --test tests/movie-buff-migration-encoding.test.mjs `
            1> (Join-Path $evidenceRoot 'tests.tap') `
            2> (Join-Path $evidenceRoot 'tests.stderr.txt')
          if ($LASTEXITCODE -ne 0) { throw "Encoding self-tests failed: $LASTEXITCODE" }
          $env:MOVIE_BUFF_MIGRATION_ENCODING_OUTPUT = Join-Path $evidenceRoot 'report.json'
          node scripts/movie-buff-migration-encoding-check.mjs `
            supabase/migrations supabase/rollbacks supabase/tests `
            1> (Join-Path $evidenceRoot 'scan.stdout.txt') `
            2> (Join-Path $evidenceRoot 'scan.stderr.txt')
          if ($LASTEXITCODE -ne 0) { throw "Encoding scan failed: $LASTEXITCODE" }
      - name: Prove migration edits remove only the leading BOM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'composition-encoding-windows'
          git fetch --no-tags --depth=1 origin $env:BASELINE_SHA
          if ($LASTEXITCODE -ne 0) { throw "Baseline fetch failed: $LASTEXITCODE" }
          $env:MOVIE_BUFF_BOM_ONLY_OUTPUT = Join-Path $evidenceRoot 'bom-only-report.json'
          node scripts/movie-buff-migration-bom-only-check.mjs $env:BASELINE_SHA `
            1> (Join-Path $evidenceRoot 'bom-only.stdout.txt') `
            2> (Join-Path $evidenceRoot 'bom-only.stderr.txt')
          if ($LASTEXITCODE -ne 0) { throw "BOM-only proof failed: $LASTEXITCODE" }
      - name: Verify clean postflight and metadata
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'composition-encoding-windows'
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          if (git status --porcelain) { throw 'Checkout is not clean after validation' }
          @(
            'classification=repository-byte-validation'
            "source_sha=$((git rev-parse HEAD).Trim())"
            "baseline_sha=$env:BASELINE_SHA"
            "runner_os=$env:RUNNER_OS"
            "powershell_version=$($PSVersionTable.PSVersion)"
            "node_version=$((node --version).Trim())"
            'hosted_state=UNKNOWN'
            "generated_at=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content -LiteralPath (Join-Path $evidenceRoot 'metadata.txt') -Encoding utf8
          Get-ChildItem -LiteralPath $evidenceRoot -File |
            Where-Object Name -ne 'sha256.csv' |
            Get-FileHash -Algorithm SHA256 |
            Select-Object Path, Hash |
            Export-Csv -LiteralPath (Join-Path $evidenceRoot 'sha256.csv') -NoTypeInformation
      - name: Upload composition Windows encoding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composition-encoding-windows-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}\composition-encoding-windows
          if-no-files-found: error
          retention-days: 7

  disposable-database:
    name: Composition disposable migration, pgTAP, rollback, and forward proof
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Check out exact composition SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize evidence directory
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/composition-local-supabase-evidence
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          {
            echo "classification=UNKNOWN"
            echo "source_sha=${EXPECTED_SHA}"
            echo "source_ref=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            echo "preflight=UNKNOWN"
          } > "${EVIDENCE_DIR}/preflight.txt"
      - name: Verify exact isolated checkout
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/composition-local-supabase-evidence
        run: |
          set -euo pipefail
          resolved_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${resolved_ref}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"
          test ! -f supabase/.temp/project-ref
          docker --version
          psql --version
          python3 --version
          {
            echo "classification=UNKNOWN"
            echo "source_sha=${EXPECTED_SHA}"
            echo "source_ref=${resolved_ref}"
            echo "preflight=PASS"
          } > "${EVIDENCE_DIR}/preflight.txt"
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Verify pinned CLI, wrapper, and redaction contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.111.0"
          bash -n scripts/movie-buff-mov17-local-supabase-evidence.sh
          python3 -B - <<'PY'
          from pathlib import Path
          for name in (
              "scripts/movie-buff-redact-evidence.py",
              "scripts/movie-buff-redact-evidence-test.py",
          ):
              compile(Path(name).read_text(encoding="utf-8"), name, "exec")
          PY
          python3 -B scripts/movie-buff-redact-evidence-test.py
          test -z "$(git status --porcelain)"
      - name: Run disposable local database evidence wrapper
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/composition-local-supabase-evidence
        run: |
          set -uo pipefail
          set +e
          bash scripts/movie-buff-mov17-local-supabase-evidence.sh \
            "${EXPECTED_SHA}" \
            "${EVIDENCE_DIR}"
          wrapper_exit=$?
          set -e
          while IFS= read -r -d '' evidence_file; do
            temporary_file="${evidence_file}.redacted"
            python3 -B scripts/movie-buff-redact-evidence.py "${evidence_file}" "${temporary_file}"
            mv "${temporary_file}" "${evidence_file}"
          done < <(find "${EVIDENCE_DIR}" -maxdepth 1 -type f ! -name sha256.txt -print0)
          python3 -B - "${EVIDENCE_DIR}" <<'PY'
          import importlib.util
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          script = pathlib.Path("scripts/movie-buff-redact-evidence.py")
          spec = importlib.util.spec_from_file_location("movie_buff_redactor", script)
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load evidence redactor")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          changed = []
          for path in sorted(root.glob("*")):
              if not path.is_file() or path.name == "sha256.txt":
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              if module.redact_text(text) != text:
                  changed.append(path.name)
          if changed:
              raise SystemExit("evidence redaction is not idempotent for: " + ", ".join(changed))
          PY
          (
            cd "${EVIDENCE_DIR}"
            find . -maxdepth 1 -type f ! -name sha256.txt -print0 | sort -z | xargs -0 sha256sum > sha256.txt
            sha256sum -c sha256.txt
          )
          exit "${wrapper_exit}"
      - name: Verify clean postflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Upload composition local database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composition-local-supabase-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/composition-local-supabase-evidence
          if-no-files-found: error
          retention-days: 7
