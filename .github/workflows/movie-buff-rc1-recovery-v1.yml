name: Movie Buff RC-1 recovery rollback and reapply v1b redacted

on:
  pull_request:
    branches: [operations/movie-buff-rc1-recovery-seat2-v1b-20260807]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  PRODUCT_SHA: 81d3618ce7be28a6ce81363a8bda524cd18ece15
  PRODUCT_TREE: 511c3501bd6a73f7556f636bc9e12ef30935d58d
  FORWARD: supabase/migrations/20260807014500_movie_buff_rls_helper_execute_repair.sql
  ROLLBACK: supabase/rollbacks/20260807014500_movie_buff_rls_helper_execute_repair.rollback.sql
  ARTIFACT_NAME: movie-buff-rc1-recovery-v1b-redacted-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  recovery-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Verify exact RC ancestry and recovery-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${PRODUCT_SHA}^{tree}")" = "${PRODUCT_TREE}"
          git merge-base --is-ancestor "${PRODUCT_SHA}" HEAD
          python3 - <<'PY'
          import os,subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only',f"{os.environ['PRODUCT_SHA']}..HEAD"],text=True).splitlines())
          expected={
            '.github/workflows/movie-buff-rc1-recovery-v1.yml',
            'supabase/rollbacks/20260807014500_movie_buff_rls_helper_execute_repair.rollback.sql',
          }
          if actual != expected:
              raise SystemExit(f'unexpected recovery delta: {sorted(actual)}')
          PY
          git diff --check

      - name: Start disposable Supabase and reset exact RC migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rc1-recovery"
          supabase start >"${RUNNER_TEMP}/rc1-recovery/supabase-start.log" 2>&1
          supabase db reset >"${RUNNER_TEMP}/rc1-recovery/db-reset.log" 2>&1
          supabase status -o env >"${RUNNER_TEMP}/rc1-recovery/status.env"
          python3 - "${RUNNER_TEMP}/rc1-recovery/status.env" "${RUNNER_TEMP}/rc1-recovery/db-url.txt" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text()
          m=re.search(r'^DB_URL=(?:"([^"]+)"|(\S+))$',text,re.M)
          if not m: raise SystemExit('DB_URL missing from local Supabase status')
          pathlib.Path(sys.argv[2]).write_text((m.group(1) or m.group(2))+'\n')
          PY

      - name: Capture forward state, rollback, verify containment, and reapply
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/rc1-recovery"
          DB_URL="$(cat "${evidence}/db-url.txt")"
          cat >"${evidence}/helper-state.sql" <<'SQL'
          \pset format unaligned
          \pset tuples_only on
          \pset fieldsep '|'
          select p.oid::regprocedure::text,
                 pg_get_userbyid(p.proowner),
                 p.prosecdef,
                 array_to_string(p.proconfig,','),
                 has_function_privilege('public',p.oid,'execute'),
                 has_function_privilege('anon',p.oid,'execute'),
                 has_function_privilege('authenticated',p.oid,'execute'),
                 has_function_privilege('service_role',p.oid,'execute')
          from pg_proc p
          where p.oid in (
            'public.is_movie_buff_room_member(uuid)'::regprocedure,
            'public.is_movie_buff_match_member(uuid)'::regprocedure,
            'public.is_movie_buff_round_member(uuid)'::regprocedure
          )
          order by 1;
          SQL
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -Atc "select version from supabase_migrations.schema_migrations where version='20260807014500';" | tee "${evidence}/ledger-forward.txt"
          test "$(cat "${evidence}/ledger-forward.txt")" = "20260807014500"
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f "${evidence}/helper-state.sql" >"${evidence}/forward-before.tsv"
          grep -q '|t|search_path=pg_catalog, public|f|f|t|t$' "${evidence}/forward-before.tsv"

          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f "${ROLLBACK}" >"${evidence}/rollback.log" 2>&1
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f "${evidence}/helper-state.sql" >"${evidence}/rollback-state.tsv"
          test "$(grep -c '|t|search_path=pg_catalog, public|f|f|f|t$' "${evidence}/rollback-state.tsv")" = "3"

          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f "${FORWARD}" >"${evidence}/forward-reapply.log" 2>&1
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f "${evidence}/helper-state.sql" >"${evidence}/forward-after.tsv"
          diff -u "${evidence}/forward-before.tsv" "${evidence}/forward-after.tsv" >"${evidence}/catalog-equivalence.diff"
          test ! -s "${evidence}/catalog-equivalence.diff"

      - name: Sanitize recovery evidence before hashing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/rc1-recovery"
          rm -f "${evidence}/status.env" "${evidence}/db-url.txt"
          python3 - "${evidence}" <<'PY'
          import json,pathlib,re,sys
          root=pathlib.Path(sys.argv[1])
          ansi=re.compile(r'\x1b\[[0-?]*[ -/]*[@-~]')
          row=re.compile(r'(?im)^(\s*│?\s*(Access Key|Secret Key)\s*│\s*)([^│\r\n]+?)(\s*│\s*)$')
          dburl=re.compile(r'(?i)\b(postgres(?:ql)?://[^:\s/@]+:)([^@\s/]+)(@)')
          jwt=re.compile(r'\beyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}\b')
          secret=re.compile(r'\bsb_secret_[A-Za-z0-9_-]{8,}\b')
          counts={}
          touched=[]
          for p in root.rglob('*'):
              if not p.is_file(): continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              text=ansi.sub('',text)
              def rr(m):
                  k=m.group(2).replace(' ','').lower(); counts[k]=counts.get(k,0)+1
                  return m.group(1)+'[REDACTED]'+m.group(4)
              text=row.sub(rr,text)
              def dr(m):
                  counts['db_password']=counts.get('db_password',0)+1
                  return m.group(1)+'[REDACTED]'+m.group(3)
              text=dburl.sub(dr,text)
              n=len(jwt.findall(text)); counts['jwt']=counts.get('jwt',0)+n; text=jwt.sub('[REDACTED_JWT]',text)
              n=len(secret.findall(text)); counts['sb_secret']=counts.get('sb_secret',0)+n; text=secret.sub('[REDACTED_SUPABASE_SECRET]',text)
              p.write_text(text,encoding='utf-8'); touched.append(str(p.relative_to(root)))
          remaining=[]
          for p in root.rglob('*'):
              if not p.is_file(): continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              for label,value in row.findall(text):
                  if value.strip()!='[REDACTED]': remaining.append([str(p.relative_to(root)),label])
              if dburl.search(text): remaining.append([str(p.relative_to(root)),'db_url_password'])
              if jwt.search(text): remaining.append([str(p.relative_to(root)),'jwt'])
              if secret.search(text): remaining.append([str(p.relative_to(root)),'sb_secret'])
          report={'classification':'PASS' if not remaining else 'FAIL','replacements':counts,'remaining':remaining,'filesNormalized':touched}
          (root/'redaction-report.json').write_text(json.dumps(report,indent=2)+'\n')
          if remaining: raise SystemExit('recovery evidence still contains credential shapes')
          if counts.get('accesskey',0)<1 or counts.get('secretkey',0)<1 or counts.get('db_password',0)<1:
              raise SystemExit('expected local credential shapes were not observed/redacted')
          PY

      - name: Record recovery manifest and hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/rc1-recovery"
          python3 - "${evidence}/recovery-manifest.json" <<'PY'
          import json,pathlib,sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
            'classification':'PASS',
            'evidenceHygiene':'PASS',
            'repository':'BuffGamesStudio/buff-platform',
            'productSha':'81d3618ce7be28a6ce81363a8bda524cd18ece15',
            'productTree':'511c3501bd6a73f7556f636bc9e12ef30935d58d',
            'scope':'disposable-localhost rollback containment and forward reapply',
            'forward':'supabase/migrations/20260807014500_movie_buff_rls_helper_execute_repair.sql',
            'rollback':'supabase/rollbacks/20260807014500_movie_buff_rls_helper_execute_repair.rollback.sql',
            'dataDeletion':False,
            'pitrInvocation':'NOT APPLICABLE',
            'hostedMutation':'NOT APPLICABLE',
            'productionBackupIdentity':'UNKNOWN'
          },indent=2)+'\n')
          PY
          sha256sum "${FORWARD}" "${ROLLBACK}" >"${evidence}/source-sha256.txt"
          (cd "${evidence}" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Stop disposable Supabase
        if: always()
        shell: bash
        run: supabase stop --no-backup || true

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/rc1-recovery
          if-no-files-found: error
          retention-days: 30

  independent-recovery-inspection:
    needs: recovery-proof
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: evidence
      - name: Verify recovery artifact and credential hygiene
        shell: bash
        run: |
          set -euo pipefail
          cd evidence
          sha256sum -c SHA256SUMS.txt
          test ! -s catalog-equivalence.diff
          test "$(grep -c '|t|search_path=pg_catalog, public|f|f|f|t$' rollback-state.tsv)" = "3"
          python3 - <<'PY'
          import json,pathlib,re
          m=json.load(open('recovery-manifest.json'))
          assert m['classification']=='PASS' and m['evidenceHygiene']=='PASS'
          assert m['productSha']=='81d3618ce7be28a6ce81363a8bda524cd18ece15'
          assert m['productTree']=='511c3501bd6a73f7556f636bc9e12ef30935d58d'
          assert m['dataDeletion'] is False
          r=json.load(open('redaction-report.json'))
          assert r['classification']=='PASS'
          assert r['replacements'].get('accesskey',0)>=1
          assert r['replacements'].get('secretkey',0)>=1
          assert r['replacements'].get('db_password',0)>=1
          text='\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in pathlib.Path('.').rglob('*') if p.is_file())
          assert re.search(r'(?i)\bpostgres(?:ql)?://[^:\s/@]+:[^@\s/]+@',text) is None
          for label,value in re.findall(r'(?im)^\s*│?\s*(Access Key|Secret Key)\s*│\s*([^│\r\n]+?)\s*│',text):
              assert value.strip()=='[REDACTED]', label
          PY
