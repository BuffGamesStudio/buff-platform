name: Movie Buff Agent 7 RC5802 browser lab

on:
  push:
    branches:
      - validation/movie-buff-agent7-rc5802-browser-lab
    paths:
      - .github/workflows/movie-buff-agent7-rc5802-browser-lab.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: BuffGamesStudio/buff-platform
  TARGET_BRANCH: validation/movie-buff-agent8-canonical-rc-v1-20260805
  TARGET_SHA: 5802b4b51f19d755a3380e2c717e6a10dcdeb8c1
  TARGET_TREE: 653f1bbb2f0e6d1851ead8c5f59dcec3fe0fcf12
  INTEGRATION_BASELINE: bf316a15a2120e32d8a32e479df2ae439081f9a1
  COMPONENT_MOV15: c802b69d13d658c749fdfa54b5719af95ab0a567
  COMPONENT_MOV16: f2a96b2ff1e1caed72e4c60882b89c1d6c0cac5e
  COMPONENT_MOV17: fe1b321f9bee9f0f345031c88febe39975fd73d0
  COMPONENT_MOV18: 93a487cb8bfe0c1afd148141763bdab8e40b062a
  COMPONENT_PR3: b424b48c4b11a57989e840137437245d14a3ac23
  COMPONENT_PR5: 657a22a9823e6cc78eb0e044997ed467c29a3894
  COMPONENT_SECURITY: fc735ecf7830d984049f3fd0a8116c7d34e5eb2c
  COMPONENT_BUILD_REPAIR: 85bf54b2cc05fcfe430562705709e8ab3737e2f4
  V2_WORKFLOW_BLOB: d85c32f629de0dbacb9c6d0f00efef79c256867a
  MOVIE_BUFF_V2_HARNESS_BLOB: 3b08204937f26af9287f303906509dc057b399dc
  MOVIE_BUFF_WRAPPER_BLOB: 53e9ab8816bd25fae84505dbb9477dce2947608c
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  exact-full-three-client-browser:
    name: Exact RC5802 full three-client journey
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    steps:
      - name: Check out exact functional SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Install deterministic media tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Bind exact target and record identity
        shell: bash
        run: |
          set -euo pipefail
          identity="${RUNNER_TEMP}/movie-buff-agent7-rc5802-identity"
          mkdir -p "${identity}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${TARGET_TREE}"
          test "$(git remote get-url origin)" = "https://github.com/${TARGET_REPOSITORY}"
          git merge-base --is-ancestor "${INTEGRATION_BASELINE}" HEAD
          test -z "$(git status --porcelain)"
          node --check scripts/movie-buff-three-client-full-journey-v2.mjs
          node --check scripts/movie-buff-three-client-full-journey-v3-runner.mjs
          test "$(git rev-parse HEAD:.github/validation-archive/movie-buff-three-client-full-journey-v2.yml)" = "${V2_WORKFLOW_BLOB}"
          test "$(git rev-parse HEAD:scripts/movie-buff-three-client-full-journey-v2.mjs)" = "${MOVIE_BUFF_V2_HARNESS_BLOB}"
          test "$(git rev-parse HEAD:scripts/movie-buff-three-client-full-journey-v3-runner.mjs)" = "${MOVIE_BUFF_WRAPPER_BLOB}"
          {
            echo "repository=${TARGET_REPOSITORY}"
            echo "branch=${TARGET_BRANCH}"
            echo "sha=${TARGET_SHA}"
            echo "tree=${TARGET_TREE}"
            echo "integration_baseline=${INTEGRATION_BASELINE}"
            echo "component_mov15=${COMPONENT_MOV15}"
            echo "component_mov16=${COMPONENT_MOV16}"
            echo "component_mov17=${COMPONENT_MOV17}"
            echo "component_mov18=${COMPONENT_MOV18}"
            echo "component_pr3=${COMPONENT_PR3}"
            echo "component_pr5=${COMPONENT_PR5}"
            echo "component_security=${COMPONENT_SECURITY}"
            echo "component_build_repair=${COMPONENT_BUILD_REPAIR}"
            echo "environment_classification=ephemeral-disposable-localhost"
            echo "localhost_url=http://127.0.0.1:3001"
            echo "server_start_command=npm run start -- --hostname 127.0.0.1 --port 3001"
            echo "node_version=$(node --version)"
            echo "npm_version=$(npm --version)"
            echo "supabase_cli_version=$(supabase --version)"
            echo "ffmpeg_version=$(ffmpeg -version | head -1)"
            echo "operating_system=$(uname -a)"
            echo "start_time_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "controller_workflow_run_id=${GITHUB_RUN_ID}"
            echo "controller_commit=${GITHUB_SHA}"
          } >"${identity}/identity.txt"
          cat /etc/os-release >"${identity}/os-release.txt"
          git show -s --format=fuller HEAD >"${identity}/candidate-commit.txt"
          git status --porcelain=v1 >"${identity}/candidate-status.txt"

      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Extract candidate-owned v9 laboratory
        shell: bash
        run: |
          set -euo pipefail
          archived=".github/validation-archive/movie-buff-three-client-full-journey-v2.yml"
          output="${RUNNER_TEMP}/movie-buff-agent7-rc5802-execute.sh"
          python3 - "${archived}" "${output}" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          lines = source.read_text(encoding="utf-8").splitlines()
          marker = "- name: Execute disposable exact-SHA browser journey v2"
          start = next(i for i, line in enumerate(lines) if line.strip() == marker)
          run_line = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == "run: |")
          indent = len(lines[run_line]) - len(lines[run_line].lstrip())
          body = []
          for line in lines[run_line + 1:]:
              if line.strip() and len(line) - len(line.lstrip()) <= indent:
                  break
              body.append(line[indent + 2:] if line.strip() else "")
          execute = "\n".join(body) + "\n"

          execute = execute.replace(
              'git status --porcelain >"${raw}/git-status-before-repair.txt"',
              'git status --porcelain --untracked-files=all >"${raw}/git-status-before-repair.txt"',
          )
          execute = execute.replace(
              'node scripts/movie-buff-three-client-full-journey-v2.mjs >"${raw}/three-client-browser-v2.log" 2>&1',
              'node scripts/movie-buff-three-client-full-journey-v3-runner.mjs >"${raw}/three-client-browser-v2.log" 2>&1',
          )
          if execute.count("npx playwright install --with-deps chromium") != 1:
              raise SystemExit("bundled Chromium install anchor missing")
          execute = execute.replace(
              "npx playwright install --with-deps chromium",
              "npx playwright install --with-deps chrome",
          )
          old_shape = "\n".join([
              'allowed={"next-env.d.ts",fixture}',
              'unexpected=[]',
              'for line in status:',
              '    path=line[3:].strip()',
              '    if " -> " in path: path=path.split(" -> ",1)[1]',
              '    if path not in allowed: unexpected.append(line)',
              'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))',
          ])
          new_shape = "\n".join([
              'allowed={"next-env.d.ts",fixture}',
              'allowed_prefixes=("public/media/movie-buff/runtime-generated/",)',
              'unexpected=[]',
              'for line in status:',
              '    path=line[3:].strip()',
              '    if " -> " in path: path=path.split(" -> ",1)[1]',
              '    if path not in allowed and not path.startswith(allowed_prefixes): unexpected.append(line)',
              'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))',
          ])
          if old_shape not in execute:
              raise SystemExit("postflight status-shape anchor missing")
          execute = execute.replace(old_shape, new_shape)
          cleanup_anchor = "\n".join([
              'rm -f "${fixture}"',
              'git checkout -- next-env.d.ts >/dev/null 2>&1 || true',
              'rmdir public/media/movie-buff public/media 2>/dev/null || true',
          ])
          cleanup_replacement = "\n".join([
              'rm -f "${fixture}"',
              'rm -rf public/media/movie-buff/runtime-generated',
              'git checkout -- next-env.d.ts >/dev/null 2>&1 || true',
              'rmdir public/media/movie-buff public/media 2>/dev/null || true',
          ])
          if cleanup_anchor not in execute:
              raise SystemExit("runtime-generated cleanup anchor missing")
          execute = execute.replace(cleanup_anchor, cleanup_replacement)
          output.write_text(execute, encoding="utf-8")
          PY
          bash -n "${output}"
          sha256sum \
            "${archived}" \
            scripts/movie-buff-three-client-full-journey-v2.mjs \
            scripts/movie-buff-three-client-full-journey-v3-runner.mjs \
            "${output}" \
            >"${RUNNER_TEMP}/movie-buff-agent7-rc5802-identity/laboratory-input-sha256.txt"

      - name: Execute exact RC browser journey
        shell: bash
        run: |
          set +e
          set -uo pipefail
          identity="${RUNNER_TEMP}/movie-buff-agent7-rc5802-identity"
          playwright_root="${RUNNER_TEMP}/movie-buff-three-client-full-v2-playwright"
          monitor_identity() {
            process_done=0
            browser_done=0
            for attempt in $(seq 1 1200); do
              if [ "${process_done}" -eq 0 ]; then
                ss -ltnp 2>/dev/null | grep ':3001' >"${identity}/listening-port.txt" 2>/dev/null || true
                pid="$(sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' "${identity}/listening-port.txt" | head -1)"
                if [ -n "${pid}" ]; then
                  echo "${pid}" >"${identity}/process.pid"
                  ps -p "${pid}" -o pid=,ppid=,lstart=,args= >"${identity}/process.txt" 2>&1 || true
                  process_done=1
                fi
              fi
              if [ "${browser_done}" -eq 0 ] && [ -f "${playwright_root}/node_modules/playwright/package.json" ]; then
                node -p "require('${playwright_root}/node_modules/playwright/package.json').version" \
                  >"${identity}/playwright-version.txt" 2>&1 || true
                browser_path="$(node -e "const {chromium}=require('${playwright_root}/node_modules/playwright');process.stdout.write(chromium.executablePath())" 2>/dev/null || true)"
                if [ -n "${browser_path}" ] && [ -x "${browser_path}" ]; then
                  echo "${browser_path}" >"${identity}/browser-executable.txt"
                  "${browser_path}" --version >"${identity}/browser-version.txt" 2>&1 || true
                  browser_done=1
                fi
              fi
              if [ "${process_done}" -eq 1 ] && [ "${browser_done}" -eq 1 ]; then return 0; fi
              sleep 1
            done
            return 0
          }
          monitor_identity &
          monitor_pid=$!
          env \
            GITHUB_REF_NAME="${TARGET_BRANCH}" \
            GITHUB_SHA="${TARGET_SHA}" \
            EXPECTED_BRANCH="${TARGET_BRANCH}" \
            PARENT_SHA="${INTEGRATION_BASELINE}" \
            MOVIE_BUFF_V2_HARNESS_BLOB="${MOVIE_BUFF_V2_HARNESS_BLOB}" \
            bash "${RUNNER_TEMP}/movie-buff-agent7-rc5802-execute.sh"
          journey_exit=$?
          kill "${monitor_pid}" >/dev/null 2>&1 || true
          wait "${monitor_pid}" >/dev/null 2>&1 || true
          echo "${journey_exit}" >"${identity}/journey.exit"
          exit "${journey_exit}"

      - name: Finalize Agent 7 evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          evidence="${RUNNER_TEMP}/movie-buff-three-client-full-v2"
          raw="${RUNNER_TEMP}/movie-buff-three-client-full-v2-raw"
          identity="${RUNNER_TEMP}/movie-buff-agent7-rc5802-identity"
          mkdir -p "${evidence}/agent7-controller"
          cp -a "${identity}/." "${evidence}/agent7-controller/" 2>/dev/null || true
          if [ -d "${raw}" ]; then
            mkdir -p "${evidence}/agent7-controller/raw"
            cp -a "${raw}/." "${evidence}/agent7-controller/raw/" 2>/dev/null || true
          fi
          cat >"${evidence}/agent7-controller/scenario-ledger-initial.md" <<'EOF'
          # Agent 7 RC5802 scenario ledger

          This run executes the exact candidate-owned v9 full-journey laboratory. Classification is evidence-driven. Any scenario not explicitly executed remains UNKNOWN.

          Main strict-three journey, VIP privacy, board authority, transition, playback, answer, results, board return, selector rotation, playback refresh, offline reconnect, browser history, responsive widths, reduced motion, missing asset fallback, and console/network checks: PENDING_ARTIFACT_INSPECTION.

          Round Intro/VIP/board/results refresh; VIP-expiry boundary reconnects; concurrent reconnect/finalization; selector/nonselector disconnect; duplicate expiry workers; multiple tabs; clock skew; full keyboard/modal-focus proof; WebGL failure; trace/report completeness: UNKNOWN_UNLESS_SEPARATELY_PROVEN.
          EOF
          {
            echo "finished_time_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hosted_staging=UNTOUCHED"
            echo "production=UNTOUCHED"
            echo "candidate_source_modified=NO"
          } >>"${evidence}/agent7-controller/identity.txt"
          (
            cd "${evidence}" || exit 1
            find . -type f ! -name agent7-sha256.txt -print0 | sort -z | xargs -0 sha256sum >agent7-sha256.txt
            sha256sum -c agent7-sha256.txt
          )

      - name: Upload Agent 7 exact browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-agent7-rc5802-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/movie-buff-three-client-full-v2
          if-no-files-found: error
          retention-days: 14

      - name: Verify exact target postflight
        if: always()
        shell: bash
        run: |
          git diff --check
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${TARGET_TREE}"
