name: Movie Buff PR61 derived runtime evidence

on:
  push:
    branches:
      - validation/movie-buff-pr55-core-v3
    paths:
      - ".github/workflows/movie-buff-pr61-derived-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SIGNED_COMPOSITION_SHA: 7b729bfe7920549d9f544dda777e1383f3fff976
  SIGNED_COMPOSITION_TREE: 0d272f53601b42fae69e3bd51bfe2a8cdc852f7a
  SUCCESSOR_MOV17_SHA: 7d818c38d1c055cd877b0b07ac8849621c233e47
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  derived-expiry-runtime:
    name: Derived expiry fixture runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out exact validation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Initialize evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/movie-buff-pr61-derived-runtime"
          {
            echo "validation_sha=${GITHUB_SHA}"
            echo "signed_composition_sha=${SIGNED_COMPOSITION_SHA}"
            echo "signed_composition_tree=${SIGNED_COMPOSITION_TREE}"
            echo "successor_mov17_sha=${SUCCESSOR_MOV17_SHA}"
          } >"${RUNNER_TEMP}/movie-buff-pr61-derived-runtime/identity.txt"

      - name: Verify exact validation identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "validation/movie-buff-pr55-core-v3"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          test -z "$(git status --porcelain)"
          test ! -f supabase/.temp/project-ref
          test "$(supabase --version)" = "2.111.0"
          test "$(git rev-parse "${SIGNED_COMPOSITION_SHA}^{tree}")" = "${SIGNED_COMPOSITION_TREE}"
          git merge-base --is-ancestor "${SIGNED_COMPOSITION_SHA}" HEAD
          git merge-base --is-ancestor "${SUCCESSOR_MOV17_SHA}" "${SIGNED_COMPOSITION_SHA}"

      - name: Derive and execute corrected expiry fixture
        id: evidence
        shell: bash
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/movie-buff-pr61-derived-runtime
          TEST_PATH: supabase/tests/movie_buff_buster_leave_authority_runtime_test.sql
        run: |
          set -uo pipefail
          mkdir -p "${EVIDENCE_ROOT}"

          restore_checkout() {
            local code=$?
            set +e
            git update-index --no-assume-unchanged "${TEST_PATH}" >/dev/null 2>&1
            git checkout -- "${TEST_PATH}" >/dev/null 2>&1
            exit "${code}"
          }
          trap restore_checkout EXIT

          python3 - "${TEST_PATH}" "${EVIDENCE_ROOT}" <<'PY'
          import difflib
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          evidence = pathlib.Path(sys.argv[2])
          original = path.read_text(encoding="utf-8")
          needle = """  update public.movie_buff_active_leave_quotes
            set expires_at = pg_catalog.clock_timestamp() - interval '1 second'
            where quote_token = (v_expired_quote ->> 'quoteToken')::uuid;
          """
          replacement = """  update public.movie_buff_active_leave_quotes
            set
              created_at = pg_catalog.clock_timestamp() - interval '2 seconds',
              expires_at = pg_catalog.clock_timestamp() - interval '1 second'
            where quote_token = (v_expired_quote ->> 'quoteToken')::uuid;
          """
          count = original.count(needle)
          if count != 1:
              raise SystemExit(f"expected one expiry fixture block; found {count}")
          patched = original.replace(needle, replacement, 1)
          path.write_text(patched, encoding="utf-8")

          (evidence / "original-runtime-test.sha256").write_text(
              hashlib.sha256(original.encode()).hexdigest() + "  original-runtime-test.sql\n",
              encoding="utf-8",
          )
          (evidence / "derived-runtime-test.sha256").write_text(
              hashlib.sha256(patched.encode()).hexdigest() + "  derived-runtime-test.sql\n",
              encoding="utf-8",
          )
          (evidence / "derived-expiry-fixture.patch").write_text(
              "".join(
                  difflib.unified_diff(
                      original.splitlines(True),
                      patched.splitlines(True),
                      fromfile="a/" + str(path),
                      tofile="b/" + str(path) + ".derived",
                  )
              ),
              encoding="utf-8",
          )
          (evidence / "derivation-metadata.txt").write_text(
              "derivation_scope=validation_fixture_only\n"
              "reason=expired quote simulation must preserve expires_at greater than created_at\n"
              "product_sql_changed=false\n"
              "signed_composition_sha=7b729bfe7920549d9f544dda777e1383f3fff976\n"
              "signed_composition_tree=0d272f53601b42fae69e3bd51bfe2a8cdc852f7a\n"
              "successor_mov17_sha=7d818c38d1c055cd877b0b07ac8849621c233e47\n",
              encoding="utf-8",
          )
          PY

          git diff --check -- "${TEST_PATH}"
          git update-index --assume-unchanged "${TEST_PATH}"
          test -z "$(git status --porcelain)"

          bash scripts/movie-buff-buster-leave-local-evidence.sh \
            "${GITHUB_SHA}" \
            "${EVIDENCE_ROOT}"

      - name: Verify restored clean checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git update-index --no-assume-unchanged \
            supabase/tests/movie_buff_buster_leave_authority_runtime_test.sql \
            >/dev/null 2>&1 || true
          git checkout -- \
            supabase/tests/movie_buff_buster_leave_authority_runtime_test.sql
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Upload derived exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-pr61-derived-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/movie-buff-pr61-derived-runtime
          if-no-files-found: error
          retention-days: 7
