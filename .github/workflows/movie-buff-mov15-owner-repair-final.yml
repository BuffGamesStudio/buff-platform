name: MOV-15 final one-shot owner repair

on:
  push:
    branches:
      - copilot/MOV-15-public-matchmaking
    paths:
      - ".github/workflows/movie-buff-mov15-owner-repair-final.yml"

permissions:
  contents: write

jobs:
  repair:
    name: Finalize exact MOV-15 owner repair
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify immutable parent and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "copilot/MOV-15-public-matchmaking"
          test "$(git rev-parse HEAD^)" = "64b4de1ae97d8ffdff39dfd90e32e3f52ead6f38"
          test -z "$(git status --porcelain)"

      - name: Apply exact approved repair and normalize EOF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(
              ".github/workflows/movie-buff-mov15-owner-repair-v2.yml"
          ).read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, "mov15-owner-repair-v2", "exec"))

          contract_path = Path(
              "tests/movie-buff-public-matchmaking-contract.test.mjs"
          )
          contract_path.write_text(
              contract_path.read_text(encoding="utf-8").rstrip() + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify focused contracts and exact source boundary
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/movie-buff-public-matchmaking-contract.test.mjs \
            tests/movie-buff-public-matchmaking-handoff.test.mjs
          ! grep -nE 'handleQuickStart|["'"']Start Match["'"']' \
            src/app/games/movie-buff/lobby/LobbyClient.tsx
          grep -n 'handleFindMatch' src/app/games/movie-buff/lobby/LobbyClient.tsx
          grep -n 'handleCreateRoom' src/app/games/movie-buff/lobby/LobbyClient.tsx
          test "$(grep -c 'src/app/games/movie-buff/lobby/LobbyClient.tsx' .github/workflows/movie-buff-mov15-validation.yml)" -eq 2
          git diff --check

      - name: Commit owner repair and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "movie-buff-agent-2"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/movie-buff-mov15-owner-repair.yml \
            .github/workflows/movie-buff-mov15-owner-repair-v2.yml \
            .github/workflows/movie-buff-mov15-owner-repair-diagnostics.yml \
            .github/workflows/movie-buff-mov15-owner-repair-diagnostics-v2.yml \
            .github/workflows/movie-buff-mov15-owner-repair-final.yml
          git add \
            src/app/games/movie-buff/lobby/LobbyClient.tsx \
            tests/movie-buff-public-matchmaking-contract.test.mjs \
            .github/workflows/movie-buff-mov15-validation.yml
          git diff --cached --check
          git commit -m "MOV-15 remove duplicate manual start path"
          git push origin HEAD:copilot/MOV-15-public-matchmaking
