name: MOV-18 rollback containment and forward reapply v1

on:
  push:
    branches: [validation/movie-buff-mov18-rollback-forward-v1]
    paths: [".github/workflows/movie-buff-mov18-rollback-forward-v1.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ed9d4f08692c892258415d88d68f06b41a174b24
  SOURCE_TREE: c5e4d90c9a09734c8e671c765ed2e52126ad64ca
  BASE_SHA: bf316a15a2120e32d8a32e479df2ae439081f9a1
  EXPECTED_BRANCH: validation/movie-buff-mov18-rollback-forward-v1

jobs:
  exact-rollback-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bind exact source and create detached rehearsal
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${SOURCE_SHA}"
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = "${SOURCE_TREE}"
          test -z "$(git status --porcelain)"
          root="${RUNNER_TEMP}/mov18-rollback-forward"
          worktree="${RUNNER_TEMP}/mov18-rollback-forward-worktree"
          mkdir -p "$root"
          git diff --binary "${BASE_SHA}" "${SOURCE_SHA}" >"$root/mov18-source.patch"
          test -s "$root/mov18-source.patch"
          git worktree add --detach "$worktree" "$SOURCE_SHA" >"$root/worktree-add.log" 2>&1
          echo "$worktree" >"$root/worktree.path"
          echo "0" >"$root/worktree-add.exit"
      - name: Rehearse full rollback containment
        shell: bash
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-rollback-publishable-placeholder
          SUPABASE_SERVICE_ROLE_KEY: local-rollback-service-placeholder
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mov18-rollback-forward"
          worktree="$(cat "$root/worktree.path")"
          git -C "$worktree" apply -R --index "$root/mov18-source.patch"
          rollback_tree="$(git -C "$worktree" write-tree)"
          expected_base_tree="$(git rev-parse "${BASE_SHA}^{tree}")"
          test "$rollback_tree" = "$expected_base_tree"
          echo "$rollback_tree" >"$root/rollback.tree"
          (
            cd "$worktree"
            npm ci --ignore-scripts --no-audit --no-fund
            npm run build
          ) >"$root/rollback-build.log" 2>&1
          echo "0" >"$root/rollback-build.exit"
      - name: Reapply exact forward source and validate
        shell: bash
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-forward-publishable-placeholder
          SUPABASE_SERVICE_ROLE_KEY: local-forward-service-placeholder
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mov18-rollback-forward"
          worktree="$(cat "$root/worktree.path")"
          git -C "$worktree" apply --index "$root/mov18-source.patch"
          forward_tree="$(git -C "$worktree" write-tree)"
          test "$forward_tree" = "${SOURCE_TREE}"
          test -z "$(git -C "$worktree" status --porcelain)"
          echo "$forward_tree" >"$root/forward.tree"
          (
            cd "$worktree"
            npm ci --ignore-scripts --no-audit --no-fund
            node --test tests/movie-buff-visual-runtime.test.mjs
            npx --no-install tsc --noEmit
            npm run build
          ) >"$root/forward-validation.log" 2>&1
          echo "0" >"$root/forward-validation.exit"
      - name: Remove detached rehearsal and create evidence manifest
        if: always()
        shell: bash
        run: |
          set +e
          root="${RUNNER_TEMP}/mov18-rollback-forward"
          worktree="$(cat "$root/worktree.path" 2>/dev/null || true)"
          cleanup=0
          if [[ -n "$worktree" ]]; then
            git worktree remove --force "$worktree" >"$root/worktree-remove.log" 2>&1 || cleanup=$?
          fi
          echo "$cleanup" >"$root/worktree-remove.exit"
          {
            echo "repository=BuffGamesStudio/buff-platform"
            echo "controller_sha=${GITHUB_SHA}"
            echo "source_sha=${SOURCE_SHA}"
            echo "source_tree=${SOURCE_TREE}"
            echo "base_sha=${BASE_SHA}"
            echo "base_tree=$(git rev-parse "${BASE_SHA}^{tree}")"
            echo "rollback_tree=$(cat "$root/rollback.tree" 2>/dev/null || echo UNKNOWN)"
            echo "forward_tree=$(cat "$root/forward.tree" 2>/dev/null || echo UNKNOWN)"
            echo "cleanup_exit=$cleanup"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >"$root/metadata.txt"
          if grep -RIlE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|sb_(secret|publishable)_[A-Za-z0-9_-]+|postgres(ql)?://[^[:space:]]+|authorization:[[:space:]]*bearer' "$root"; then
            echo "secret scan failed" >"$root/secret-scan.txt"
            exit 1
          fi
          echo "secret_scan=PASS" >"$root/secret-scan.txt"
          (
            cd "$root"
            find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 sha256sum >sha256.txt
            sha256sum -c sha256.txt
          )
          exit "$cleanup"
      - name: Upload rollback and forward evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mov18-rollback-forward-${{ github.sha }}
          path: ${{ runner.temp }}/mov18-rollback-forward
          if-no-files-found: error
          retention-days: 7
      - name: Verify exact rehearsal result and clean controller
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mov18-rollback-forward"
          test "$(cat "$root/worktree-add.exit")" = 0
          test "$(cat "$root/rollback-build.exit")" = 0
          test "$(cat "$root/forward-validation.exit")" = 0
          test "$(cat "$root/worktree-remove.exit")" = 0
          test "$(cat "$root/rollback.tree")" = "$(git rev-parse "${BASE_SHA}^{tree}")"
          test "$(cat "$root/forward.tree")" = "${SOURCE_TREE}"
          git diff --check
          test -z "$(git status --porcelain)"
