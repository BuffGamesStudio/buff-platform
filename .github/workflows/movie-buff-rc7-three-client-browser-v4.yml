name: Movie Buff RC-7 exact three-client browser journey v4

on:
  pull_request:
    branches: [validation/movie-buff-rc7-runner-base-v4-20260806]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  PRODUCT_BRANCH: release/movie-buff-rc-2026-08-06-01-rc7
  PRODUCT_SHA: e050b1e436809d956b4e4fd02a2e14283a6d7d44
  PRODUCT_TREE: aa6aeedf1061620a09c7cc44fcdb247998dae772
  PARENT_SHA: e050b1e436809d956b4e4fd02a2e14283a6d7d44
  EXPECTED_BRANCH: validation/movie-buff-rc7-runner-base-v4-20260806
  CONTROLLER_BRANCH: validation/movie-buff-rc7-runner-base-v4-20260806
  EXPECTED_TRIGGER_BRANCH: validation/movie-buff-rc7-browser-run-v4-20260806
  CONTROLLER_SHA: ${{ github.event.pull_request.base.sha }}
  TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
  SOURCE_CONTROLLER_SHA: 23d650ec4a1c87d0cbcf3227cae1f11c0ce8bbf8
  SOURCE_CONTROLLER_BLOB: 4998a63cc9c399536b1aba86a075b15533a7f4eb
  ARCHIVE_SOURCE_SHA: d90a7eb73ef724b4ef5205343e655c7597dcf978
  ARCHIVE_WORKFLOW_BLOB: d85c32f629de0dbacb9c6d0f00efef79c256867a
  ARTIFACT_NAME: movie-buff-rc7-three-client-v4-${{ github.run_id }}-${{ github.run_attempt }}
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  exact-three-client-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Materialize reviewed RC-7 controller scripts
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${{ github.event.pull_request.base.ref }}" = "${CONTROLLER_BRANCH}"
          test "${{ github.event.pull_request.head.ref }}" = "${EXPECTED_TRIGGER_BRANCH}"
          test "$(git rev-parse HEAD)" = "${CONTROLLER_SHA}"
          test "$(git rev-parse HEAD^)" = "${PRODUCT_SHA}"
          test "$(git rev-parse "${PRODUCT_SHA}^{tree}")" = "${PRODUCT_TREE}"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          import subprocess
          expected={".github/workflows/movie-buff-rc7-three-client-browser-v4.yml"}
          actual=set(subprocess.check_output(["git","diff","--name-only","e050b1e436809d956b4e4fd02a2e14283a6d7d44..HEAD"],text=True).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected product-to-controller delta: {sorted(actual)}")
          PY
          git fetch --no-tags --depth=1 origin "${SOURCE_CONTROLLER_SHA}"
          test "$(git rev-parse "${SOURCE_CONTROLLER_SHA}:.github/workflows/movie-buff-rc6-three-client-browser-v3.yml")" = "${SOURCE_CONTROLLER_BLOB}"
          git show "${SOURCE_CONTROLLER_SHA}:.github/workflows/movie-buff-rc6-three-client-browser-v3.yml" > "${RUNNER_TEMP}/source-controller.yml"
          python3 - "${RUNNER_TEMP}/source-controller.yml" "${RUNNER_TEMP}" <<'PY'
          from pathlib import Path
          import sys
          source=Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          output=Path(sys.argv[2])
          names=[
            ("Provision runner prerequisites","01-provision.sh"),
            ("Bind immutable product and controller","02-bind.sh"),
            ("Execute repair static contract","03-static.sh"),
            ("Execute reviewed preflight","04-preflight.sh"),
            ("Prove repaired local database ACL matrix","05-database.sh"),
            ("Execute disposable three-client journey","06-browser.sh"),
            ("Record binding, sanitize evidence, and write final hashes","07-record.sh"),
            ("Verify clean postflight","08-clean.sh"),
            ("Verify hashes, binding, database contract, redaction, and journey checks","09-inspect.sh"),
          ]
          replacements={
            "release/movie-buff-rc-2026-08-06-01-rc6":"release/movie-buff-rc-2026-08-06-01-rc7",
            "57c7742f9a65bf356b72645daa5502e2c06a3a8e":"e050b1e436809d956b4e4fd02a2e14283a6d7d44",
            "788468aad53e740b8527cc2289082b2c5452cfc1":"aa6aeedf1061620a09c7cc44fcdb247998dae772",
            "validation/movie-buff-rc6-runner-base-v3-20260806":"validation/movie-buff-rc7-runner-base-v4-20260806",
            "validation/movie-buff-rc6-browser-run-v3-20260806":"validation/movie-buff-rc7-browser-run-v4-20260806",
            ".github/workflows/movie-buff-rc6-three-client-browser-v3.yml":".github/workflows/movie-buff-rc7-three-client-browser-v4.yml",
            "rc6-static":"rc7-static",
            "rc6-db":"rc7-db",
            "RC-6":"RC-7",
            "${{ github.event.pull_request.base.ref }}":"${CONTROLLER_BRANCH}",
            "${{ github.event.pull_request.head.ref }}":"${EXPECTED_TRIGGER_BRANCH}",
          }
          def extract(step_name):
              marker=f"- name: {step_name}"
              start=next(i for i,line in enumerate(source) if line.strip()==marker)
              run_line=next(i for i in range(start+1,len(source)) if source[i].strip()=="run: |")
              indent=len(source[run_line])-len(source[run_line].lstrip())
              body=[]
              for line in source[run_line+1:]:
                  if line.strip() and len(line)-len(line.lstrip()) <= indent:
                      break
                  body.append(line[indent+2:] if line.strip() else "")
              value="\n".join(body)+"\n"
              for old,new in replacements.items():
                  value=value.replace(old,new)
              if "${{" in value:
                  raise SystemExit(f"unresolved workflow expression in {step_name}")
              return value
          for step_name,filename in names:
              value=extract(step_name)
              path=output/filename
              path.write_text(value,encoding="utf-8")
          PY
          for script in "${RUNNER_TEMP}"/0*.sh; do bash -n "${script}"; done

      - name: Provision runner prerequisites
        run: bash "${RUNNER_TEMP}/01-provision.sh"

      - name: Bind immutable product and reviewed harness
        run: bash "${RUNNER_TEMP}/02-bind.sh"

      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - id: static
        name: Execute repair static contract
        run: bash "${RUNNER_TEMP}/03-static.sh"

      - id: preflight
        name: Execute reviewed preflight
        run: bash "${RUNNER_TEMP}/04-preflight.sh"

      - id: database
        name: Prove repaired local database ACL matrix
        run: bash "${RUNNER_TEMP}/05-database.sh"

      - id: browser
        name: Execute disposable three-client journey
        run: bash "${RUNNER_TEMP}/06-browser.sh"

      - name: Ensure failure evidence exists
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/movie-buff-three-client-full-v2"
          mkdir -p "${evidence}"
          if [ ! -s "${RUNNER_TEMP}/rc7-static-contract.json" ]; then
            printf '%s\n' '{"classification":"FAIL","reason":"static contract did not produce PASS evidence"}' > "${RUNNER_TEMP}/rc7-static-contract.json"
          fi
          if [ ! -s "${RUNNER_TEMP}/rc7-db-contract.json" ]; then
            printf '%s\n' '{"classification":"FAIL","reason":"database contract did not produce PASS evidence"}' > "${RUNNER_TEMP}/rc7-db-contract.json"
          fi
          if [ ! -s "${evidence}/three-client-full-journey-v2.json" ]; then
            printf '%s\n' '{"classification":"FAIL","failure":"browser journey did not produce a result artifact"}' > "${evidence}/three-client-full-journey-v2.json"
          fi

      - name: Record binding, sanitize evidence, and write final hashes
        if: always()
        run: bash "${RUNNER_TEMP}/07-record.sh"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/movie-buff-three-client-full-v2
          if-no-files-found: error
          retention-days: 30

      - name: Verify clean postflight
        if: always()
        run: bash "${RUNNER_TEMP}/08-clean.sh"

  independent-artifact-inspection:
    if: ${{ always() }}
    needs: exact-three-client-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: evidence

      - name: Materialize independent inspector
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${SOURCE_CONTROLLER_SHA}"
          test "$(git rev-parse "${SOURCE_CONTROLLER_SHA}:.github/workflows/movie-buff-rc6-three-client-browser-v3.yml")" = "${SOURCE_CONTROLLER_BLOB}"
          git show "${SOURCE_CONTROLLER_SHA}:.github/workflows/movie-buff-rc6-three-client-browser-v3.yml" > "${RUNNER_TEMP}/source-controller.yml"
          python3 - "${RUNNER_TEMP}/source-controller.yml" "${RUNNER_TEMP}/inspect.sh" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          marker="- name: Verify hashes, binding, database contract, redaction, and journey checks"
          start=next(i for i,line in enumerate(lines) if line.strip()==marker)
          run_line=next(i for i in range(start+1,len(lines)) if lines[i].strip()=="run: |")
          indent=len(lines[run_line])-len(lines[run_line].lstrip())
          body=[]
          for line in lines[run_line+1:]:
              if line.strip() and len(line)-len(line.lstrip()) <= indent:
                  break
              body.append(line[indent+2:] if line.strip() else "")
          value="\n".join(body)+"\n"
          for old,new in {
            "57c7742f9a65bf356b72645daa5502e2c06a3a8e":"e050b1e436809d956b4e4fd02a2e14283a6d7d44",
            "788468aad53e740b8527cc2289082b2c5452cfc1":"aa6aeedf1061620a09c7cc44fcdb247998dae772",
          }.items():
              value=value.replace(old,new)
          Path(sys.argv[2]).write_text(value,encoding="utf-8")
          PY
          bash -n "${RUNNER_TEMP}/inspect.sh"

      - name: Verify exact artifact independently
        run: bash "${RUNNER_TEMP}/inspect.sh"
