name: Movie Buff RC-5 exact three-client browser journey v2

on:
  pull_request:
    branches: [validation/movie-buff-rc5-runner-base-v2-20260806]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  PRODUCT_BRANCH: release/movie-buff-rc-2026-08-06-01-rc5
  PRODUCT_SHA: 217e84a17c994e28886bb0445257c0d7eb1c285f
  PRODUCT_TREE: ae456b2f04a28a966e9d18d8c05e0964998e713d
  PARENT_SHA: 217e84a17c994e28886bb0445257c0d7eb1c285f
  EXPECTED_BRANCH: validation/movie-buff-rc5-runner-base-v2-20260806
  CONTROLLER_BRANCH: validation/movie-buff-rc5-runner-base-v2-20260806
  EXPECTED_TRIGGER_BRANCH: validation/movie-buff-rc5-browser-run-v2-20260806
  CONTROLLER_SHA: ${{ github.event.pull_request.base.sha }}
  TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
  ARCHIVE_SOURCE_SHA: d90a7eb73ef724b4ef5205343e655c7597dcf978
  ARCHIVE_WORKFLOW_BLOB: d85c32f629de0dbacb9c6d0f00efef79c256867a
  ARTIFACT_NAME: movie-buff-rc5-three-client-v2-${{ github.run_id }}-${{ github.run_attempt }}
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  exact-three-client-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Provision runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg postgresql-client
          command -v bash
          command -v git
          command -v node
          command -v npm
          command -v python3
          command -v supabase
          command -v ffmpeg
          command -v ffprobe
          command -v psql

      - name: Bind immutable product and controller
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${{ github.event.pull_request.base.ref }}" = "${CONTROLLER_BRANCH}"
          test "${{ github.event.pull_request.head.ref }}" = "${EXPECTED_TRIGGER_BRANCH}"
          test "$(git rev-parse HEAD)" = "${CONTROLLER_SHA}"
          test "$(git rev-parse HEAD^)" = "${PRODUCT_SHA}"
          test "$(git rev-parse "${PRODUCT_SHA}^{tree}")" = "${PRODUCT_TREE}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          import subprocess
          expected={".github/workflows/movie-buff-rc5-three-client-browser-v2.yml"}
          actual=set(subprocess.check_output(["git","diff","--name-only","217e84a17c994e28886bb0445257c0d7eb1c285f..HEAD"],text=True).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected product-to-controller delta: {sorted(actual)}")
          PY
          git fetch --no-tags --depth=1 origin "${ARCHIVE_SOURCE_SHA}"
          test "$(git rev-parse "${ARCHIVE_SOURCE_SHA}:.github/validation-archive/movie-buff-three-client-full-journey-v2.yml")" = "${ARCHIVE_WORKFLOW_BLOB}"
          git show "${ARCHIVE_SOURCE_SHA}:.github/validation-archive/movie-buff-three-client-full-journey-v2.yml" > "${RUNNER_TEMP}/reviewed-lab.yml"
          python3 - "${RUNNER_TEMP}" "${RUNNER_TEMP}/reviewed-lab.yml" <<'PY'
          from pathlib import Path
          import sys
          output=Path(sys.argv[1])
          lines=Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()
          def extract(step_name):
              marker=f"- name: {step_name}"
              start=next(i for i,line in enumerate(lines) if line.strip()==marker)
              run_line=next(i for i in range(start+1,len(lines)) if lines[i].strip()=="run: |")
              run_indent=len(lines[run_line])-len(lines[run_line].lstrip())
              body=[]
              for line in lines[run_line+1:]:
                  if line.strip() and len(line)-len(line.lstrip()) <= run_indent:
                      break
                  body.append(line[run_indent+2:] if line.strip() else "")
              if not body:
                  raise SystemExit(f"empty run block for {step_name}")
              return "\n".join(body)+"\n"
          preflight=extract("Bind exact source and validate harness")
          execute=extract("Execute disposable exact-SHA browser journey v2")
          for old,new in (("${GITHUB_REF_NAME}","${CONTROLLER_BRANCH}"),("${GITHUB_SHA}","${CONTROLLER_SHA}")):
              preflight=preflight.replace(old,new)
              execute=execute.replace(old,new)
          execute=execute.replace('git status --porcelain >"${raw}/git-status-before-repair.txt"','git status --porcelain --untracked-files=all >"${raw}/git-status-before-repair.txt"')
          old='\n'.join(['allowed={"next-env.d.ts",fixture}',"unexpected=[]","for line in status:",'    path=line[3:].strip()','    if " -> " in path: path=path.split(" -> ",1)[1]',"    if path not in allowed: unexpected.append(line)",'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))'])
          new='\n'.join(['allowed={"next-env.d.ts",fixture}','allowed_prefixes=("public/media/movie-buff/runtime-generated/",)',"unexpected=[]","for line in status:",'    path=line[3:].strip()','    if " -> " in path: path=path.split(" -> ",1)[1]',"    if path not in allowed and not path.startswith(allowed_prefixes): unexpected.append(line)",'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))'])
          if old not in execute:
              raise SystemExit("postflight status-shape anchor missing")
          execute=execute.replace(old,new)
          cleanup='\n'.join(['rm -f "${fixture}"',"git checkout -- next-env.d.ts >/dev/null 2>&1 || true","rmdir public/media/movie-buff public/media 2>/dev/null || true"])
          replacement='\n'.join(['rm -f "${fixture}"',"rm -rf public/media/movie-buff/runtime-generated","git checkout -- next-env.d.ts >/dev/null 2>&1 || true","rmdir public/media/movie-buff public/media 2>/dev/null || true"])
          if cleanup not in execute:
              raise SystemExit("runtime-generated cleanup anchor missing")
          execute=execute.replace(cleanup,replacement)
          (output/"browser-preflight.sh").write_text(preflight,encoding="utf-8")
          (output/"browser-execute.sh").write_text(execute,encoding="utf-8")
          PY
          bash -n "${RUNNER_TEMP}/browser-preflight.sh"
          bash -n "${RUNNER_TEMP}/browser-execute.sh"
          node --check scripts/movie-buff-three-client-full-journey-v2.mjs
          node --check scripts/movie-buff-core-v11-local-users.mjs

      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Execute reviewed preflight
        shell: bash
        run: |
          set +e
          evidence="${RUNNER_TEMP}/movie-buff-three-client-full-v2"
          mkdir -p "${evidence}"
          bash -x "${RUNNER_TEMP}/browser-preflight.sh" >"${evidence}/reviewed-preflight.log" 2>&1
          exit_code=$?
          echo "${exit_code}" >"${evidence}/reviewed-preflight.exit"
          cat "${evidence}/reviewed-preflight.log"
          exit "${exit_code}"

      - name: Execute disposable three-client journey
        shell: bash
        run: bash "${RUNNER_TEMP}/browser-execute.sh"

      - name: Record binding and final hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/movie-buff-three-client-full-v2"
          mkdir -p "${evidence}"
          controller_tree="$(git rev-parse HEAD^{tree})"
          workflow_blob="$(git rev-parse HEAD:.github/workflows/movie-buff-rc5-three-client-browser-v2.yml)"
          python3 - "${evidence}/exact-binding.json" "${controller_tree}" "${workflow_blob}" <<'PY'
          import json,os,pathlib,sys
          payload={
            "repository":"BuffGamesStudio/buff-platform",
            "productBranch":os.environ["PRODUCT_BRANCH"],
            "productSha":os.environ["PRODUCT_SHA"],
            "productTree":os.environ["PRODUCT_TREE"],
            "controllerBranch":os.environ["CONTROLLER_BRANCH"],
            "controllerSha":os.environ["CONTROLLER_SHA"],
            "controllerTree":sys.argv[2],
            "controllerWorkflowBlob":sys.argv[3],
            "triggerSha":os.environ["TRIGGER_SHA"],
            "runId":os.environ["GITHUB_RUN_ID"],
            "runAttempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "target":"disposable-localhost",
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          PY
          (
            cd "${evidence}"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/movie-buff-three-client-full-v2
          if-no-files-found: error
          retention-days: 30

      - name: Verify clean postflight
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

  independent-artifact-inspection:
    if: ${{ always() }}
    needs: exact-three-client-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download exact artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: evidence

      - name: Verify hashes, binding, redaction, and journey checks
        shell: bash
        run: |
          set -euo pipefail
          cd evidence
          test -s exact-binding.json
          test -s three-client-full-journey-v2.json
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          import json,pathlib
          binding=json.loads(pathlib.Path("exact-binding.json").read_text())
          result=json.loads(pathlib.Path("three-client-full-journey-v2.json").read_text())
          assert binding["repository"] == "BuffGamesStudio/buff-platform"
          assert binding["productSha"] == "217e84a17c994e28886bb0445257c0d7eb1c285f"
          assert binding["productTree"] == "ae456b2f04a28a966e9d18d8c05e0964998e713d"
          assert result["classification"] == "PASS", result.get("failure")
          assert result["sha"] == binding["controllerSha"]
          assert result["tree"] == binding["controllerTree"]
          assert result["parentSha"] == binding["productSha"]
          assert binding["productSha"] in result["parents"]
          assert result["pageErrorCount"] == 0
          assert result["consoleErrorCount"] == 0
          assert result["failedResponseCount"] == 0
          unexpected=[item for item in result["failedRequests"] if not item.get("expectedOfflineExercise") and item.get("errorText") != "net::ERR_ABORTED"]
          assert not unexpected, unexpected
          checks={item["name"]:item["classification"] for item in result["checks"]}
          required={
            "three-independent-chromium-processes",
            "three-authenticated-public-players",
            "waiting-room-three-player-convergence-and-automatic-start",
            "round-intro-private-vip-lock-and-shared-countdown",
            "cinematic-board-selector-only-control-and-observers",
            "keyboard-selector-tile-choice",
            "cinematic-transition-shared-playback-start",
            "stale-client-rejected",
            "synchronized-automatic-playback",
            "refresh-restores-authoritative-session",
            "offline-reconnect-restores-authoritative-session",
            "shared-answer-deadline",
            "browser-back-forward-reconciles-to-authoritative-phase",
            "synchronized-results-automatic-return-countdown",
            "automatic-board-return-selector-rotation-used-tile-buster",
            "no-hydration-runtime-console-or-unexpected-network-failures",
          }
          missing=sorted(name for name in required if checks.get(name) != "PASS")
          assert not missing, missing
          PY
          if grep -RIE --binary-files=without-match '(sb_secret_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}|postgres(ql)?://[^[:space:]"'"']+:[^[:space:]"'"']+@)' .; then
            echo "credential-shaped material found in artifact" >&2
            exit 1
          fi
