name: MOV-17 exact localhost phase and reconnect races v2

on:
  push:
    branches:
      - validation/movie-buff-mov17-races-20260807-v2
    paths:
      - ".github/workflows/movie-buff-mov17-local-races-v2.yml"
      - "scripts/movie-buff-mov17-local-race-evidence.sh"
  pull_request:
    branches:
      - integration/movie-buff
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_SHA: 6d0f48b9717a06d09b8522aa8c5aaa4b7480ef6d
  PRODUCT_TREE: 0034a815b72c50b70150a1b69e4e0025016e4dfe
  CONTROLLER_BRANCH: validation/movie-buff-mov17-races-20260807-v2
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  local-races:
    name: Execute three-client phase and reconnect race proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out validation controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Bind exact product and controller isolation
        shell: bash
        run: |
          set -euo pipefail
          resolved_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${resolved_branch}" = "${CONTROLLER_BRANCH}"
          test "$(git rev-parse "${PRODUCT_SHA}^{tree}")" = "${PRODUCT_TREE}"
          git merge-base --is-ancestor "${PRODUCT_SHA}" HEAD
          actual="$(git diff --name-only "${PRODUCT_SHA}"..HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/movie-buff-mov17-local-races-v2.yml \
            scripts/movie-buff-mov17-local-race-evidence.sh | sort)"
          test "${actual}" = "${expected}"
          test -z "$(git status --porcelain --untracked-files=all)"
          bash -n scripts/movie-buff-mov17-local-race-evidence.sh
          node --check scripts/movie-buff-three-client-phase-evidence-runner.mjs
          node --check scripts/movie-buff-three-client-phase-proof.mjs
          node --check scripts/movie-buff-reconnect-race-proof.mjs

      - name: Prepare disposable fixture grants
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/movie-buff-mov17-local-race-evidence.sh "${RUNNER_TEMP}/mov17-race-lab.sh"
          python3 - "${RUNNER_TEMP}/mov17-race-lab.sh" <<'PY'
          import pathlib,sys
          path=pathlib.Path(sys.argv[1])
          text=path.read_text(encoding='utf-8')
          anchor='  [[ -n "$publishable_key" && -n "$service_key" ]] || { fail credential-shape; return 1; }\n'
          lines=[
            '  [[ -n "$publishable_key" && -n "$service_key" ]] || { fail credential-shape; return 1; }',
            '  local database_url="${DB_URL:-}"',
            '  [[ -n "$database_url" ]] || { fail database-url; return 1; }',
            '',
            '  cat >"$EVIDENCE_ROOT/local-fixture-grants.sql" <<\'SQL\'',
            '-- Disposable localhost fixture scaffolding only. These grants are not product,',
            '-- staging, hosted, or production security evidence.',
            'grant select, insert, update, delete on table',
            '  public.game_rooms,',
            '  public.room_players,',
            '  public.matches,',
            '  public.match_players,',
            '  public.match_rounds,',
            '  public.movie_buff_boards,',
            '  public.movie_buff_board_categories,',
            '  public.movie_buff_board_tiles,',
            '  public.movies,',
            '  public.clips',
            '  to service_role;',
            'SQL',
            '  run_step fixture-grants psql "$database_url" -X -v ON_ERROR_STOP=1 \\',
            '    -f "$EVIDENCE_ROOT/local-fixture-grants.sql" \\',
            '    || { fail fixture-grants; return 1; }',
          ]
          if anchor not in text:
              raise SystemExit('credential anchor missing')
          path.write_text(text.replace(anchor,'\n'.join(lines)+'\n',1),encoding='utf-8')
          PY
          bash -n "${RUNNER_TEMP}/mov17-race-lab.sh"
          grep -q 'Disposable localhost fixture scaffolding only' "${RUNNER_TEMP}/mov17-race-lab.sh"

      - name: Execute disposable exact-product race laboratory
        shell: bash
        run: |
          evidence_dir="${RUNNER_TEMP}/mov17-race-evidence"
          bash "${RUNNER_TEMP}/mov17-race-lab.sh" \
            "${PRODUCT_SHA}" \
            "${PRODUCT_TREE}" \
            "${evidence_dir}"

      - name: Upload portable race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mov17-races-${{ env.PRODUCT_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mov17-race-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Verify clean controller checkout
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
