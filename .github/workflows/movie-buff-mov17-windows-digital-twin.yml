name: MOV-17 Windows digital twin

on:
  push:
    branches:
      - validation/MOV-17-encoding-twin-v2
    paths:
      - ".github/workflows/movie-buff-mov17-windows-digital-twin.yml"
      - "scripts/movie-buff-mov17-windows-digital-twin.ps1"
      - "scripts/movie-buff-three-client-phase-proof.mjs"
      - "scripts/movie-buff-reconnect-race-proof.mjs"
      - "scripts/movie-buff-three-client-phase-evidence-runner.mjs"
      - "supabase/migrations/20260804083*_movie_buff_*.sql"
      - "supabase/rollbacks/20260804083*_movie_buff_*.sql"
      - "tests/movie-buff-server-phase-machine.test.mjs"
      - "tests/movie-buff-authoritative-phase-runtime.test.mjs"
      - "tests/movie-buff-buster-safe-boundary.test.mjs"
      - "tests/movie-buff-phase-tile-mutation-guard.test.mjs"
  pull_request:
    branches:
      - integration/movie-buff
    paths:
      - ".github/workflows/movie-buff-mov17-windows-digital-twin.yml"
      - "scripts/movie-buff-mov17-windows-digital-twin.ps1"
      - "scripts/movie-buff-three-client-phase-proof.mjs"
      - "scripts/movie-buff-reconnect-race-proof.mjs"
      - "scripts/movie-buff-three-client-phase-evidence-runner.mjs"
      - "supabase/migrations/20260804083*_movie_buff_*.sql"
      - "supabase/rollbacks/20260804083*_movie_buff_*.sql"
      - "tests/movie-buff-server-phase-machine.test.mjs"
      - "tests/movie-buff-authoritative-phase-runtime.test.mjs"
      - "tests/movie-buff-buster-safe-boundary.test.mjs"
      - "tests/movie-buff-phase-tile-mutation-guard.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-digital-twin:
    name: Windows PowerShell command-shell digital twin
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BRANCH: validation/MOV-17-encoding-twin-v2

    steps:
      - name: Check out exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Windows runner identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resolvedRef = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          if ($resolvedRef -ne $env:EXPECTED_BRANCH) { throw "Branch mismatch: $resolvedRef" }
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'SHA mismatch' }
          if (git status --porcelain) { throw 'Checkout is not clean' }
          $PSVersionTable | Out-String
          node --version
          npm --version

      - name: Execute checked-in PowerShell wrapper
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'mov17-windows-evidence'
          ./scripts/movie-buff-mov17-windows-digital-twin.ps1 `
            -ExpectedSha $env:EXPECTED_SHA `
            -EvidenceRoot $evidenceRoot

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mov17-windows-digital-twin-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}\mov17-windows-evidence
          if-no-files-found: error
          retention-days: 7
