name: MOV-18 browser accessibility and fallback evidence

on:
  push:
    branches:
      - copilot/MOV-18-visual-motion-runtime
    paths:
      - .github/workflows/movie-buff-mov18-browser-evidence.yml
      - scripts/movie-buff-mov18-browser-evidence.mjs
      - src/components/movie-buff/visual/**
      - src/lib/movie-buff/**
      - src/app/games/movie-buff/visual-runtime-preview/**
      - tests/movie-buff-visual-runtime.test.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mov-18-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: copilot/MOV-18-visual-motion-runtime
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  exact-browser-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bind exact identity and parse evidence driver
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          test -z "$(git status --porcelain)"
          node --check scripts/movie-buff-mov18-browser-evidence.mjs
          node --version
          npm --version

      - name: Install committed dependency graph
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run focused visual contracts
        shell: bash
        run: node --test tests/movie-buff-visual-runtime.test.mjs

      - name: Run TypeScript
        shell: bash
        run: npx --no-install tsc --noEmit

      - name: Build exact preview
        shell: bash
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-browser-publishable-placeholder
          SUPABASE_SERVICE_ROLE_KEY: local-browser-service-placeholder
        run: npm run build

      - name: Install ephemeral Chromium driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium
          test -z "$(git status --porcelain)"

      - name: Start exact local application
        shell: bash
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-browser-publishable-placeholder
          SUPABASE_SERVICE_ROLE_KEY: local-browser-service-placeholder
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mov18-browser-evidence"
          npm run start -- --hostname 127.0.0.1 --port 3001 \
            >"${RUNNER_TEMP}/mov18-browser-evidence/application.log" 2>&1 &
          echo "$!" >"${RUNNER_TEMP}/mov18-browser-evidence/application.pid"
          healthy=1
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3001/games/movie-buff/visual-runtime-preview >/dev/null; then
              healthy=0
              break
            fi
            if ! kill -0 "$(cat "${RUNNER_TEMP}/mov18-browser-evidence/application.pid")" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "$healthy" >"${RUNNER_TEMP}/mov18-browser-evidence/application-health.exit"
          exit "$healthy"

      - name: Execute browser, responsive, focus, fallback, and reduced-motion matrix
        shell: bash
        run: |
          set +e
          MOVIE_BUFF_APP_URL=http://127.0.0.1:3001 \
          MOVIE_BUFF_EXPECTED_GIT_SHA="${GITHUB_SHA}" \
          MOVIE_BUFF_EVIDENCE_DIR="${RUNNER_TEMP}/mov18-browser-evidence" \
            node scripts/movie-buff-mov18-browser-evidence.mjs \
            >"${RUNNER_TEMP}/mov18-browser-evidence/browser.stdout.log" \
            2>"${RUNNER_TEMP}/mov18-browser-evidence/browser.stderr.log"
          code=$?
          echo "$code" >"${RUNNER_TEMP}/mov18-browser-evidence/browser.exit"
          exit 0

      - name: Stop local application
        if: always()
        shell: bash
        run: |
          set +e
          evidence="${RUNNER_TEMP}/mov18-browser-evidence"
          mkdir -p "$evidence"
          pid_file="$evidence/application.pid"
          code=0
          if [[ -f "$pid_file" ]]; then
            kill "$(cat "$pid_file")" 2>/dev/null || true
            wait "$(cat "$pid_file")" 2>/dev/null || true
          fi
          echo "$code" >"$evidence/application-stop.exit"

      - name: Build portable evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/mov18-browser-evidence"
          mkdir -p "$evidence"
          cp scripts/movie-buff-mov18-browser-evidence.mjs "$evidence/driver.mjs"
          cp tests/movie-buff-visual-runtime.test.mjs "$evidence/contracts.test.mjs"
          {
            echo "classification=$([[ -f "$evidence/browser.exit" && "$(cat "$evidence/browser.exit")" = 0 ]] && echo PASS || echo FAIL)"
            echo "repository=BuffGamesStudio/buff-platform"
            echo "source_branch=${GITHUB_REF_NAME}"
            echo "source_sha=${GITHUB_SHA}"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "target=http://127.0.0.1:3001"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "playwright=1.54.2"
            echo "production_rive_assets=UNKNOWN"
            echo "figma_identity=UNKNOWN"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >"$evidence/metadata.txt"

          if grep -RIlE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|sb_(secret|publishable)_[A-Za-z0-9_-]+|postgres(ql)?://[^[:space:]]+|authorization:[[:space:]]*bearer' "$evidence"; then
            echo "secret scan failed" >&2
            exit 1
          fi
          echo "secret_scan=PASS" >"$evidence/secret-scan.txt"

          (
            cd "$evidence"
            find . -type f ! -name sha256.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > sha256.txt
            sha256sum -c sha256.txt
          )

      - name: Upload exact browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mov18-browser-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/mov18-browser-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Classify browser matrix
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${RUNNER_TEMP}/mov18-browser-evidence/browser.exit"
          test "$(cat "${RUNNER_TEMP}/mov18-browser-evidence/browser.exit")" = 0

      - name: Verify clean postflight
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
