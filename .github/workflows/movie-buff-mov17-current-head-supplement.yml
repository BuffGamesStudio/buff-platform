name: MOV-17 current-head supplemental validation

on:
  push:
    branches:
      - validation/MOV-17-encoding-twin-v2
    paths:
      - ".github/workflows/movie-buff-mov17-current-head-supplement.yml"
      - "scripts/movie-buff-mov17-local-supabase-evidence.sh"
      - "supabase/tests/movie_buff_match_start_handoff_test.sql"
      - "supabase/tests/movie_buff_match_start_handoff_rollback_test.sql"
      - "tests/movie-buff-match-start-handoff.test.mjs"
  pull_request:
    branches:
      - integration/movie-buff
    paths:
      - ".github/workflows/movie-buff-mov17-current-head-supplement.yml"
      - "scripts/movie-buff-mov17-local-supabase-evidence.sh"
      - "supabase/tests/movie_buff_match_start_handoff_test.sql"
      - "supabase/tests/movie_buff_match_start_handoff_rollback_test.sql"
      - "tests/movie-buff-match-start-handoff.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-current-head-supplement:
    name: Validate current MOV-17 match-start contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BRANCH: validation/MOV-17-encoding-twin-v2

    steps:
      - name: Check out exact composite SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify isolated exact checkout
        shell: bash
        run: |
          set -euo pipefail
          resolved_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${resolved_ref}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"

      - name: Install committed lock without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate current-head additions
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/mov17-current-head-supplement
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          bash -n scripts/movie-buff-mov17-local-supabase-evidence.sh
          node --test tests/movie-buff-match-start-handoff.test.mjs \
            2>&1 | tee "${EVIDENCE_DIR}/match-start-contract.tap"

      - name: Write exact-SHA metadata and hashes
        if: always()
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/mov17-current-head-supplement
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          git diff --check
          test -z "$(git status --porcelain)"
          {
            echo "lane=MOV-17-validation-twin-v2-current-head-supplement"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_ref=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            echo "runner_os=${RUNNER_OS}"
            echo "node_version=$(node --version)"
            echo "target_kind=repository-contract-supplement"
            echo "database_behavior=UNKNOWN"
            echo "browser_behavior=UNKNOWN"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${EVIDENCE_DIR}/metadata.txt"
          (
            cd "${EVIDENCE_DIR}"
            find . -maxdepth 1 -type f ! -name sha256.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > sha256.txt
            sha256sum -c sha256.txt
          )

      - name: Upload supplemental exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mov17-current-head-supplement-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/mov17-current-head-supplement
          if-no-files-found: error
          retention-days: 7
