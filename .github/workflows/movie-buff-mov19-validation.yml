name: MOV-19 independent validation evidence

on:
  pull_request:
    branches:
      - integration/movie-buff
    paths:
      - ".github/workflows/movie-buff-mov19-validation.yml"
      - "docs/security/**"
      - "scripts/movie-buff-security-evidence.mjs"
      - "scripts/movie-buff-three-client-validation.mjs"
      - "supabase/tests/movie_buff_security_validation_test.sql"
      - "tests/movie-buff-independent-security-validation.test.mjs"
      - "tests/movie-buff-release-evidence-integrity.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mov19:
    name: Validate MOV-19 evidence boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BRANCH: copilot/MOV-19-security-validation
      EVIDENCE_DIR: ${{ runner.temp }}/mov19-evidence

    steps:
      - name: Check out exact MOV-19 SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify isolated exact checkout
        shell: bash
        run: |
          set -euo pipefail
          resolved_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${resolved_ref}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"
          node --version
          npm --version

      - name: Install committed lock without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run validator self-guards
        shell: bash
        env:
          MOVIE_BUFF_VALIDATION_ROOT: ${{ github.workspace }}
          MOVIE_BUFF_VALIDATION_SHA: ${{ env.EXPECTED_SHA }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          node --test \
            --test-name-pattern="target root|collector forbids|collector evaluates" \
            tests/movie-buff-independent-security-validation.test.mjs \
            2>&1 | tee "${EVIDENCE_DIR}/validator-self-tests.tap"

      - name: Collect repository-static release findings
        shell: bash
        run: |
          set -euo pipefail
          set +e
          MOVIE_BUFF_EVIDENCE_OUTPUT="${EVIDENCE_DIR}/repository-static-evidence.json" \
            node scripts/movie-buff-security-evidence.mjs \
            > "${EVIDENCE_DIR}/collector.stdout.txt" \
            2> "${EVIDENCE_DIR}/collector.stderr.txt"
          collector_exit=$?
          set -e
          printf '%s\n' "${collector_exit}" > "${EVIDENCE_DIR}/collector-exit.txt"
          test -s "${EVIDENCE_DIR}/repository-static-evidence.json"
          test "${collector_exit}" -eq 0 -o "${collector_exit}" -eq 1

      - name: Validate evidence proof scopes
        shell: bash
        run: |
          set -euo pipefail
          MOVIE_BUFF_EVIDENCE_JSON="${EVIDENCE_DIR}/repository-static-evidence.json" \
            node --test tests/movie-buff-release-evidence-integrity.test.mjs \
            2>&1 | tee "${EVIDENCE_DIR}/evidence-integrity.tap"

      - name: Run TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsc --noEmit 2>&1 | tee "${EVIDENCE_DIR}/typescript.txt"

      - name: Run production build with localhost-only placeholders
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-build-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: local-build-service-role-key
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "${EVIDENCE_DIR}/build.txt"

      - name: Verify no generated repository changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Write exact-SHA artifact metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          {
            echo "lane=MOV-19"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_ref=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            echo "runner_os=${RUNNER_OS}"
            echo "node_version=$(node --version)"
            echo "npm_version=$(npm --version)"
            echo "target_kind=repository-static-and-local-build"
            echo "build_supabase_target=http://127.0.0.1:54321"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${EVIDENCE_DIR}/metadata.txt"
          find "${EVIDENCE_DIR}" -maxdepth 1 -type f ! -name sha256.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "${EVIDENCE_DIR}/sha256.txt"

      - name: Upload exact-SHA validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mov19-validation-evidence-${{ env.EXPECTED_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7
