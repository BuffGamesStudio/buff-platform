name: MOV-15 one-shot owner repair

on:
  push:
    branches:
      - copilot/MOV-15-public-matchmaking
    paths:
      - ".github/workflows/movie-buff-mov15-owner-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    name: Apply exact MOV-15 owner repair
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify immutable parent and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "copilot/MOV-15-public-matchmaking"
          test "$(git rev-parse HEAD^)" = "48d44bb156b71060d1b9adcc7a2a3f014cf92060"
          test -z "$(git status --porcelain)"

      - name: Apply approved source and regression repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          lobby_path = Path("src/app/games/movie-buff/lobby/LobbyClient.tsx")
          contract_path = Path("tests/movie-buff-public-matchmaking-contract.test.mjs")
          workflow_path = Path(".github/workflows/movie-buff-mov15-validation.yml")

          lobby = lobby_path.read_text(encoding="utf-8")
          removals = {
              "Gamepad2 import": "  Gamepad2,\n",
              "quick-start handler": """  async function handleQuickStart() {
            await handleCreateRoom();
          }

          """,
              "duplicate manual-start control": """            <button
                      type=\"button\"
                      onClick={handleQuickStart}
                      disabled={roomActionsBlocked || !emailVerified}
                      className=\"flex w-full items-center justify-center gap-3 rounded-xl bg-red-600 px-10 py-5 text-xl font-black transition hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-70 lg:w-auto\"
                    >
                      <Gamepad2 size={24} />
                      {isLoading ? \"Working...\" : \"Start Match\"}
                    </button>
          """,
          }
          for label, fragment in removals.items():
              if lobby.count(fragment) != 1:
                  raise SystemExit(f"Expected exactly one {label}; found {lobby.count(fragment)}")
              lobby = lobby.replace(fragment, "", 1)
          if "handleQuickStart" in lobby or '"Start Match"' in lobby:
              raise SystemExit("Manual gameplay-start source remains after repair")
          for required in ("handleFindMatch", '"Find Match"', "handleCreateRoom", '"Create Room"'):
              if required not in lobby:
                  raise SystemExit(f"Required lobby path was lost: {required}")
          lobby_path.write_text(lobby, encoding="utf-8")

          contract = contract_path.read_text(encoding="utf-8")
          read_anchor = """const waitingRoom = fs.readFileSync(
            \"src/app/games/movie-buff/waiting-room/page.tsx\",
            \"utf8\",
          );
          """
          read_insert = read_anchor + """const lobby = fs.readFileSync(
            \"src/app/games/movie-buff/lobby/LobbyClient.tsx\",
            \"utf8\",
          );
          const workflow = fs.readFileSync(
            \".github/workflows/movie-buff-mov15-validation.yml\",
            \"utf8\",
          );
          """
          if contract.count(read_anchor) != 1 or "const lobby = fs.readFileSync" in contract:
              raise SystemExit("Unexpected lobby contract-read state")
          contract = contract.replace(read_anchor, read_insert, 1)

          pgtap_anchor = """const pgtap = fs.readFileSync(
            \"supabase/tests/movie_buff_public_matchmaking_test.sql\",
            \"utf8\",
          );
          """
          helpers = pgtap_anchor + r'''
          function assertContainmentContract(sql) {
            assert.match(
              sql,
              /current_setting\('movie_buff\.allow_matchmaking_containment',\s*true\)/i,
            );
            assert.match(sql, /<>\s*'on'/i);
            assert.doesNotMatch(sql, /allow_public_matchmaking_rollback/i);
            assert.match(
              sql,
              /revoke\s+execute\s+on\s+function\s+public\.find_or_create_movie_buff_public_room\(uuid,\s*text,\s*integer,\s*integer\)\s+from\s+authenticated\s*;/i,
            );
            assert.match(
              sql,
              /revoke\s+execute\s+on\s+function\s+public\.set_movie_buff_player_ready\(uuid,\s*boolean\)\s+from\s+authenticated\s*;/i,
            );
            assert.match(
              sql,
              /revoke\s+execute\s+on\s+function\s+public\.start_movie_buff_match\(uuid\)\s+from\s+authenticated\s*;/i,
            );
            assert.match(
              sql,
              /grant\s+execute\s+on\s+function\s+public\.find_or_create_movie_buff_public_room\(uuid,\s*text,\s*integer,\s*integer\)\s+to\s+service_role\s*;/i,
            );
            assert.match(
              sql,
              /grant\s+execute\s+on\s+function\s+public\.set_movie_buff_player_ready\(uuid,\s*boolean\)\s+to\s+service_role\s*;/i,
            );
            assert.match(
              sql,
              /grant\s+execute\s+on\s+function\s+public\.start_movie_buff_match\(uuid\)\s+to\s+service_role\s*;/i,
            );
            assert.doesNotMatch(
              sql,
              /grant\s+execute\s+on\s+function\s+public\.(?:find_or_create_movie_buff_public_room|set_movie_buff_player_ready|start_movie_buff_match)[\s\S]*?to\s+authenticated/i,
            );
            assert.doesNotMatch(sql, /drop\s+table|truncate|delete\s+from/i);
          }

          function assertPgtapSecurityContract(sql) {
            assert.match(sql, /from pg_catalog\.pg_proc as p/i);
            assert.match(
              sql,
              /join pg_catalog\.pg_roles as r on r\.oid = p\.proowner/i,
            );
            assert.match(sql, /r\.rolname = 'postgres'/i);
            assert.match(sql, /p\.prosecdef/i);
            assert.match(sql, /search_path=pg_catalog/i);
            assert.match(sql, /has_function_privilege/i);
            assert.match(sql, /skip\[\[:space:\]\]\+locked/i);
          }
          '''
          if contract.count(pgtap_anchor) != 1 or "function assertContainmentContract" in contract:
              raise SystemExit("Unexpected security helper state")
          contract = contract.replace(pgtap_anchor, helpers, 1)

          containment_open = 'test("rollback packet is guarded, fail-closed, and non-destructive", () => {\n'
          pgtap_open = 'test("pgTAP covers ACL, ownership, fixed paths, and no SKIP LOCKED", () => {\n'
          if contract.count(containment_open) != 1 or contract.count(pgtap_open) != 1:
              raise SystemExit("Expected security tests were not found")
          contract = contract.replace(
              containment_open,
              containment_open + "  assertContainmentContract(rollback);\n",
              1,
          )
          contract = contract.replace(
              pgtap_open,
              pgtap_open + "  assertPgtapSecurityContract(pgtap);\n",
              1,
          )

          appended = r'''

          test("public lobby has no manual gameplay-start path", () => {
            assert.doesNotMatch(lobby, /handleQuickStart/);
            assert.doesNotMatch(lobby, /["']Start Match["']/);
            assert.match(lobby, /onClick=\{handleFindMatch\}/);
            assert.match(lobby, /["']Find Match["']/);
            assert.match(lobby, /onClick=\{handleCreateRoom\}/);
            assert.match(lobby, /["']Create Room["']/);
            const watchedLobbyPaths =
              workflow.match(
                /src\/app\/games\/movie-buff\/lobby\/LobbyClient\.tsx/g,
              ) ?? [];
            assert.equal(watchedLobbyPaths.length, 2);
          });

          test("containment rejects the superseded rollback variable", () => {
            const mutant = rollback.replaceAll(
              "movie_buff.allow_matchmaking_containment",
              "allow_public_matchmaking_rollback",
            );
            assert.notEqual(mutant, rollback);
            assert.throws(() => assertContainmentContract(mutant));
          });

          test("containment without an explicit session guard fails", () => {
            const mutant = rollback.replace(
              /current_setting\('movie_buff\.allow_matchmaking_containment',\s*true\)/i,
              "'on'",
            );
            assert.notEqual(mutant, rollback);
            assert.throws(() => assertContainmentContract(mutant));
          });

          test("containment granting browser start authority fails", () => {
            const mutant = rollback.replace(
              /revoke execute on function public\.start_movie_buff_match\(uuid\)\s+from authenticated;/i,
              "grant execute on function public.start_movie_buff_match(uuid) to authenticated;",
            );
            assert.notEqual(mutant, rollback);
            assert.throws(() => assertContainmentContract(mutant));
          });

          test("pgTAP without postgres ownership verification fails", () => {
            const mutant = pgtap.replaceAll(
              "r.rolname = 'postgres'",
              "r.rolname = 'not_postgres'",
            );
            assert.notEqual(mutant, pgtap);
            assert.throws(() => assertPgtapSecurityContract(mutant));
          });
          '''
          if 'test("public lobby has no manual gameplay-start path"' in contract:
              raise SystemExit("Regression tests already exist unexpectedly")
          contract = contract.rstrip() + appended + "\n"
          contract_path.write_text(contract, encoding="utf-8")

          workflow = workflow_path.read_text(encoding="utf-8")
          watched = '      - "src/app/games/movie-buff/waiting-room/page.tsx"\n'
          lobby_watch = '      - "src/app/games/movie-buff/lobby/LobbyClient.tsx"\n'
          if workflow.count(watched) != 2 or lobby_watch in workflow:
              raise SystemExit("Unexpected MOV-15 workflow path-filter state")
          workflow = workflow.replace(watched, watched + lobby_watch)
          if workflow.count(lobby_watch) != 2:
              raise SystemExit("Lobby path was not added to both workflow filters")
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

      - name: Run focused contracts and source checks
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/movie-buff-public-matchmaking-contract.test.mjs \
            tests/movie-buff-public-matchmaking-handoff.test.mjs
          git diff --check

      - name: Commit repaired owner lane and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "movie-buff-agent-2"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/movie-buff-mov15-owner-repair.yml
          git add \
            src/app/games/movie-buff/lobby/LobbyClient.tsx \
            tests/movie-buff-public-matchmaking-contract.test.mjs \
            .github/workflows/movie-buff-mov15-validation.yml
          git commit -m "MOV-15 remove duplicate manual start path"
          git push origin HEAD:copilot/MOV-15-public-matchmaking
