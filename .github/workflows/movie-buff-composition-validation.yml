name: Movie Buff exact composition Linux validation

on:
  push:
    branches:
      - validation/movie-buff-mov15-mov16-mov17-pr12-exact-v1
    paths:
      - ".github/workflows/movie-buff-composition-validation.yml"
      - "scripts/movie-buff-composition-repository-evidence.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-repository:
    name: Linux combined contracts build and byte proof
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.sha }}
      EVIDENCE_DIR: ${{ runner.temp }}/movie-buff-composition-linux
    steps:
      - name: Check out exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install committed lock without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Linux composition evidence
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/movie-buff-composition-repository-evidence.sh \
            "${EXPECTED_SHA}" \
            "${EVIDENCE_DIR}"
      - name: Upload Linux composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-composition-linux-${{ env.EXPECTED_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7
