name: Movie Buff exact composition registration

on:
  push:
    branches:
      - validation/movie-buff-mov15-mov16-mov17-pr12-exact-v1
    paths:
      - ".github/workflows/movie-buff-composition-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration:
    name: Register exact composition workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify branch and SHA
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "validation/movie-buff-mov15-mov16-mov17-pr12-exact-v1"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
