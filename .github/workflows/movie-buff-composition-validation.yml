name: Movie Buff exact four-lane composition validation

on:
  push:
    branches:
      - validation/movie-buff-mov15-mov16-mov17-pr12-exact-v1
    paths:
      - ".github/workflows/movie-buff-composition-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: validation/movie-buff-mov15-mov16-mov17-pr12-exact-v1
  INTEGRATION_BASE_SHA: bf316a15a2120e32d8a32e479df2ae439081f9a1
  COMPONENT_MOV15_SHA: 0ecf8de86d2ea1a28c1496ed044a5092a7d3ffcb
  COMPONENT_MOV15_TREE: bd9e34f67d011c5a8adfe17f7c8c75dadfbb8182
  COMPONENT_MOV16_SHA: 95c292ead66fc83cf13d7154bd3cf691610f549d
  COMPONENT_MOV16_TREE: f8a8a9f316f5319566dad8c9aa01c2ce73f67e21
  COMPONENT_MOV17_SHA: 6d7e9aabe5b07796a3a17fdf6c11df091dd1f978
  COMPONENT_MOV17_TREE: 8264d2e30b0c75a8bebaa1ad938df6a635f7d991
  COMPONENT_ENCODING_SHA: bf5e6d6f251f6840d17eed2fc68e0d580295437f
  COMPONENT_ENCODING_TREE: d97528616454b9e93c6be9a44705d008a901ac66
  RAW_COMPOSITION_SHA: b4f8e2196a8a0423e7340ac97bd5592d58a966db
  RAW_COMPOSITION_TREE: 68715cde77454c8c1057f9480373208cec88ba32
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  repository-linux:
    name: Linux combined contracts and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.sha }}
      EVIDENCE_DIR: ${{ runner.temp }}/movie-buff-composition-linux

    steps:
      - name: Check out exact validation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          test -z "$(git status --porcelain)"
          node --version
          npm --version

      - name: Install committed lock without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate proof-script syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/movie-buff-public-matchmaking-race.mjs
          node --check scripts/movie-buff-public-matchmaking-evidence-runner.mjs
          node --check scripts/movie-buff-vip-authority-adversarial.mjs
          node --check scripts/movie-buff-vip-authority-personas.mjs
          node --check scripts/movie-buff-vip-finalize-adversarial.mjs
          node --check scripts/movie-buff-three-client-phase-proof.mjs
          node --check scripts/movie-buff-three-client-phase-evidence-runner.mjs
          node --check scripts/movie-buff-reconnect-race-proof.mjs
          bash -n scripts/movie-buff-mov17-local-supabase-evidence.sh
          python3 -B scripts/movie-buff-redact-evidence-test.py

      - name: Run all composed repository contract tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          node --test \
            tests/movie-buff-public-matchmaking-contract.test.mjs \
            tests/movie-buff-public-matchmaking-handoff.test.mjs \
            tests/movie-buff-vip-authority.test.mjs \
            tests/movie-buff-vip-finalize-contract.test.mjs \
            tests/movie-buff-vip-phase-policy.test.mjs \
            tests/movie-buff-server-phase-machine.test.mjs \
            tests/movie-buff-authoritative-phase-runtime.test.mjs \
            tests/movie-buff-buster-safe-boundary.test.mjs \
            tests/movie-buff-phase-tile-mutation-guard.test.mjs \
            tests/movie-buff-match-start-handoff.test.mjs \
            tests/movie-buff-migration-encoding.test.mjs \
            2>&1 | tee "${EVIDENCE_DIR}/contracts.tap"

      - name: Run TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsc --noEmit 2>&1 | tee "${EVIDENCE_DIR}/typescript.txt"

      - name: Run localhost-placeholder production build
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-build-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: local-build-service-role-key
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "${EVIDENCE_DIR}/build.txt"

      - name: Write exact composition metadata and hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          git diff --check
          test -z "$(git status --porcelain)"
          {
            echo "lane=MOV-15-MOV-16-MOV-17-PR12-composition"
            echo "repository=BuffGamesStudio/buff-platform"
            echo "remote=$(git remote get-url origin)"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "source_ref=${GITHUB_REF_NAME}"
            echo "raw_composition_sha=${RAW_COMPOSITION_SHA}"
            echo "raw_composition_tree=${RAW_COMPOSITION_TREE}"
            echo "component_mov15_sha=${COMPONENT_MOV15_SHA}"
            echo "component_mov15_tree=${COMPONENT_MOV15_TREE}"
            echo "component_mov16_sha=${COMPONENT_MOV16_SHA}"
            echo "component_mov16_tree=${COMPONENT_MOV16_TREE}"
            echo "component_mov17_sha=${COMPONENT_MOV17_SHA}"
            echo "component_mov17_tree=${COMPONENT_MOV17_TREE}"
            echo "component_encoding_sha=${COMPONENT_ENCODING_SHA}"
            echo "component_encoding_tree=${COMPONENT_ENCODING_TREE}"
            echo "integration_base_sha=${INTEGRATION_BASE_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "node_version=$(node --version)"
            echo "npm_version=$(npm --version)"
            echo "target_kind=repository-static-and-localhost-placeholder-build"
            echo "database_behavior=UNKNOWN"
            echo "browser_behavior=UNKNOWN"
            echo "hosted_state=UNKNOWN"
            echo "production_readiness=UNKNOWN"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${EVIDENCE_DIR}/metadata.txt"
          (
            cd "${EVIDENCE_DIR}"
            find . -maxdepth 1 -type f ! -name sha256.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > sha256.txt
            sha256sum -c sha256.txt
          )

      - name: Upload Linux composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-composition-linux-${{ env.EXPECTED_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7

  repository-windows:
    name: Windows combined command-shell digital twin
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.sha }}
      EVIDENCE_DIR: ${{ runner.temp }}\movie-buff-composition-windows

    steps:
      - name: Check out exact validation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact clean Windows checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_NAME -ne $env:EXPECTED_BRANCH) { throw "Branch mismatch: $env:GITHUB_REF_NAME" }
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'SHA mismatch' }
          if ((git remote get-url origin).Trim() -ne 'https://github.com/BuffGamesStudio/buff-platform') { throw 'Remote mismatch' }
          if (git status --porcelain) { throw 'Checkout is not clean' }
          $PSVersionTable | Out-String
          node --version
          npm --version

      - name: Install committed lock without package scripts
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run all composed contracts, TypeScript, and build
        shell: pwsh
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-build-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: local-build-service-role-key
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_DIR | Out-Null
          node --test `
            tests/movie-buff-public-matchmaking-contract.test.mjs `
            tests/movie-buff-public-matchmaking-handoff.test.mjs `
            tests/movie-buff-vip-authority.test.mjs `
            tests/movie-buff-vip-finalize-contract.test.mjs `
            tests/movie-buff-vip-phase-policy.test.mjs `
            tests/movie-buff-server-phase-machine.test.mjs `
            tests/movie-buff-authoritative-phase-runtime.test.mjs `
            tests/movie-buff-buster-safe-boundary.test.mjs `
            tests/movie-buff-phase-tile-mutation-guard.test.mjs `
            tests/movie-buff-match-start-handoff.test.mjs `
            tests/movie-buff-migration-encoding.test.mjs `
            1> (Join-Path $env:EVIDENCE_DIR 'contracts.tap') `
            2> (Join-Path $env:EVIDENCE_DIR 'contracts.stderr.txt')
          if ($LASTEXITCODE -ne 0) { throw "Contract tests failed: $LASTEXITCODE" }
          npx --no-install tsc --noEmit `
            1> (Join-Path $env:EVIDENCE_DIR 'typescript.txt') `
            2> (Join-Path $env:EVIDENCE_DIR 'typescript.stderr.txt')
          if ($LASTEXITCODE -ne 0) { throw "TypeScript failed: $LASTEXITCODE" }
          npm run build `
            1> (Join-Path $env:EVIDENCE_DIR 'build.txt') `
            2> (Join-Path $env:EVIDENCE_DIR 'build.stderr.txt')
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }

      - name: Write exact composition metadata and hashes
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_DIR | Out-Null
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          if (git status --porcelain) { throw 'Checkout is not clean after validation' }
          @(
            'lane=MOV-15-MOV-16-MOV-17-PR12-composition'
            'repository=BuffGamesStudio/buff-platform'
            "remote=$((git remote get-url origin).Trim())"
            "source_sha=$((git rev-parse HEAD).Trim())"
            "source_tree=$((git rev-parse 'HEAD^{tree}').Trim())"
            "source_ref=$env:GITHUB_REF_NAME"
            "raw_composition_sha=$env:RAW_COMPOSITION_SHA"
            "raw_composition_tree=$env:RAW_COMPOSITION_TREE"
            "component_mov15_sha=$env:COMPONENT_MOV15_SHA"
            "component_mov15_tree=$env:COMPONENT_MOV15_TREE"
            "component_mov16_sha=$env:COMPONENT_MOV16_SHA"
            "component_mov16_tree=$env:COMPONENT_MOV16_TREE"
            "component_mov17_sha=$env:COMPONENT_MOV17_SHA"
            "component_mov17_tree=$env:COMPONENT_MOV17_TREE"
            "component_encoding_sha=$env:COMPONENT_ENCODING_SHA"
            "component_encoding_tree=$env:COMPONENT_ENCODING_TREE"
            "integration_base_sha=$env:INTEGRATION_BASE_SHA"
            "runner_os=$env:RUNNER_OS"
            "powershell_version=$($PSVersionTable.PSVersion)"
            "node_version=$((node --version).Trim())"
            'target_kind=hosted-windows-command-shell-static-and-build'
            'physical_windows_cursor_equivalence=UNKNOWN'
            'database_behavior=UNKNOWN'
            'browser_behavior=UNKNOWN'
            'hosted_state=UNKNOWN'
            "workflow_run_id=$env:GITHUB_RUN_ID"
            "workflow_run_attempt=$env:GITHUB_RUN_ATTEMPT"
            "generated_at=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content -LiteralPath (Join-Path $env:EVIDENCE_DIR 'metadata.txt') -Encoding utf8
          $manifestPath = Join-Path $env:EVIDENCE_DIR 'sha256.csv'
          Get-ChildItem -LiteralPath $env:EVIDENCE_DIR -File |
            Where-Object Name -ne 'sha256.csv' |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
              [pscustomobject]@{ Path = $_.Name; Hash = $hash.Hash }
            } |
            Export-Csv -LiteralPath $manifestPath -NoTypeInformation
          foreach ($entry in Import-Csv -LiteralPath $manifestPath) {
            $target = Join-Path $env:EVIDENCE_DIR $entry.Path
            if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash -ne $entry.Hash) { throw "Hash mismatch: $($entry.Path)" }
          }

      - name: Upload Windows composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-composition-windows-${{ env.EXPECTED_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7

  encoding-proof:
    name: ${{ matrix.label }} migration byte proof
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
            artifact: linux
          - os: windows-2025
            label: Windows
            artifact: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.sha }}
      EVIDENCE_DIR: ${{ runner.temp }}/movie-buff-composition-encoding-${{ matrix.artifact }}
      MOVIE_BUFF_MIGRATION_ENCODING_OUTPUT: ${{ runner.temp }}/movie-buff-composition-encoding-${{ matrix.artifact }}/report.json
      MOVIE_BUFF_BOM_ONLY_OUTPUT: ${{ runner.temp }}/movie-buff-composition-encoding-${{ matrix.artifact }}/bom-only-report.json

    steps:
      - name: Check out exact validation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute exact byte proof
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"
          mkdir -p "${EVIDENCE_DIR}"
          node --test tests/movie-buff-migration-encoding.test.mjs \
            > "${EVIDENCE_DIR}/tests.tap" \
            2> "${EVIDENCE_DIR}/tests.stderr.txt"
          node scripts/movie-buff-migration-encoding-check.mjs \
            supabase/migrations supabase/rollbacks supabase/tests \
            > "${EVIDENCE_DIR}/scan.stdout.txt" \
            2> "${EVIDENCE_DIR}/scan.stderr.txt"
          git fetch --no-tags --depth=1 origin "${INTEGRATION_BASE_SHA}"
          node scripts/movie-buff-migration-bom-only-check.mjs "${INTEGRATION_BASE_SHA}" \
            > "${EVIDENCE_DIR}/bom-only.stdout.txt" \
            2> "${EVIDENCE_DIR}/bom-only.stderr.txt"
          git diff --check
          test -z "$(git status --porcelain)"
          {
            echo "lane=MOV-15-MOV-16-MOV-17-PR12-composition-encoding"
            echo "repository=BuffGamesStudio/buff-platform"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "source_ref=${GITHUB_REF_NAME}"
            echo "raw_composition_sha=${RAW_COMPOSITION_SHA}"
            echo "component_encoding_sha=${COMPONENT_ENCODING_SHA}"
            echo "component_encoding_tree=${COMPONENT_ENCODING_TREE}"
            echo "baseline_sha=${INTEGRATION_BASE_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "node_version=$(node --version)"
            echo "target_kind=repository-byte-validation"
            echo "hosted_state=UNKNOWN"
            echo "physical_windows_cursor_equivalence=UNKNOWN"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${EVIDENCE_DIR}/metadata.txt"
          node - "${EVIDENCE_DIR}" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const root = process.argv[2];
          const rows = fs.readdirSync(root)
            .filter((name) => name !== 'sha256.json')
            .sort()
            .map((name) => ({
              path: name,
              sha256: crypto.createHash('sha256').update(fs.readFileSync(path.join(root, name))).digest('hex'),
            }));
          fs.writeFileSync(path.join(root, 'sha256.json'), JSON.stringify(rows, null, 2) + '\n');
          for (const row of rows) {
            const actual = crypto.createHash('sha256').update(fs.readFileSync(path.join(root, row.path))).digest('hex');
            if (actual !== row.sha256) throw new Error(`hash mismatch: ${row.path}`);
          }
          NODE

      - name: Upload migration byte evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-composition-encoding-${{ matrix.artifact }}-${{ env.EXPECTED_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7

  mov17-local-rehearsal:
    name: Combined reset plus MOV-17 rollback rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_SHA: ${{ github.sha }}
      EVIDENCE_DIR: ${{ runner.temp }}/movie-buff-composition-mov17-local

    steps:
      - name: Check out exact validation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact unlinked checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"
          test ! -f supabase/.temp/project-ref
          bash -n scripts/movie-buff-mov17-local-supabase-evidence.sh
          python3 -B scripts/movie-buff-redact-evidence-test.py
          docker --version
          psql --version

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Run reset, MOV-17 pgTAP, rollback, and forward rehearsal
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/movie-buff-mov17-local-supabase-evidence.sh \
            "${EXPECTED_SHA}" \
            "${EVIDENCE_DIR}"
          wrapper_exit=$?
          set -e
          {
            echo "lane=MOV-15-MOV-16-MOV-17-PR12-composition-mov17-rehearsal"
            echo "repository=BuffGamesStudio/buff-platform"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "source_ref=${GITHUB_REF_NAME}"
            echo "raw_composition_sha=${RAW_COMPOSITION_SHA}"
            echo "raw_composition_tree=${RAW_COMPOSITION_TREE}"
            echo "component_mov15_sha=${COMPONENT_MOV15_SHA}"
            echo "component_mov16_sha=${COMPONENT_MOV16_SHA}"
            echo "component_mov17_sha=${COMPONENT_MOV17_SHA}"
            echo "component_encoding_sha=${COMPONENT_ENCODING_SHA}"
            echo "mov15_race_behavior=UNKNOWN"
            echo "mov16_persona_and_concurrency_behavior=UNKNOWN"
            echo "browser_behavior=UNKNOWN"
            echo "hosted_state=UNKNOWN"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${EVIDENCE_DIR}/composition-metadata.txt"
          while IFS= read -r -d '' evidence_file; do
            temporary_file="${evidence_file}.redacted"
            python3 -B scripts/movie-buff-redact-evidence.py "${evidence_file}" "${temporary_file}"
            mv "${temporary_file}" "${evidence_file}"
          done < <(find "${EVIDENCE_DIR}" -maxdepth 1 -type f ! -name sha256.txt -print0)
          (
            cd "${EVIDENCE_DIR}"
            find . -maxdepth 1 -type f ! -name sha256.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > sha256.txt
            sha256sum -c sha256.txt
          )
          git diff --check
          test -z "$(git status --porcelain)"
          exit "${wrapper_exit}"

      - name: Upload local rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-composition-mov17-local-${{ env.EXPECTED_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7

  combined-pgtap:
    name: Combined MOV-15 MOV-16 MOV-17 pgTAP
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPECTED_SHA: ${{ github.sha }}
      WORK_ROOT: ${{ runner.temp }}/movie-buff-composition-db
      EVIDENCE_DIR: ${{ runner.temp }}/movie-buff-composition-pgtap
      RAW_DIR: ${{ runner.temp }}/movie-buff-composition-pgtap-raw
      LOCAL_PROJECT_ID: movie-buff-composition-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out exact validation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact unlinked checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"
          test ! -f supabase/.temp/project-ref
          python3 -B scripts/movie-buff-redact-evidence-test.py
          docker --version
          psql --version

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Run combined reset, ledger proof, and all lane pgTAP
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="${GITHUB_WORKSPACE}"
          rm -rf "${WORK_ROOT}" "${EVIDENCE_DIR}" "${RAW_DIR}"
          mkdir -p "${WORK_ROOT}" "${EVIDENCE_DIR}" "${RAW_DIR}"
          cp -a "${SOURCE_ROOT}/supabase" "${WORK_ROOT}/supabase"
          python3 - "${WORK_ROOT}/supabase/config.toml" "${LOCAL_PROJECT_ID}" <<'PY'
          import pathlib
          import re
          import sys
          path = pathlib.Path(sys.argv[1])
          project_id = sys.argv[2]
          text = path.read_text(encoding="utf-8")
          text, project_count = re.subn(r'(?m)^project_id\s*=\s*"[^"]+"\s*$', f'project_id = "{project_id}"', text, count=1)
          text, seed_count = re.subn(r'(?ms)(^\[db\.seed\]\s*.*?^enabled\s*=\s*)true(\s*$)', r'\1false\2', text, count=1)
          if project_count != 1 or seed_count != 1:
              raise SystemExit("unable to create isolated config")
          path.write_text(text, encoding="utf-8")
          PY
          run_safe() {
            local name="$1"
            shift
            local raw_stdout="${RAW_DIR}/${name}.stdout.raw"
            local raw_stderr="${RAW_DIR}/${name}.stderr.raw"
            local safe_stdout="${EVIDENCE_DIR}/${name}.stdout.txt"
            local safe_stderr="${EVIDENCE_DIR}/${name}.stderr.txt"
            set +e
            "$@" >"${raw_stdout}" 2>"${raw_stderr}"
            local code=$?
            set -e
            printf '%s\n' "${code}" > "${EVIDENCE_DIR}/${name}.exit.txt"
            python3 -B "${SOURCE_ROOT}/scripts/movie-buff-redact-evidence.py" "${raw_stdout}" "${safe_stdout}"
            python3 -B "${SOURCE_ROOT}/scripts/movie-buff-redact-evidence.py" "${raw_stderr}" "${safe_stderr}"
            rm -f "${raw_stdout}" "${raw_stderr}"
            return "${code}"
          }
          (
            cd "${WORK_ROOT}"
            run_safe supabase-start supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
            run_safe db-reset supabase db reset --local
          )
          export PGPASSWORD=postgres
          run_safe migration-ledger psql \
            -h 127.0.0.1 -p 55322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -Atc \
            "select version from supabase_migrations.schema_migrations where version between '20260804073000' and '20260804083600' order by version;"
          required_versions=(
            20260804073000 20260804073100 20260804073200 20260804073300
            20260804081500 20260804081600
            20260804083000 20260804083100 20260804083200 20260804083300
            20260804083400 20260804083500 20260804083600
          )
          for version in "${required_versions[@]}"; do
            grep -qx "${version}" "${EVIDENCE_DIR}/migration-ledger.stdout.txt"
          done
          test_files=(
            supabase/tests/movie_buff_public_matchmaking_test.sql
            supabase/tests/movie_buff_vip_authority_test.sql
            supabase/tests/movie_buff_vip_snapshot_release_test.sql
            supabase/tests/movie_buff_vip_deadline_finalize_test.sql
            supabase/tests/movie_buff_server_phase_machine_test.sql
            supabase/tests/movie_buff_phase_contract_alignment_test.sql
            supabase/tests/movie_buff_match_start_handoff_test.sql
          )
          for test_file in "${test_files[@]}"; do
            label="pgtap-$(basename "${test_file}" .sql | tr '_' '-')"
            (
              cd "${WORK_ROOT}"
              run_safe "${label}" supabase test db "${test_file}" --local
            )
          done
          printf 'PASS\n' > "${EVIDENCE_DIR}/classification.txt"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Clean disposable stack and finalize evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          SOURCE_ROOT="${GITHUB_WORKSPACE}"
          mkdir -p "${EVIDENCE_DIR}" "${RAW_DIR}"
          cleanup_code=0
          if [[ -d "${WORK_ROOT}/supabase" ]]; then
            (
              cd "${WORK_ROOT}" || exit 1
              supabase stop --no-backup
            ) > "${RAW_DIR}/cleanup.stdout.raw" 2> "${RAW_DIR}/cleanup.stderr.raw"
            cleanup_code=$?
            printf '%s\n' "${cleanup_code}" > "${EVIDENCE_DIR}/cleanup.exit.txt"
            python3 -B "${SOURCE_ROOT}/scripts/movie-buff-redact-evidence.py" \
              "${RAW_DIR}/cleanup.stdout.raw" "${EVIDENCE_DIR}/cleanup.stdout.txt"
            python3 -B "${SOURCE_ROOT}/scripts/movie-buff-redact-evidence.py" \
              "${RAW_DIR}/cleanup.stderr.raw" "${EVIDENCE_DIR}/cleanup.stderr.txt"
          else
            printf 'NOT APPLICABLE\n' > "${EVIDENCE_DIR}/cleanup.exit.txt"
          fi
          rm -rf "${WORK_ROOT}" "${RAW_DIR}"
          classification=FAIL
          if [[ -f "${EVIDENCE_DIR}/classification.txt" ]] && grep -qx PASS "${EVIDENCE_DIR}/classification.txt"; then
            classification=PASS
          fi
          {
            echo "lane=MOV-15-MOV-16-MOV-17-PR12-composition-pgtap"
            echo "repository=BuffGamesStudio/buff-platform"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "source_ref=${GITHUB_REF_NAME}"
            echo "raw_composition_sha=${RAW_COMPOSITION_SHA}"
            echo "raw_composition_tree=${RAW_COMPOSITION_TREE}"
            echo "component_mov15_sha=${COMPONENT_MOV15_SHA}"
            echo "component_mov16_sha=${COMPONENT_MOV16_SHA}"
            echo "component_mov17_sha=${COMPONENT_MOV17_SHA}"
            echo "component_encoding_sha=${COMPONENT_ENCODING_SHA}"
            echo "target_kind=disposable-local-supabase-combined-pgtap"
            echo "mov15_race_behavior=UNKNOWN"
            echo "mov16_persona_and_concurrency_behavior=UNKNOWN"
            echo "three_client_browser_behavior=UNKNOWN"
            echo "hosted_state=UNKNOWN"
            echo "production_readiness=UNKNOWN"
            echo "cleanup_exit=${cleanup_code}"
            echo "classification=${classification}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${EVIDENCE_DIR}/metadata.txt"
          while IFS= read -r -d '' evidence_file; do
            temporary_file="${evidence_file}.redacted"
            python3 -B scripts/movie-buff-redact-evidence.py "${evidence_file}" "${temporary_file}"
            mv "${temporary_file}" "${evidence_file}"
          done < <(find "${EVIDENCE_DIR}" -maxdepth 1 -type f ! -name sha256.txt -print0)
          (
            cd "${EVIDENCE_DIR}" || exit 1
            find . -maxdepth 1 -type f ! -name sha256.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > sha256.txt
            sha256sum -c sha256.txt
          )
          git diff --check
          test -z "$(git status --porcelain)"
          exit "${cleanup_code}"

      - name: Upload combined pgTAP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-composition-pgtap-${{ env.EXPECTED_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7
