name: MOV-17 exact localhost phase and reconnect races

on:
  push:
    branches:
      - validation/movie-buff-mov17-races-20260807
    paths:
      - ".github/workflows/movie-buff-mov17-local-races.yml"
      - "scripts/movie-buff-mov17-local-race-evidence.sh"
  pull_request:
    branches:
      - integration/movie-buff
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_SHA: f6b23c648a3a2cbabb4237934c125b0bccb215e9
  PRODUCT_TREE: da2781ba523d8283f26ced50de3245b5d3800b8b
  CONTROLLER_BRANCH: validation/movie-buff-mov17-races-20260807
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  local-races:
    name: Execute three-client phase and reconnect race proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out validation controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Bind exact product and controller isolation
        shell: bash
        run: |
          set -euo pipefail
          resolved_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${resolved_branch}" = "${CONTROLLER_BRANCH}"
          test "$(git rev-parse "${PRODUCT_SHA}^{tree}")" = "${PRODUCT_TREE}"
          git merge-base --is-ancestor "${PRODUCT_SHA}" HEAD
          actual="$(git diff --name-only "${PRODUCT_SHA}"..HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/movie-buff-mov17-local-races.yml \
            scripts/movie-buff-mov17-local-race-evidence.sh | sort)"
          test "${actual}" = "${expected}"
          test -z "$(git status --porcelain --untracked-files=all)"
          bash -n scripts/movie-buff-mov17-local-race-evidence.sh
          node --check scripts/movie-buff-three-client-phase-evidence-runner.mjs
          node --check scripts/movie-buff-three-client-phase-proof.mjs
          node --check scripts/movie-buff-reconnect-race-proof.mjs

      - name: Execute disposable exact-product race laboratory
        shell: bash
        run: |
          evidence_dir="${RUNNER_TEMP}/mov17-race-evidence"
          bash scripts/movie-buff-mov17-local-race-evidence.sh \
            "${PRODUCT_SHA}" \
            "${PRODUCT_TREE}" \
            "${evidence_dir}"

      - name: Upload portable race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mov17-races-${{ env.PRODUCT_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mov17-race-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Verify clean controller checkout
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
