name: MOV-17 exact localhost phase and reconnect races

on:
  push:
    branches:
      - validation/movie-buff-mov17-races-20260807
    paths:
      - ".github/workflows/movie-buff-mov17-local-races.yml"
      - "scripts/movie-buff-mov17-local-race-evidence.sh"
  pull_request:
    branches:
      - integration/movie-buff
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_SHA: b6f10c1b15506548e7dc63d0584295945726ac6d
  PRODUCT_TREE: d601027fd4845c97a952e0edcd6540a74c9847d2
  CONTROLLER_BRANCH: validation/movie-buff-mov17-races-20260807
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  local-races:
    name: Execute three-client phase and reconnect race proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out validation controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Bind exact product and controller isolation
        shell: bash
        run: |
          set -euo pipefail
          resolved_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${resolved_branch}" = "${CONTROLLER_BRANCH}"
          test "$(git rev-parse "${PRODUCT_SHA}^{tree}")" = "${PRODUCT_TREE}"
          git merge-base --is-ancestor "${PRODUCT_SHA}" HEAD
          actual="$(git diff --name-only "${PRODUCT_SHA}"..HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/movie-buff-mov17-local-races.yml \
            scripts/movie-buff-mov17-local-race-evidence.sh | sort)"
          test "${actual}" = "${expected}"
          test -z "$(git status --porcelain --untracked-files=all)"
          bash -n scripts/movie-buff-mov17-local-race-evidence.sh
          node --check scripts/movie-buff-three-client-phase-evidence-runner.mjs
          node --check scripts/movie-buff-three-client-phase-proof.mjs
          node --check scripts/movie-buff-reconnect-race-proof.mjs

      - name: Prepare local-only fixture controller
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/movie-buff-mov17-local-race-evidence.sh "${RUNNER_TEMP}/mov17-race-lab.sh"
          python3 - "${RUNNER_TEMP}/mov17-race-lab.sh" <<'PY'
          import pathlib,sys
          path=pathlib.Path(sys.argv[1])
          text=path.read_text(encoding='utf-8')

          credential_anchor='  [[ -n "$publishable_key" && -n "$service_key" ]] || { fail credential-shape; return 1; }\n'
          grant_lines=[
            '  [[ -n "$publishable_key" && -n "$service_key" ]] || { fail credential-shape; return 1; }',
            '  local database_url="${DB_URL:-}"',
            '  [[ -n "$database_url" ]] || { fail database-url; return 1; }',
            '',
            '  cat >"$EVIDENCE_ROOT/local-fixture-grants.sql" <<\'SQL\'',
            '-- Disposable localhost fixture scaffolding only. These grants are not product,',
            '-- staging, hosted, or production security evidence.',
            'grant select, insert, update, delete on table',
            '  public.game_rooms,',
            '  public.room_players,',
            '  public.matches,',
            '  public.match_players,',
            '  public.match_rounds,',
            '  public.movie_buff_boards,',
            '  public.movie_buff_board_categories,',
            '  public.movie_buff_board_tiles,',
            '  public.movies,',
            '  public.clips',
            '  to service_role;',
            'SQL',
            '  run_step fixture-grants psql "$database_url" -X -v ON_ERROR_STOP=1 \\',
            '    -f "$EVIDENCE_ROOT/local-fixture-grants.sql" \\',
            '    || { fail fixture-grants; return 1; }',
          ]
          if credential_anchor not in text:
              raise SystemExit('credential anchor missing')
          text=text.replace(credential_anchor,'\n'.join(grant_lines)+'\n',1)

          worktree_anchor='''  [[ "$(git -C "$PRODUCT_ROOT" rev-parse HEAD^{tree})" = "$PRODUCT_TREE" ]] \\
    || { fail product-worktree-tree; return 1; }\n'''
          fixture_lines=[
            worktree_anchor.rstrip('\n'),
            '',
            '  python3 - "$PRODUCT_ROOT/scripts/movie-buff-three-client-phase-proof.mjs" <<\'PY\'',
            'import pathlib,sys',
            'p=pathlib.Path(sys.argv[1]); text=p.read_text(encoding="utf-8")',
            'old_return="return { roomId, matchId, roundId, boardId, tileIds, titles };"',
            'new_return="return { roomId, matchId, roundId, boardId, tileIds, clipIds, titles };"',
            'if old_return not in text: raise SystemExit("phase fixture return anchor missing")',
            'text=text.replace(old_return,new_return,1)',
            'anchor=\'  record("three clients share one Round Intro phase/version");\\n\\n  const { error: earlyAnswerError }\'',
            'replacement=\'  record("three clients share one Round Intro phase/version");\\n\\n  const { error: earlyRoundFixtureError } = await admin\\n    .from("match_rounds")\\n    .update({ clip_id: context.clipIds[0] })\\n    .eq("id", context.roundId);\\n  if (earlyRoundFixtureError) throw earlyRoundFixtureError;\\n\\n  const { error: earlyAnswerError }\'',
            'if anchor not in text: raise SystemExit("early-answer fixture anchor missing")',
            'p.write_text(text.replace(anchor,replacement,1),encoding="utf-8")',
            'PY',
            '  printf \'fixture_patch=round_clip_for_early_answer_guard_only\\n\' >"$EVIDENCE_ROOT/phase-fixture-patch.txt"',
          ]
          if worktree_anchor not in text:
              raise SystemExit('worktree anchor missing')
          text=text.replace(worktree_anchor,'\n'.join(fixture_lines)+'\n',1)

          cleanup_anchor='  git -C "$PRODUCT_ROOT" checkout -- next-env.d.ts >/dev/null 2>&1 || true\n'
          cleanup_replacement='  git -C "$PRODUCT_ROOT" checkout -- next-env.d.ts scripts/movie-buff-three-client-phase-proof.mjs >/dev/null 2>&1 || true\n'
          if cleanup_anchor not in text:
              raise SystemExit('fixture cleanup anchor missing')
          text=text.replace(cleanup_anchor,cleanup_replacement,1)

          path.write_text(text,encoding='utf-8')
          PY
          bash -n "${RUNNER_TEMP}/mov17-race-lab.sh"
          grep -q 'Disposable localhost fixture scaffolding only' "${RUNNER_TEMP}/mov17-race-lab.sh"
          grep -q 'phase fixture return anchor missing' "${RUNNER_TEMP}/mov17-race-lab.sh"

      - name: Execute disposable exact-product race laboratory
        shell: bash
        run: |
          evidence_dir="${RUNNER_TEMP}/mov17-race-evidence"
          bash "${RUNNER_TEMP}/mov17-race-lab.sh" \
            "${PRODUCT_SHA}" \
            "${PRODUCT_TREE}" \
            "${evidence_dir}"

      - name: Upload portable race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mov17-races-${{ env.PRODUCT_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mov17-race-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Verify clean controller checkout
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
