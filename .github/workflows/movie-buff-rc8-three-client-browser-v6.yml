name: Movie Buff RC-8 exact three-client browser journey v6

on:
  pull_request:
    branches: [validation/movie-buff-rc8-runner-base-v6-20260806]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  PRODUCT_BRANCH: release/movie-buff-rc-2026-08-06-01-rc8
  PRODUCT_SHA: 0899d19d60b222bf995a0f8116ed032d93794620
  PRODUCT_TREE: 94d6411e9613b8692a0e5ada3dadc398aebcc193
  PARENT_SHA: 0899d19d60b222bf995a0f8116ed032d93794620
  EXPECTED_BRANCH: validation/movie-buff-rc8-runner-base-v6-20260806
  CONTROLLER_BRANCH: validation/movie-buff-rc8-runner-base-v6-20260806
  EXPECTED_TRIGGER_BRANCH: validation/movie-buff-rc8-browser-run-v6-20260806
  CONTROLLER_SHA: ${{ github.event.pull_request.base.sha }}
  TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
  SOURCE_CONTROLLER_SHA: efb8354020c661ea1dc0c24835cdc4dfc603f50a
  SOURCE_CONTROLLER_BLOB: 854182c8e50d64c68e68dc4beaabfb9fb1fabd78
  ARTIFACT_NAME: movie-buff-rc8-three-client-v6-${{ github.run_id }}-${{ github.run_attempt }}
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  exact-three-client-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Materialize reviewed RC-8 controller scripts
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${{ github.event.pull_request.base.ref }}" = "${CONTROLLER_BRANCH}"
          test "${{ github.event.pull_request.head.ref }}" = "${EXPECTED_TRIGGER_BRANCH}"
          test "$(git rev-parse HEAD)" = "${CONTROLLER_SHA}"
          test "$(git rev-parse HEAD^)" = "${PRODUCT_SHA}"
          test "$(git rev-parse "${PRODUCT_SHA}^{tree}")" = "${PRODUCT_TREE}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          import subprocess
          expected={".github/workflows/movie-buff-rc8-three-client-browser-v6.yml"}
          actual=set(subprocess.check_output(["git","diff","--name-only","0899d19d60b222bf995a0f8116ed032d93794620..HEAD"],text=True).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected product-to-controller delta: {sorted(actual)}")
          PY
          git fetch --no-tags --depth=1 origin "${SOURCE_CONTROLLER_SHA}"
          test "$(git rev-parse "${SOURCE_CONTROLLER_SHA}:.github/workflows/movie-buff-rc7-three-client-browser-v5.yml")" = "${SOURCE_CONTROLLER_BLOB}"
          git show "${SOURCE_CONTROLLER_SHA}:.github/workflows/movie-buff-rc7-three-client-browser-v5.yml" > "${RUNNER_TEMP}/source-controller.yml"
          python3 - "${RUNNER_TEMP}/source-controller.yml" "${RUNNER_TEMP}" <<'PY'
          from pathlib import Path
          import sys

          source=Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          output=Path(sys.argv[2])
          names=[
            ("Provision runner prerequisites","01-provision.sh"),
            ("Bind immutable product and controller","02-bind.sh"),
            ("Execute repair static contract","03-static.sh"),
            ("Execute reviewed preflight","04-preflight.sh"),
            ("Prove repaired local database ACL matrix","05-database.sh"),
            ("Execute disposable three-client journey","06-browser.sh"),
            ("Record binding, sanitize evidence, and write final hashes","07-record.sh"),
            ("Verify clean postflight","08-clean.sh"),
            ("Verify hashes, binding, database contract, redaction, and journey checks","09-inspect.sh"),
          ]
          expression_open="$"+"{{"
          replacements={
            "release/movie-buff-rc-2026-08-06-01-rc7":"release/movie-buff-rc-2026-08-06-01-rc8",
            "e050b1e436809d956b4e4fd02a2e14283a6d7d44":"0899d19d60b222bf995a0f8116ed032d93794620",
            "aa6aeedf1061620a09c7cc44fcdb247998dae772":"94d6411e9613b8692a0e5ada3dadc398aebcc193",
            "validation/movie-buff-rc7-runner-base-v5-20260806":"validation/movie-buff-rc8-runner-base-v6-20260806",
            "validation/movie-buff-rc7-browser-run-v5-20260806":"validation/movie-buff-rc8-browser-run-v6-20260806",
            ".github/workflows/movie-buff-rc7-three-client-browser-v5.yml":".github/workflows/movie-buff-rc8-three-client-browser-v6.yml",
            "rc7-static":"rc8-static",
            "rc7-db":"rc8-db",
            "RC-7":"RC-8",
            expression_open+" github.event.pull_request.base.ref }}":"${CONTROLLER_BRANCH}",
            expression_open+" github.event.pull_request.head.ref }}":"${EXPECTED_TRIGGER_BRANCH}",
          }
          old_public="'publicExecute', pg_catalog.has_function_privilege('public', c.oid, 'execute'),"
          new_public="""'publicExecute', exists (
                select 1
                from pg_catalog.aclexplode(
                  coalesce(p.proacl, pg_catalog.acldefault('f', p.proowner))
                ) as privilege
                where privilege.grantee = 0
                  and privilege.privilege_type = 'EXECUTE'
              ),"""

          def extract(step_name):
              marker=f"- name: {step_name}"
              start=next(i for i,line in enumerate(source) if line.strip()==marker)
              run_line=next(i for i in range(start+1,len(source)) if source[i].strip()=="run: |")
              indent=len(source[run_line])-len(source[run_line].lstrip())
              body=[]
              for line in source[run_line+1:]:
                  if line.strip() and len(line)-len(line.lstrip()) <= indent:
                      break
                  body.append(line[indent+2:] if line.strip() else "")
              value="\n".join(body)+"\n"
              for old,new in replacements.items():
                  value=value.replace(old,new)
              if step_name in {
                  "Prove repaired local database ACL matrix",
                  "Verify hashes, binding, database contract, redaction, and journey checks",
              }:
                  if old_public not in value and step_name == "Prove repaired local database ACL matrix":
                      raise SystemExit("PUBLIC ACL query anchor missing")
                  value=value.replace(old_public,new_public)
              return value

          for step_name,filename in names:
              path=output/filename
              path.write_text(extract(step_name),encoding="utf-8")
          PY
          for script in "${RUNNER_TEMP}"/0*.sh; do bash -n "${script}"; done

      - name: Provision runner prerequisites
        run: bash "${RUNNER_TEMP}/01-provision.sh"

      - name: Bind immutable product and reviewed harness
        run: bash "${RUNNER_TEMP}/02-bind.sh"

      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - id: static
        name: Execute repair static contract
        continue-on-error: true
        run: bash "${RUNNER_TEMP}/03-static.sh"

      - id: preflight
        name: Execute reviewed preflight
        continue-on-error: true
        run: bash "${RUNNER_TEMP}/04-preflight.sh"

      - id: database
        name: Prove repaired local database ACL matrix
        if: ${{ steps.static.outcome == 'success' && steps.preflight.outcome == 'success' }}
        continue-on-error: true
        run: bash "${RUNNER_TEMP}/05-database.sh"

      - id: browser
        name: Execute disposable three-client journey
        if: ${{ steps.database.outcome == 'success' }}
        continue-on-error: true
        run: bash "${RUNNER_TEMP}/06-browser.sh"

      - name: Preserve failure evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/movie-buff-three-client-full-v2"
          mkdir -p "${evidence}"
          for source in \
            "${RUNNER_TEMP}/rc8-static-contract.log" \
            "${RUNNER_TEMP}/rc8-db-start.log" \
            "${RUNNER_TEMP}/rc8-db-reset.log" \
            "${RUNNER_TEMP}/rc8-db-contract.raw.json"; do
            if [ -f "${source}" ]; then
              cp "${source}" "${evidence}/$(basename "${source}")"
            fi
          done
          if [ ! -s "${RUNNER_TEMP}/rc8-static-contract.json" ]; then
            printf '%s\n' '{"classification":"FAIL","reason":"static contract did not produce PASS evidence"}' > "${RUNNER_TEMP}/rc8-static-contract.json"
          fi
          if [ ! -s "${RUNNER_TEMP}/rc8-db-contract.json" ]; then
            printf '%s\n' '{"classification":"FAIL","reason":"database contract did not produce PASS evidence"}' > "${RUNNER_TEMP}/rc8-db-contract.json"
          fi
          if [ ! -s "${evidence}/three-client-full-journey-v2.json" ]; then
            printf '%s\n' '{"classification":"FAIL","failure":"browser journey did not produce a PASS result artifact"}' > "${evidence}/three-client-full-journey-v2.json"
          fi

      - name: Record binding, sanitize evidence, and write final hashes
        if: always()
        run: bash "${RUNNER_TEMP}/07-record.sh"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/movie-buff-three-client-full-v2
          if-no-files-found: error
          retention-days: 30

      - name: Verify clean postflight
        if: always()
        run: bash "${RUNNER_TEMP}/08-clean.sh"

      - name: Enforce exact gate outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.static.outcome }}" = "success"
          test "${{ steps.preflight.outcome }}" = "success"
          test "${{ steps.database.outcome }}" = "success"
          test "${{ steps.browser.outcome }}" = "success"
          python3 - "${RUNNER_TEMP}/movie-buff-three-client-full-v2" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          assert json.loads((root/"static-contract.json").read_text())["classification"] == "PASS"
          assert json.loads((root/"database-contract.json").read_text())["classification"] == "PASS"
          assert json.loads((root/"three-client-full-journey-v2.json").read_text())["classification"] == "PASS"
          PY

  independent-artifact-inspection:
    if: ${{ always() }}
    needs: exact-three-client-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: evidence

      - name: Materialize independent inspector
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${SOURCE_CONTROLLER_SHA}"
          test "$(git rev-parse "${SOURCE_CONTROLLER_SHA}:.github/workflows/movie-buff-rc7-three-client-browser-v5.yml")" = "${SOURCE_CONTROLLER_BLOB}"
          git show "${SOURCE_CONTROLLER_SHA}:.github/workflows/movie-buff-rc7-three-client-browser-v5.yml" > "${RUNNER_TEMP}/source-controller.yml"
          python3 - "${RUNNER_TEMP}/source-controller.yml" "${RUNNER_TEMP}/inspect.sh" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          marker="- name: Verify hashes, binding, database contract, redaction, and journey checks"
          start=next(i for i,line in enumerate(lines) if line.strip()==marker)
          run_line=next(i for i in range(start+1,len(lines)) if lines[i].strip()=="run: |")
          indent=len(lines[run_line])-len(lines[run_line].lstrip())
          body=[]
          for line in lines[run_line+1:]:
              if line.strip() and len(line)-len(line.lstrip()) <= indent:
                  break
              body.append(line[indent+2:] if line.strip() else "")
          value="\n".join(body)+"\n"
          for old,new in {
            "e050b1e436809d956b4e4fd02a2e14283a6d7d44":"0899d19d60b222bf995a0f8116ed032d93794620",
            "aa6aeedf1061620a09c7cc44fcdb247998dae772":"94d6411e9613b8692a0e5ada3dadc398aebcc193",
          }.items():
              value=value.replace(old,new)
          Path(sys.argv[2]).write_text(value,encoding="utf-8")
          PY
          bash -n "${RUNNER_TEMP}/inspect.sh"

      - name: Verify exact artifact independently
        run: bash "${RUNNER_TEMP}/inspect.sh"
