name: Movie Buff Buster boundary and leave penalty supplement

on:
  push:
    branches: [validation/movie-buff-combined-race-matrix-v1]
    paths:
      - ".github/workflows/movie-buff-buster-leave-supplement.yml"
      - "scripts/movie-buff-buster-leave-supplement.mjs"
      - "scripts/movie-buff-combined-race-matrix-lab.sh"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: validation/movie-buff-combined-race-matrix-v1
  FUNCTIONAL_COMPOSITION_SHA: fe74dc595f54de30370c45169aaab0e8c5622d22
  FUNCTIONAL_COMPOSITION_TREE: 8326dc323f9378fd4d38a1013faa3fa4b0b338ac
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  exact-buster-leave:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Bind exact identity and tools
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          git merge-base --is-ancestor "${FUNCTIONAL_COMPOSITION_SHA}" HEAD
          test "$(git rev-parse "${FUNCTIONAL_COMPOSITION_SHA}^{tree}")" = "${FUNCTIONAL_COMPOSITION_TREE}"
          test -z "$(git status --porcelain)"
          test ! -f supabase/.temp/project-ref
          test "$(supabase --version)" = "2.111.0"
          node --check scripts/movie-buff-buster-leave-supplement.mjs
          docker --version
          psql --version

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Execute Buster and leave supplement
        shell: bash
        run: |
          set +e
          evidence="${RUNNER_TEMP}/movie-buff-buster-leave"
          raw="${RUNNER_TEMP}/movie-buff-buster-leave-raw"
          stack="${RUNNER_TEMP}/movie-buff-buster-leave-stack"
          users="${RUNNER_TEMP}/movie-buff-buster-leave-users.json"
          overall=0
          failure_step=""
          mkdir -p "${evidence}" "${raw}" "${stack}"
          cp -a supabase "${stack}/supabase"
          python3 - "${stack}/supabase/config.toml" "buster-leave-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); text=p.read_text(encoding='utf-8'); project=sys.argv[2]
          text,n=re.subn(r'(?m)^project_id\s*=\s*"[^"]+"\s*$',f'project_id = "{project}"',text,count=1)
          text,m=re.subn(r'(?ms)(^\[db\.seed\]\s*.*?^enabled\s*=\s*)true(\s*$)',r'\1false\2',text,count=1)
          if n != 1 or m != 1: raise SystemExit('ephemeral config rewrite failed')
          p.write_text(text,encoding='utf-8')
          PY
          code=$?; echo "$code" >"${raw}/config.exit"
          if [ "$code" -ne 0 ]; then overall=1; failure_step=config; fi

          if [ "$overall" -eq 0 ]; then
            (cd "${stack}" && supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor) >"${raw}/supabase-start.log" 2>&1
            code=$?; echo "$code" >"${raw}/supabase-start.exit"
            if [ "$code" -ne 0 ]; then overall=1; failure_step=supabase-start; fi
          fi
          if [ "$overall" -eq 0 ]; then
            (cd "${stack}" && supabase db reset --local) >"${raw}/db-reset.log" 2>&1
            code=$?; echo "$code" >"${raw}/db-reset.exit"
            if [ "$code" -ne 0 ]; then overall=1; failure_step=db-reset; fi
          fi
          if [ "$overall" -eq 0 ]; then
            status_env="$(cd "${stack}" && supabase status -o env 2>"${raw}/status.stderr.log")"
            code=$?; echo "$code" >"${raw}/status.exit"
            if [ "$code" -eq 0 ]; then
              eval "${status_env}"
              api_url="${API_URL:-http://127.0.0.1:54321}"
              publishable_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
              service_key="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
              database_url="${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
            else overall=1; failure_step=status; fi
          fi
          if [ "$overall" -eq 0 ]; then
            NEXT_PUBLIC_SUPABASE_URL="${api_url}" \
            SUPABASE_SERVICE_ROLE_KEY="${service_key}" \
            MOVIE_BUFF_LOCAL_USERS_OUTPUT="${users}" \
            MOVIE_BUFF_LOCAL_RUN_ID="buster-leave-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              node scripts/movie-buff-core-v6-local-users.mjs >"${raw}/local-users.log" 2>&1
            code=$?; echo "$code" >"${raw}/local-users.exit"
            if [ "$code" -ne 0 ]; then overall=1; failure_step=local-users; fi
          fi
          if [ "$overall" -eq 0 ]; then
            core_users="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))[:3],separators=(",",":")))' "${users}")"
            NEXT_PUBLIC_SUPABASE_URL="${api_url}" \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${publishable_key}" \
            SUPABASE_SERVICE_ROLE_KEY="${service_key}" \
            MOVIE_BUFF_LOCAL_DATABASE_URL="${database_url}" \
            MOVIE_BUFF_PHASE_TEST_USERS="${core_users}" \
            MOVIE_BUFF_EXPECTED_GIT_SHA="${GITHUB_SHA}" \
            MOVIE_BUFF_EVIDENCE_OUTPUT="${evidence}/buster-leave.json" \
              node scripts/movie-buff-buster-leave-supplement.mjs >"${raw}/supplement.stdout.log" 2>"${raw}/supplement.stderr.log"
            code=$?; echo "$code" >"${raw}/supplement.exit"
            if [ "$code" -ne 0 ]; then overall=1; failure_step=supplement; fi
          fi

          (cd "${stack}" && supabase stop --no-backup) >"${raw}/cleanup.log" 2>&1
          cleanup_exit=$?; echo "$cleanup_exit" >"${raw}/cleanup.exit"
          [ "$cleanup_exit" -eq 0 ] || overall=1
          rm -rf "${stack}" "${users}"

          python3 - "${raw}" "${evidence}" <<'PY'
          import pathlib,re,sys
          raw=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); out.mkdir(parents=True,exist_ok=True)
          patterns=[
            (r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+','[REDACTED_JWT]'),
            (r'postgres(?:ql)?://[^\s]+','postgresql://[REDACTED_LOCAL_DB_URL]'),
            (r'sb_(?:secret|publishable)_[A-Za-z0-9_-]+','[REDACTED_SUPABASE_KEY]'),
          ]
          for p in raw.iterdir():
            if not p.is_file(): continue
            text=p.read_text(encoding='utf-8',errors='replace')
            for pattern,replacement in patterns: text=re.sub(pattern,replacement,text)
            (out/p.name).write_text(text,encoding='utf-8')
          PY
          {
            echo "classification=$([ "$overall" -eq 0 ] && echo PASS || echo FAIL)"
            echo "failure_step=${failure_step}"
            echo "repository=BuffGamesStudio/buff-platform"
            echo "source_branch=${GITHUB_REF_NAME}"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "functional_composition_sha=${FUNCTIONAL_COMPOSITION_SHA}"
            echo "functional_composition_tree=${FUNCTIONAL_COMPOSITION_TREE}"
            echo "target=disposable-localhost"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >"${evidence}/metadata.txt"
          (cd "${evidence}" && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 sha256sum >sha256.txt && sha256sum -c sha256.txt) || overall=1
          git diff --check || overall=1
          test -z "$(git status --porcelain)" || overall=1
          exit "$overall"

      - name: Upload supplement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-buster-leave-${{ github.sha }}
          path: ${{ runner.temp }}/movie-buff-buster-leave
          if-no-files-found: error
          retention-days: 7

      - name: Verify clean postflight
        if: always()
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
