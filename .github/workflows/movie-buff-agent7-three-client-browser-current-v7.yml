name: Movie Buff current-head product-v7 three-client browser journey

on:
  push:
    branches:
      - validation/movie-buff-three-client-browser-current-v7
    paths:
      - .github/workflows/movie-buff-agent7-three-client-browser-current-v7.yml
  pull_request:
    branches:
      - integration/movie-buff
    paths:
      - .github/workflows/movie-buff-agent7-three-client-browser-current-v7.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTROLLER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  VALIDATION_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  EXPECTED_BRANCH: validation/movie-buff-three-client-browser-current-v7
  PRODUCT_BRANCH: validation/movie-buff-current-head-browser-product-v7
  PARENT_SHA: 558915d8c2f724aeefd59d4161b59ebe66ce9b94
  PARENT_TREE: b2f4afe32edf532599e21d9c00e3399c1e3a645f
  ARCHIVE_SOURCE_SHA: d90a7eb73ef724b4ef5205343e655c7597dcf978
  ARCHIVE_WORKFLOW_BLOB: d85c32f629de0dbacb9c6d0f00efef79c256867a
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  exact-three-client-browser:
    name: Exact current-head product-v7 three-client browser journey
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out exact browser controller
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROLLER_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Bind immutable product and materialize reviewed laboratory
        shell: bash
        run: |
          set -euo pipefail
          resolved_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${resolved_ref}" = "${VALIDATION_REF}"
          test "${resolved_ref}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${CONTROLLER_SHA}"
          case "$(git remote get-url origin)" in
            https://github.com/BuffGamesStudio/buff-platform|https://github.com/BuffGamesStudio/buff-platform.git) ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git rev-parse "${PARENT_SHA}^{tree}")" = "${PARENT_TREE}"
          test -z "$(git status --porcelain --untracked-files=all)"

          python3 - <<'PY'
          import os
          import subprocess

          parent = os.environ["PARENT_SHA"]
          expected = {".github/workflows/movie-buff-agent7-three-client-browser-current-v7.yml"}
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{parent}..HEAD"],
              text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected product-to-controller delta: {sorted(actual)}")
          PY

          node --test tests/movie-buff-lobby-auth-bootstrap.test.mjs
          node --check scripts/movie-buff-three-client-full-journey-v2.mjs
          node --check scripts/movie-buff-core-v11-local-users.mjs

          git fetch --no-tags --depth=1 origin "${ARCHIVE_SOURCE_SHA}"
          test "$(git rev-parse "${ARCHIVE_SOURCE_SHA}:.github/validation-archive/movie-buff-three-client-full-journey-v2.yml")" = "${ARCHIVE_WORKFLOW_BLOB}"
          git show "${ARCHIVE_SOURCE_SHA}:.github/validation-archive/movie-buff-three-client-full-journey-v2.yml" > "${RUNNER_TEMP}/agent7-reviewed-lab.yml"

          python3 - "${RUNNER_TEMP}" "${RUNNER_TEMP}/agent7-reviewed-lab.yml" <<'PY'
          from pathlib import Path
          import sys

          output = Path(sys.argv[1])
          lines = Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()

          def extract(step_name: str) -> str:
              marker = f"- name: {step_name}"
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_line = next(
                  i for i in range(start + 1, len(lines))
                  if lines[i].strip() == "run: |"
              )
              run_indent = len(lines[run_line]) - len(lines[run_line].lstrip())
              body = []
              for line in lines[run_line + 1:]:
                  if line.strip() and len(line) - len(line.lstrip()) <= run_indent:
                      break
                  body.append(line[run_indent + 2:] if line.strip() else "")
              if not body:
                  raise SystemExit(f"empty run block for {step_name}")
              return "\n".join(body) + "\n"

          preflight = extract("Bind exact source and validate harness")
          execute = extract("Execute disposable exact-SHA browser journey v2")

          execute = execute.replace(
              'git status --porcelain >"${raw}/git-status-before-repair.txt"',
              'git status --porcelain --untracked-files=all >"${raw}/git-status-before-repair.txt"',
          )

          old_shape = "\n".join([
              'allowed={"next-env.d.ts",fixture}',
              "unexpected=[]",
              "for line in status:",
              "    path=line[3:].strip()",
              '    if " -> " in path: path=path.split(" -> ",1)[1]',
              "    if path not in allowed: unexpected.append(line)",
              'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))',
          ])
          new_shape = "\n".join([
              'allowed={"next-env.d.ts",fixture}',
              'allowed_prefixes=("public/media/movie-buff/runtime-generated/",)',
              "unexpected=[]",
              "for line in status:",
              "    path=line[3:].strip()",
              '    if " -> " in path: path=path.split(" -> ",1)[1]',
              "    if path not in allowed and not path.startswith(allowed_prefixes): unexpected.append(line)",
              'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))',
          ])
          if old_shape not in execute:
              raise SystemExit("postflight status-shape anchor missing")
          execute = execute.replace(old_shape, new_shape)

          cleanup_anchor = "\n".join([
              'rm -f "${fixture}"',
              "git checkout -- next-env.d.ts >/dev/null 2>&1 || true",
              "rmdir public/media/movie-buff public/media 2>/dev/null || true",
          ])
          cleanup_replacement = "\n".join([
              'rm -f "${fixture}"',
              "rm -rf public/media/movie-buff/runtime-generated",
              "git checkout -- next-env.d.ts >/dev/null 2>&1 || true",
              "rmdir public/media/movie-buff public/media 2>/dev/null || true",
          ])
          if cleanup_anchor not in execute:
              raise SystemExit("runtime-generated cleanup anchor missing")
          execute = execute.replace(cleanup_anchor, cleanup_replacement)

          identity_replacements = {
              'NEXT_PUBLIC_MOVIE_BUFF_BUILD_BRANCH="${GITHUB_REF_NAME}"':
                  'NEXT_PUBLIC_MOVIE_BUFF_BUILD_BRANCH="${PRODUCT_BRANCH}"',
              'NEXT_PUBLIC_MOVIE_BUFF_BUILD_SHA="${GITHUB_SHA}"':
                  'NEXT_PUBLIC_MOVIE_BUFF_BUILD_SHA="${PARENT_SHA}"',
              'MOVIE_BUFF_EXPECTED_BRANCH="${EXPECTED_BRANCH}"':
                  'MOVIE_BUFF_EXPECTED_BRANCH="${PRODUCT_BRANCH}"',
              'MOVIE_BUFF_EXPECTED_GIT_SHA="${GITHUB_SHA}"':
                  'MOVIE_BUFF_EXPECTED_GIT_SHA="${PARENT_SHA}"',
          }
          for old, new in identity_replacements.items():
              if old not in execute:
                  raise SystemExit(f"product identity anchor missing: {old}")
              execute = execute.replace(old, new)

          transformed = []
          marker_count = 0
          for line in execute.splitlines():
              transformed.append(line)
              if line.strip() == 'NEXT_PUBLIC_MOVIE_BUFF_BUILD_MARKER="${build_marker}" \\':
                  indent = line[:len(line) - len(line.lstrip())]
                  transformed.append(
                      indent + 'NEXT_PUBLIC_MOVIE_BUFF_SOURCE_SHA="${PARENT_SHA}" \\'
                  )
                  transformed.append(indent + 'GITHUB_SHA="${PARENT_SHA}" \\')
                  marker_count += 1
          if marker_count != 2:
              raise SystemExit(f"expected two build/runtime identity markers, got {marker_count}")
          execute = "\n".join(transformed) + "\n"

          required = [
              "--untracked-files=all",
              'allowed_prefixes=("public/media/movie-buff/runtime-generated/",)',
              "rm -rf public/media/movie-buff/runtime-generated",
              'NEXT_PUBLIC_MOVIE_BUFF_BUILD_SHA="${PARENT_SHA}"',
              'MOVIE_BUFF_EXPECTED_GIT_SHA="${PARENT_SHA}"',
              'NEXT_PUBLIC_MOVIE_BUFF_SOURCE_SHA="${PARENT_SHA}"',
              'GITHUB_SHA="${PARENT_SHA}"',
          ]
          for marker in required:
              if marker not in execute:
                  raise SystemExit(f"missing transformed marker: {marker}")

          (output / "agent7-preflight.sh").write_text(preflight, encoding="utf-8")
          (output / "agent7-execute.sh").write_text(execute, encoding="utf-8")
          PY

          bash -n "${RUNNER_TEMP}/agent7-preflight.sh"
          bash -n "${RUNNER_TEMP}/agent7-execute.sh"

      - name: Execute reviewed preflight
        shell: bash
        run: |
          GITHUB_SHA="${CONTROLLER_SHA}" \
          GITHUB_REF_NAME="${EXPECTED_BRANCH}" \
            bash "${RUNNER_TEMP}/agent7-preflight.sh"

      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Execute disposable three-client journey
        shell: bash
        run: bash "${RUNNER_TEMP}/agent7-execute.sh"

      - name: Bind, redact-scan, and rehash exact evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/movie-buff-three-client-full-v2"
          mkdir -p "${evidence}"
          {
            echo "product_sha=${PARENT_SHA}"
            echo "product_tree=${PARENT_TREE}"
            echo "product_branch=${PRODUCT_BRANCH}"
            echo "controller_sha=$(git rev-parse HEAD)"
            echo "controller_tree=$(git rev-parse HEAD^{tree})"
            echo "controller_branch=${EXPECTED_BRANCH}"
            echo "workflow_event=${GITHUB_EVENT_NAME}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${evidence}/product-controller-binding.txt"

          python3 - "${evidence}" <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          findings = []
          patterns = (
              re.compile(r"eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}"),
              re.compile(r"sbp_[A-Za-z0-9_-]{20,}"),
          )
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              raw = path.read_bytes()
              if b"\x00" in raw:
                  continue
              text = raw.decode("utf-8", errors="replace")
              if any(pattern.search(text) for pattern in patterns):
                  findings.append(str(path.relative_to(root)))
          if findings:
              raise SystemExit("unredacted credential-shaped content: " + ", ".join(findings))
          PY

          rm -f "${evidence}/sha256.txt"
          (
            cd "${evidence}"
            find . -type f ! -path './sha256.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum > sha256.txt
            sha256sum -c sha256.txt
          )

      - name: Upload exact product-v7 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-three-client-current-v7-${{ env.CONTROLLER_SHA }}
          path: ${{ runner.temp }}/movie-buff-three-client-full-v2
          if-no-files-found: error
          retention-days: 14

      - name: Verify clean postflight
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
