name: Movie Buff current-head product-v7 three-client browser journey

on:
  push:
    branches:
      - validation/movie-buff-three-client-browser-current-v7
    paths:
      - .github/workflows/movie-buff-agent7-three-client-browser-current-v7.yml
  pull_request:
    branches:
      - integration/movie-buff
    paths:
      - .github/workflows/movie-buff-agent7-three-client-browser-current-v7.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTROLLER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  VALIDATION_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  EXPECTED_BRANCH: validation/movie-buff-three-client-browser-current-v7
  PRODUCT_BRANCH: validation/movie-buff-current-head-browser-product-v7
  PRODUCT_SHA: 558915d8c2f724aeefd59d4161b59ebe66ce9b94
  PRODUCT_TREE: b2f4afe32edf532599e21d9c00e3399c1e3a645f
  V2_WORKFLOW_BLOB: d85c32f629de0dbacb9c6d0f00efef79c256867a
  V7_ARCHIVE_BLOB: 94b9165526992825e0830e8658d07ed24181e3bc
  V2_HARNESS_BLOB: 3b08204937f26af9287f303906509dc057b399dc
  V3_RUNNER_BLOB: 5a7bb9da3a578e76a3f23879e80988201808f75b
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  exact-three-client-browser:
    name: Exact current-head product-v7 three-client browser journey
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out exact browser controller
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROLLER_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Bind controller and materialize reviewed product laboratory
        shell: bash
        run: |
          set -euo pipefail
          resolved_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${resolved_ref}" = "${VALIDATION_REF}"
          test "${resolved_ref}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${CONTROLLER_SHA}"
          case "$(git remote get-url origin)" in
            https://github.com/BuffGamesStudio/buff-platform|https://github.com/BuffGamesStudio/buff-platform.git) ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD^)" = "${PRODUCT_SHA}"
          test "$(git rev-parse "${PRODUCT_SHA}^{tree}")" = "${PRODUCT_TREE}"
          test -z "$(git status --porcelain --untracked-files=all)"

          python3 - <<'PY'
          import os
          import subprocess

          product = os.environ["PRODUCT_SHA"]
          expected = {".github/workflows/movie-buff-agent7-three-client-browser-current-v7.yml"}
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{product}..HEAD"],
              text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected product-to-controller delta: {sorted(actual)}")
          PY

          test "$(git rev-parse HEAD:.github/validation-archive/movie-buff-three-client-full-journey-v2.yml)" = "${V2_WORKFLOW_BLOB}"
          test "$(git rev-parse HEAD:.github/validation-archive/movie-buff-three-client-full-journey-v7.yml)" = "${V7_ARCHIVE_BLOB}"
          test "$(git rev-parse HEAD:scripts/movie-buff-three-client-full-journey-v2.mjs)" = "${V2_HARNESS_BLOB}"
          test "$(git rev-parse HEAD:scripts/movie-buff-three-client-full-journey-v3-runner.mjs)" = "${V3_RUNNER_BLOB}"
          node --test tests/movie-buff-lobby-auth-bootstrap.test.mjs
          node --check scripts/movie-buff-three-client-full-journey-v2.mjs
          node --check scripts/movie-buff-three-client-full-journey-v3-runner.mjs
          node --check scripts/movie-buff-core-v11-local-users.mjs

          python3 - "${RUNNER_TEMP}" <<'PY'
          from pathlib import Path
          import sys

          output = Path(sys.argv[1])
          archive = Path(".github/validation-archive/movie-buff-three-client-full-journey-v2.yml")
          lines = archive.read_text(encoding="utf-8").splitlines()

          def extract(step_name: str) -> str:
              marker = f"- name: {step_name}"
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_line = next(
                  i for i in range(start + 1, len(lines))
                  if lines[i].strip() == "run: |"
              )
              run_indent = len(lines[run_line]) - len(lines[run_line].lstrip())
              body = []
              for line in lines[run_line + 1:]:
                  if line.strip() and len(line) - len(line.lstrip()) <= run_indent:
                      break
                  body.append(line[run_indent + 2:] if line.strip() else "")
              if not body:
                  raise SystemExit(f"empty run block for {step_name}")
              return "\n".join(body) + "\n"

          preflight = extract("Bind exact source and validate harness")
          execute = extract("Execute disposable exact-SHA browser journey v2")

          source = Path("scripts/movie-buff-three-client-full-journey-v2.mjs").read_text(
              encoding="utf-8"
          )

          intro_anchor = '''    const noVip = page.locator("button").filter({ hasText: /^No VIP/ });
    await noVip.waitFor({ state: "visible", timeout: 30_000 });
    const snapshot = await page.evaluate(() => {
      const body = document.body.innerText.replace(/\\s+/g, " ");
      const match = body.match(/Server Countdown\\s+(\\d+)/i);
      return { privateVipVisible: body.includes("Private VIP Selection"), countdown: match ? Number(match[1]) : null };
    });'''
          intro_replacement = '''    await page.waitForFunction(() => {
      const body = document.body.innerText.replace(/\\s+/g, " ");
      const match = body.match(/Server Countdown\\s+(\\d+)/i);
      return /private vip selection/i.test(body)
        && Boolean(match)
        && Number(match?.[1] ?? 0) > 0;
    }, null, { timeout: 30_000 });
    const noVip = page.locator("button").filter({ hasText: /^No VIP/ });
    await noVip.waitFor({ state: "visible", timeout: 30_000 });
    const snapshot = await page.evaluate(() => {
      const body = document.body.innerText.replace(/\\s+/g, " ");
      const match = body.match(/Server Countdown\\s+(\\d+)/i);
      return { privateVipVisible: /private vip selection/i.test(body), countdown: match ? Number(match[1]) : null };
    });'''
          if intro_anchor not in source:
              raise SystemExit("Round Intro stabilization anchor missing")
          derived = source.replace(intro_anchor, intro_replacement, 1)

          legacy_route = "/\\/games\\/movie-buff\\/board\\?/"
          canonical_route = "/\\/games\\/movie-buff\\/board-preview\\?/"
          if derived.count(legacy_route) != 2:
              raise SystemExit("expected exactly two legacy board route assertions")
          derived = derived.replace(legacy_route, canonical_route)

          return_anchor = '''  await screenshotAll("board-return");

  await pages[0].goto(`${target.origin}/games/movie-buff/visual-runtime-preview`, { waitUntil: "domcontentloaded", timeout: 60_000 });'''
          return_replacement = '''  await screenshotAll("board-return");

  await Promise.all(pages.map(async (page, index) => {
    await page.reload({ waitUntil: "domcontentloaded", timeout: 60_000 });
    await page.waitForURL(/\\/games\\/movie-buff\\/board-preview\\?/, { timeout: 60_000 });
    await assertMarker(page, index + 1);
  }));
  const persistedUsedTiles = await Promise.all(pages.map((page) => page.evaluate(() => {
    const complete = [...document.querySelectorAll("button")].filter((button) => button.textContent?.includes("Scene Complete"));
    return {
      count: complete.length,
      disabled: complete.filter((button) => button.disabled).length,
      buster: complete.filter((button) => button.textContent?.includes("Buster slate stamped")).length,
    };
  })));
  assert.ok(
    persistedUsedTiles.every((item) => item.count >= 1 && item.disabled === item.count && item.buster >= 1),
    JSON.stringify(persistedUsedTiles),
  );
  pass("all-three-refresh-preserves-used-tile-buster", { persistedUsedTiles });
  await screenshotAll("board-return-all-three-refreshed");

  await pages[0].goto(`${target.origin}/games/movie-buff/visual-runtime-preview`, { waitUntil: "domcontentloaded", timeout: 60_000 });'''
          if return_anchor not in derived:
              raise SystemExit("all-three board-return persistence anchor missing")
          derived = derived.replace(return_anchor, return_replacement, 1)

          fallback_anchor = '''  await pages[0].getByText("The motion asset or renderer could not load", { exact: false }).waitFor({ timeout: 60_000 });'''
          fallback_replacement = '''  const fallbackMessages = pages[0].getByText("The motion asset or renderer could not load", { exact: false });
  const fallbackCount = await fallbackMessages.count();
  assert.ok(fallbackCount >= 2, `expected Curtain and Buster fallback surfaces, got ${fallbackCount}`);
  await Promise.all(Array.from({ length: fallbackCount }, (_, index) =>
    fallbackMessages.nth(index).waitFor({ state: "visible", timeout: 60_000 })
  ));'''
          if fallback_anchor not in derived:
              raise SystemExit("scoped fallback assertion anchor missing")
          derived = derived.replace(fallback_anchor, fallback_replacement, 1)

          derived_path = output / "movie-buff-three-client-current-v7.mjs"
          derived_path.write_text(derived, encoding="utf-8")

          execute = execute.replace(
              'git status --porcelain >"${raw}/git-status-before-repair.txt"',
              'git status --porcelain --untracked-files=all >"${raw}/git-status-before-repair.txt"',
          )
          command_anchor = 'node scripts/movie-buff-three-client-full-journey-v2.mjs >"${raw}/three-client-browser-v2.log" 2>&1'
          command_replacement = 'node "${RUNNER_TEMP}/movie-buff-three-client-current-v7.mjs" >"${raw}/three-client-browser-v2.log" 2>&1'
          if command_anchor not in execute:
              raise SystemExit("browser command anchor missing")
          execute = execute.replace(command_anchor, command_replacement, 1)

          old_shape = "\n".join([
              'allowed={"next-env.d.ts",fixture}',
              "unexpected=[]",
              "for line in status:",
              "    path=line[3:].strip()",
              '    if " -> " in path: path=path.split(" -> ",1)[1]',
              "    if path not in allowed: unexpected.append(line)",
              'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))',
          ])
          new_shape = "\n".join([
              'allowed={"next-env.d.ts",fixture}',
              'allowed_prefixes=("public/media/movie-buff/runtime-generated/",)',
              "unexpected=[]",
              "for line in status:",
              "    path=line[3:].strip()",
              '    if " -> " in path: path=path.split(" -> ",1)[1]',
              "    if path not in allowed and not path.startswith(allowed_prefixes): unexpected.append(line)",
              'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))',
          ])
          if old_shape not in execute:
              raise SystemExit("postflight status-shape anchor missing")
          execute = execute.replace(old_shape, new_shape)

          cleanup_anchor = "\n".join([
              'rm -f "${fixture}"',
              "git checkout -- next-env.d.ts >/dev/null 2>&1 || true",
              "rmdir public/media/movie-buff public/media 2>/dev/null || true",
          ])
          cleanup_replacement = "\n".join([
              'rm -f "${fixture}"',
              "rm -rf public/media/movie-buff/runtime-generated",
              "git checkout -- next-env.d.ts >/dev/null 2>&1 || true",
              "rmdir public/media/movie-buff public/media 2>/dev/null || true",
          ])
          if cleanup_anchor not in execute:
              raise SystemExit("runtime-generated cleanup anchor missing")
          execute = execute.replace(cleanup_anchor, cleanup_replacement)

          required = [
              "--untracked-files=all",
              "movie-buff-three-client-current-v7.mjs",
              'allowed_prefixes=("public/media/movie-buff/runtime-generated/",)',
              "rm -rf public/media/movie-buff/runtime-generated",
          ]
          for marker in required:
              if marker not in execute:
                  raise SystemExit(f"missing transformed marker: {marker}")

          (output / "product-preflight.sh").write_text(preflight, encoding="utf-8")
          (output / "product-execute.sh").write_text(execute, encoding="utf-8")
          PY

          node --check "${RUNNER_TEMP}/movie-buff-three-client-current-v7.mjs"
          bash -n "${RUNNER_TEMP}/product-preflight.sh"
          bash -n "${RUNNER_TEMP}/product-execute.sh"

      - name: Detach to exact immutable product
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${PRODUCT_SHA}"
          test "$(git rev-parse HEAD)" = "${PRODUCT_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${PRODUCT_TREE}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Execute reviewed product preflight
        shell: bash
        run: |
          GITHUB_SHA="${PRODUCT_SHA}" \
          GITHUB_REF_NAME="${PRODUCT_BRANCH}" \
          EXPECTED_BRANCH="${PRODUCT_BRANCH}" \
          PARENT_SHA="${PRODUCT_SHA}" \
            bash "${RUNNER_TEMP}/product-preflight.sh"

      - name: Install exact product dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Execute disposable three-client product journey
        shell: bash
        run: |
          GITHUB_SHA="${PRODUCT_SHA}" \
          GITHUB_REF_NAME="${PRODUCT_BRANCH}" \
          EXPECTED_BRANCH="${PRODUCT_BRANCH}" \
          PARENT_SHA="${PRODUCT_SHA}" \
            bash "${RUNNER_TEMP}/product-execute.sh"

      - name: Bind, redact-scan, and rehash exact evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/movie-buff-three-client-full-v2"
          mkdir -p "${evidence}"
          {
            echo "product_sha=${PRODUCT_SHA}"
            echo "product_tree=${PRODUCT_TREE}"
            echo "product_branch=${PRODUCT_BRANCH}"
            echo "controller_sha=${CONTROLLER_SHA}"
            echo "controller_tree=$(git rev-parse "${CONTROLLER_SHA}^{tree}")"
            echo "controller_branch=${EXPECTED_BRANCH}"
            echo "workflow_event=${GITHUB_EVENT_NAME}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${evidence}/product-controller-binding.txt"

          python3 - "${evidence}" <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          findings = []
          patterns = (
              re.compile(r"eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}"),
              re.compile(r"sbp_[A-Za-z0-9_-]{20,}"),
          )
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              raw = path.read_bytes()
              if b"\x00" in raw:
                  continue
              text = raw.decode("utf-8", errors="replace")
              if any(pattern.search(text) for pattern in patterns):
                  findings.append(str(path.relative_to(root)))
          if findings:
              raise SystemExit("unredacted credential-shaped content: " + ", ".join(findings))
          PY

          rm -f "${evidence}/sha256.txt"
          (
            cd "${evidence}"
            find . -type f ! -path './sha256.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum > sha256.txt
            sha256sum -c sha256.txt
          )

      - name: Upload exact product-v7 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-three-client-current-v7-${{ env.CONTROLLER_SHA }}
          path: ${{ runner.temp }}/movie-buff-three-client-full-v2
          if-no-files-found: error
          retention-days: 14

      - name: Verify clean product postflight
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${PRODUCT_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${PRODUCT_TREE}"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
