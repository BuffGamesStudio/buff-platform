name: Movie Buff Agent 7 current-head v2 corrected labs

on:
  push:
    branches:
      - validation/MOV-17-encoding-twin-v2
    paths:
      - .github/workflows/movie-buff-agent7-current-head-v2-corrections.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: validation/MOV-17-encoding-twin-v2
  PRODUCT_SHA: 5c2378cae045b0ae8ace8cec2c04c34e5c4f7257
  PRODUCT_TREE: ef83ad72323240c8479d0138d12ba3e05f2c2e12
  INTEGRATION_SHA: bf316a15a2120e32d8a32e479df2ae439081f9a1
  MOV15_SHA: 48d44bb156b71060d1b9adcc7a2a3f014cf92060
  MOV16_SHA: f169d652a9199a65afd5369c52c0584f635d7031
  MOV17_SHA: f17234debfb8942e1998306a12dc33301c1c5440
  MOV18_SHA: 00fee0da08a6b84232ab2385c63fdceb2886b847
  PR12_SHA: d1f7ca58b534cbccd3071743d542f5788c0e9173
  PRIOR_CONTROLLER_SHA: f31b7cf86b8fd75b741ca4adbb5c4401724aec6b
  PRIOR_DIAGNOSTIC_SHA: 1a90b919a19d23ecd57a53b41c3fbdfd42c3c8a9
  PRIOR_AUDIT_BLOB: 240c84442b84caca6d410528ced3a70e226e94a1
  V2_HARNESS_BLOB: 3b08204937f26af9287f303906509dc057b399dc
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  linux-corrected:
    name: Linux exact source and build corrected
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-anon-placeholder
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-publishable-placeholder
      SUPABASE_SERVICE_ROLE_KEY: local-service-placeholder
      SUPABASE_SECRET_KEY: local-secret-placeholder
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Bind exact candidate and component blobs
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/agent7-v2-linux-corrected"; mkdir -p "$evidence"; echo "EVIDENCE_DIR=$evidence" >>"$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%T "$PRODUCT_SHA")" = "$PRODUCT_TREE"
          git merge-base --is-ancestor "$PRODUCT_SHA" "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          for pair in \
            "$MOV15_SHA:tests/movie-buff-public-matchmaking-contract.test.mjs" \
            "$MOV16_SHA:scripts/movie-buff-vip-authority-personas.mjs" \
            "$MOV17_SHA:scripts/movie-buff-mov17-local-supabase-evidence.sh" \
            "$MOV18_SHA:src/lib/movie-buff/authoritativeVisualAdapter.ts" \
            "$PR12_SHA:.github/workflows/movie-buff-migration-encoding.yml"; do
            ref="${pair%%:*}"; path="${pair#*:}"
            test "$(git rev-parse "$GITHUB_SHA:$path")" = "$(git rev-parse "$ref:$path")"
          done
          printf 'controller_sha=%s\ncontroller_tree=%s\nproduct_sha=%s\nproduct_tree=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" "$PRODUCT_SHA" "$PRODUCT_TREE" >"$evidence/identity.txt"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute contracts, validator, encoding, TypeScript, build, and source gate
        shell: bash
        env:
          MOVIE_BUFF_CURRENT_REF: ${{ env.PRODUCT_SHA }}
          MOVIE_BUFF_BOM_ONLY_OUTPUT: ${{ runner.temp }}/agent7-v2-linux-corrected/migration-encoding.json
          NEXT_PUBLIC_MOVIE_BUFF_BUILD_BRANCH: ${{ env.EXPECTED_BRANCH }}
          NEXT_PUBLIC_MOVIE_BUFF_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_MOVIE_BUFF_BUILD_MARKER: agent7-v2c-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set +e
          node --test tests/movie-buff-public-matchmaking-contract.test.mjs tests/movie-buff-public-matchmaking-handoff.test.mjs tests/movie-buff-vip-authority.test.mjs tests/movie-buff-vip-finalize-contract.test.mjs tests/movie-buff-vip-null-category-rollback-contract.test.mjs tests/movie-buff-authoritative-phase-runtime.test.mjs tests/movie-buff-server-phase-machine.test.mjs tests/movie-buff-visual-runtime.test.mjs tests/movie-buff-authoritative-visual-adapter.test.mjs tests/movie-buff-migration-encoding.test.mjs tests/movie-buff-current-hardening-reconciliation.test.mjs tests/movie-buff-release-evidence-integrity.test.mjs >"$EVIDENCE_DIR/lane-tests.log" 2>&1; lane=$?
          node --test tests/movie-buff-independent-security-validation.test.mjs >"$EVIDENCE_DIR/validator.log" 2>&1; validator=$?
          node scripts/movie-buff-migration-bom-only-check.mjs "$INTEGRATION_SHA" >"$EVIDENCE_DIR/encoding.stdout.txt" 2>"$EVIDENCE_DIR/encoding.stderr.txt"; encoding=$?
          npx tsc --noEmit >"$EVIDENCE_DIR/typescript.log" 2>&1; ts=$?
          npm run build >"$EVIDENCE_DIR/build.log" 2>&1; build=$?
          node -e "const s=require('fs').readFileSync('src/app/games/movie-buff/lobby/LobbyClient.tsx','utf8');process.exit(s.includes('\"Start Match\"')&&s.includes('handleQuickStart')?1:0)"; control=$?
          printf 'lane=%s\nvalidator=%s\nencoding=%s\ntypescript=%s\nbuild=%s\nmanual_control=%s\nrelease=NO-GO\n' "$lane" "$validator" "$encoding" "$ts" "$build" "$control" >"$EVIDENCE_DIR/status.txt"
          git checkout -- next-env.d.ts >/dev/null 2>&1 || true
          git status --porcelain --untracked-files=all >"$EVIDENCE_DIR/git-status.txt"
          (cd "$EVIDENCE_DIR" && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 sha256sum >sha256.txt)
          test "$lane" -eq 0
          test "$validator" -eq 0
          test "$encoding" -eq 0
          test "$ts" -eq 0
          test "$build" -eq 0
          test "$control" -eq 0
          test -z "$(cat "$EVIDENCE_DIR/git-status.txt")"
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "agent7-v2-linux-corrected-${{ github.sha }}", path: "${{ runner.temp }}/agent7-v2-linux-corrected", if-no-files-found: error, retention-days: 14}

  database-corrected:
    name: Disposable database corrected
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: supabase/setup-cli@v1
        with: {version: 2.111.0}
      - name: Bind and execute reviewed database wrapper
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/movie-buff-core-v6-db.sh "$RUNNER_TEMP/agent7-v2c-db.sh"
          python3 - "$RUNNER_TEMP/agent7-v2c-db.sh" <<'PY'
          from pathlib import Path
          import os,re,sys
          p=Path(sys.argv[1]); t=p.read_text()
          for pat,val in [(r'(?m)^BRANCH="[^"]+"$',f'BRANCH="{os.environ["EXPECTED_BRANCH"]}"'),(r'(?m)^RAW_COMPOSITION="[0-9a-f]{40}"$',f'RAW_COMPOSITION="{os.environ["PRODUCT_SHA"]}"'),(r'(?m)^RAW_TREE="[0-9a-f]{40}"$',f'RAW_TREE="{os.environ["PRODUCT_TREE"]}"')]:
            t,n=re.subn(pat,val,t,count=1)
            if n!=1: raise SystemExit(f'identity patch failed: {pat}')
          p.write_text(t)
          PY
          chmod +x "$RUNNER_TEMP/agent7-v2c-db.sh"; bash -n "$RUNNER_TEMP/agent7-v2c-db.sh"
          "$RUNNER_TEMP/agent7-v2c-db.sh" "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" "$RUNNER_TEMP/agent7-v2c-db"
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "agent7-v2-db-corrected-${{ github.sha }}", path: "${{ runner.temp }}/agent7-v2c-db", if-no-files-found: error, retention-days: 14}

  races-corrected:
    name: Remaining races corrected
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: supabase/setup-cli@v1
        with: {version: 2.111.0}
      - name: Import, rebind, and execute reviewed splitter
        shell: bash
        run: |
          set -euo pipefail
          git show "$PRIOR_DIAGNOSTIC_SHA:scripts/movie-buff-agent7-race-diagnostics.sh" >"$RUNNER_TEMP/agent7-v2c-races.sh"
          python3 - "$RUNNER_TEMP/agent7-v2c-races.sh" <<'PY'
          from pathlib import Path
          import os,sys
          p=Path(sys.argv[1]); t=p.read_text()
          if 'd70d758c730d32d71525c9381b9f98b80e0e1e83' not in t or 'b0e9cfa1963d8fbca9c72dfe7fc64a9dbe2cbe8f' not in t: raise SystemExit('reviewed identity anchors absent')
          p.write_text(t.replace('d70d758c730d32d71525c9381b9f98b80e0e1e83',os.environ['PRODUCT_SHA']).replace('b0e9cfa1963d8fbca9c72dfe7fc64a9dbe2cbe8f',os.environ['PRODUCT_TREE']))
          PY
          chmod +x "$RUNNER_TEMP/agent7-v2c-races.sh"; bash -n "$RUNNER_TEMP/agent7-v2c-races.sh"
          "$RUNNER_TEMP/agent7-v2c-races.sh" remaining-races "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" "$RUNNER_TEMP/agent7-v2c-races"
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "agent7-v2-races-corrected-${{ github.sha }}", path: "${{ runner.temp }}/agent7-v2c-races", if-no-files-found: error, retention-days: 14}

  browser-corrected:
    name: Three-client browser corrected
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: supabase/setup-cli@v1
        with: {version: 2.111.0}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Import and execute immutable browser lab
        shell: bash
        run: |
          set -euo pipefail
          git show "$PRIOR_CONTROLLER_SHA:scripts/movie-buff-agent7-lobby-control-audit.mjs" >scripts/movie-buff-agent7-lobby-control-audit.mjs
          test "$(git hash-object scripts/movie-buff-agent7-lobby-control-audit.mjs)" = "$PRIOR_AUDIT_BLOB"
          git show "$PRIOR_CONTROLLER_SHA:.github/workflows/movie-buff-agent7-exact-composition.yml" >"$RUNNER_TEMP/prior-agent7.yml"
          python3 - "$RUNNER_TEMP/prior-agent7.yml" "$RUNNER_TEMP/agent7-v2c-browser.sh" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text().splitlines(); marker='- name: Execute disposable full browser journey'
          start=next(i for i,l in enumerate(lines) if l.strip()==marker); run=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='run: |'); indent=len(lines[run])-len(lines[run].lstrip()); body=[]
          for line in lines[run+1:]:
            if line.strip() and len(line)-len(line.lstrip())<=indent: break
            body.append(line[indent+2:] if line.strip() else '')
          text='\n'.join(body)+'\n'; anchor='git_status="$(git status --porcelain --untracked-files=all)"'
          if text.count(anchor)!=1: raise SystemExit('browser status anchor mismatch')
          text=text.replace(anchor,'rm -f scripts/movie-buff-agent7-lobby-control-audit.mjs\n          '+anchor)
          Path(sys.argv[2]).write_text(text)
          PY
          bash -n "$RUNNER_TEMP/agent7-v2c-browser.sh"
          bash "$RUNNER_TEMP/agent7-v2c-browser.sh"
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: "agent7-v2-browser-corrected-${{ github.sha }}", path: "${{ runner.temp }}/movie-buff-agent7-browser", if-no-files-found: error, retention-days: 14}
      - if: always()
        shell: bash
        run: |
          rm -f scripts/movie-buff-agent7-lobby-control-audit.mjs public/media/movie-buff/browser-journey-fixture.mp4
          rm -rf public/media/movie-buff/runtime-generated
          git checkout -- next-env.d.ts >/dev/null 2>&1 || true
          rmdir public/media/movie-buff public/media 2>/dev/null || true
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
