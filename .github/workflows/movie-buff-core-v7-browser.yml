name: Movie Buff core v7 exact three-browser laboratory

on:
  push:
    branches:
      - validation/movie-buff-core-v7-browser-v1
    paths:
      - ".github/workflows/movie-buff-core-v7-browser.yml"
      - "scripts/movie-buff-core-v7-local-users.mjs"
      - "scripts/movie-buff-core-v7-three-browser-lab.mjs"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: validation/movie-buff-core-v7-browser-v1
  CORE_SHA: 700783a7f669878377eb9e015009d57e4764405b
  CORE_TREE: 629962d5ceaea39a40d6c9c6d3b14556c40e09f4
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  exact-three-browser:
    name: Exact current-core three authenticated browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out exact browser harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact core and validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          test "$(git rev-parse "${CORE_SHA}^{tree}")" = "${CORE_TREE}"
          git merge-base --is-ancestor "${CORE_SHA}" HEAD
          actual="$(git diff --name-only "${CORE_SHA}"..HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/movie-buff-core-v7-browser.yml' \
            'scripts/movie-buff-core-v7-local-users.mjs' \
            'scripts/movie-buff-core-v7-three-browser-lab.mjs' | sort)"
          test "${actual}" = "${expected}"
          test ! -f supabase/.temp/project-ref
          test -z "$(git status --porcelain)"
          test "$(node --version | cut -d. -f1)" = "v22"
          docker --version

      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Execute exact localhost browser laboratory
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/movie-buff-core-v7-browser-evidence
          USERS_FILE: ${{ runner.temp }}/movie-buff-core-v7-browser-users.json
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/movie-buff-core-v7-playwright
          WORK_ROOT: ${{ runner.temp }}/movie-buff-core-v7-browser-stack
        run: |
          set -uo pipefail
          set +e
          mkdir -p "${EVIDENCE_DIR}"
          overall=0
          app_pid=""

          cleanup() {
            if [ -n "${app_pid}" ]; then
              kill "${app_pid}" >/dev/null 2>&1 || true
              wait "${app_pid}" >/dev/null 2>&1 || true
              app_pid=""
            fi
            if [ -d "${WORK_ROOT}/supabase" ]; then
              (cd "${WORK_ROOT}" && supabase stop --no-backup) >"${EVIDENCE_DIR}/cleanup.log" 2>&1
              cleanup_exit=$?
            else
              cleanup_exit=125
            fi
            printf '%s\n' "${cleanup_exit}" > "${EVIDENCE_DIR}/cleanup.exit"
            rm -rf "${WORK_ROOT}" "${USERS_FILE}" "${PLAYWRIGHT_ROOT}"
            unset NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY
          }
          trap cleanup EXIT

          printf 'laboratory=movie-buff-core-v7-three-browser\nharness_sha=%s\ncore_sha=%s\ncore_tree=%s\nclassification=UNKNOWN\nbrowser_behavior=UNKNOWN\nhosted_state=NOT APPLICABLE\n' \
            "${GITHUB_SHA}" "${CORE_SHA}" "${CORE_TREE}" > "${EVIDENCE_DIR}/metadata.txt"
          git diff --name-only "${CORE_SHA}"..HEAD > "${EVIDENCE_DIR}/validation-owned-paths.txt"
          node --version > "${EVIDENCE_DIR}/node-version.txt"
          npm --version > "${EVIDENCE_DIR}/npm-version.txt"
          supabase --version > "${EVIDENCE_DIR}/supabase-version.txt"
          docker --version > "${EVIDENCE_DIR}/docker-version.txt"

          rm -rf "${WORK_ROOT}"
          mkdir -p "${WORK_ROOT}"
          cp -a supabase "${WORK_ROOT}/supabase"
          python3 - "${WORK_ROOT}/supabase/config.toml" "core-v7-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" <<'PY'
          import pathlib, re, sys
          config = pathlib.Path(sys.argv[1])
          project_id = sys.argv[2]
          text = config.read_text(encoding="utf-8")
          text, project_count = re.subn(
              r'(?m)^project_id\s*=\s*"[^"]+"\s*$',
              f'project_id = "{project_id}"',
              text,
              count=1,
          )
          text, seed_count = re.subn(
              r'(?ms)(^\[db\.seed\]\s*.*?^enabled\s*=\s*)true(\s*$)',
              r'\1false\2',
              text,
              count=1,
          )
          if project_count != 1 or seed_count != 1:
              raise SystemExit("unable to create isolated local Supabase config")
          config.write_text(text, encoding="utf-8")
          PY
          config_exit=$?
          printf '%s\n' "${config_exit}" > "${EVIDENCE_DIR}/ephemeral-config.exit"
          if [ "${config_exit}" -ne 0 ]; then overall=1; fi

          if [ "${config_exit}" -eq 0 ]; then
            (cd "${WORK_ROOT}" && supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor) \
              > "${EVIDENCE_DIR}/supabase-start.log" 2>&1
            start_exit=$?
          else
            start_exit=125
          fi
          printf '%s\n' "${start_exit}" > "${EVIDENCE_DIR}/supabase-start.exit"
          if [ "${start_exit}" -ne 0 ]; then overall=1; fi

          if [ "${start_exit}" -eq 0 ]; then
            (cd "${WORK_ROOT}" && supabase db reset --local) \
              > "${EVIDENCE_DIR}/database-reset.log" 2>&1
            reset_exit=$?
          else
            reset_exit=125
          fi
          printf '%s\n' "${reset_exit}" > "${EVIDENCE_DIR}/database-reset.exit"
          if [ "${reset_exit}" -ne 0 ]; then overall=1; fi

          if [ "${reset_exit}" -eq 0 ]; then
            status_env="$(cd "${WORK_ROOT}" && supabase status -o env 2>"${EVIDENCE_DIR}/supabase-status.error")"
            status_exit=$?
            printf '%s\n' "${status_exit}" > "${EVIDENCE_DIR}/supabase-status.exit"
            if [ "${status_exit}" -ne 0 ]; then overall=1; fi
            eval "${status_env}"
            export NEXT_PUBLIC_SUPABASE_URL="${API_URL:-http://127.0.0.1:55321}"
            export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
            export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
            export MOVIE_BUFF_APP_URL="http://127.0.0.1:3001"

            MOVIE_BUFF_LOCAL_USERS_OUTPUT="${USERS_FILE}" \
            MOVIE_BUFF_LOCAL_RUN_ID="core-v7-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              node scripts/movie-buff-core-v7-local-users.mjs \
              > "${EVIDENCE_DIR}/local-users-setup.log" 2>&1
            users_exit=$?
            printf '%s\n' "${users_exit}" > "${EVIDENCE_DIR}/local-users-setup.exit"
            if [ "${users_exit}" -ne 0 ]; then overall=1; fi

            NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL}" \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}" \
              npm run dev -- --hostname 127.0.0.1 --port 3001 \
              > "${EVIDENCE_DIR}/application.log" 2>&1 &
            app_pid=$!
            app_health=1
            for attempt in $(seq 1 90); do
              curl -fsS "${MOVIE_BUFF_APP_URL}/sign-in" >/dev/null 2>&1
              app_health=$?
              if [ "${app_health}" -eq 0 ]; then break; fi
              sleep 1
            done
            printf '%s\n' "${app_health}" > "${EVIDENCE_DIR}/application-health.exit"
            if [ "${app_health}" -ne 0 ]; then overall=1; fi

            mkdir -p "${PLAYWRIGHT_ROOT}"
            (
              cd "${PLAYWRIGHT_ROOT}"
              npm init -y >/dev/null 2>&1
              npm install --ignore-scripts --no-audit --no-fund playwright@1.54.2
              npx playwright install --with-deps chromium
            ) > "${EVIDENCE_DIR}/playwright-install.log" 2>&1
            playwright_exit=$?
            printf '%s\n' "${playwright_exit}" > "${EVIDENCE_DIR}/playwright-install.exit"
            if [ "${playwright_exit}" -ne 0 ]; then overall=1; fi

            if [ "${users_exit}" -eq 0 ] && [ "${app_health}" -eq 0 ] && [ "${playwright_exit}" -eq 0 ]; then
              MOVIE_BUFF_EXPECTED_GIT_SHA="${GITHUB_SHA}" \
              MOVIE_BUFF_CORE_SHA="${CORE_SHA}" \
              MOVIE_BUFF_LOCAL_USERS_OUTPUT="${USERS_FILE}" \
              MOVIE_BUFF_EVIDENCE_DIR="${EVIDENCE_DIR}" \
              PLAYWRIGHT_PACKAGE_ROOT="${PLAYWRIGHT_ROOT}" \
                node scripts/movie-buff-core-v7-three-browser-lab.mjs \
                > "${EVIDENCE_DIR}/three-browser.log" 2>&1
              browser_exit=$?
            else
              browser_exit=125
            fi
            printf '%s\n' "${browser_exit}" > "${EVIDENCE_DIR}/three-browser.exit"
            if [ "${browser_exit}" -ne 0 ]; then overall=1; fi
          else
            printf '125\n' > "${EVIDENCE_DIR}/supabase-status.exit"
            printf '125\n' > "${EVIDENCE_DIR}/local-users-setup.exit"
            printf '125\n' > "${EVIDENCE_DIR}/application-health.exit"
            printf '125\n' > "${EVIDENCE_DIR}/playwright-install.exit"
            printf '125\n' > "${EVIDENCE_DIR}/three-browser.exit"
          fi

          cleanup
          trap - EXIT

          classification=PASS
          if [ "${overall}" -ne 0 ]; then classification=FAIL; fi
          printf '\nclassification=%s\nexit_code=%s\nfinished_at=%s\n' \
            "${classification}" "${overall}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> "${EVIDENCE_DIR}/metadata.txt"

          while IFS= read -r -d '' file; do
            python3 -B scripts/movie-buff-redact-evidence.py "${file}" "${file}.redacted"
            redact_exit=$?
            if [ "${redact_exit}" -eq 0 ]; then
              mv "${file}.redacted" "${file}"
            else
              overall=1
              rm -f "${file}.redacted"
            fi
          done < <(
            find "${EVIDENCE_DIR}" -maxdepth 1 -type f \
              \( -name '*.log' -o -name '*.txt' -o -name '*.json' -o -name '*.exit' \) \
              -print0
          )

          if grep -RIlE \
            'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|sb_secret_[A-Za-z0-9_-]+|AKIA[0-9A-Z]{16}|[Bb]earer[[:space:]]+[A-Za-z0-9._-]{20,}' \
            "${EVIDENCE_DIR}" > "${EVIDENCE_DIR}/secret-scan.txt"; then
            overall=1
          else
            printf 'tested_secret_patterns=PASS\n' > "${EVIDENCE_DIR}/secret-scan.txt"
          fi

          (
            cd "${EVIDENCE_DIR}"
            find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 sha256sum > sha256.txt
            sha256sum -c sha256.txt
          )
          hash_exit=$?
          if [ "${hash_exit}" -ne 0 ]; then overall=1; fi
          exit "${overall}"

      - name: Upload exact browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-core-v7-browser-${{ github.sha }}
          path: ${{ runner.temp }}/movie-buff-core-v7-browser-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Verify checkout remained clean
        if: always()
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
