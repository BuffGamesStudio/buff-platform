name: Movie Buff release-train combined runtime via runner base

on:
  push:
    branches:
      - validation/movie-buff-release-train-runner-trigger-20260806
    paths:
      - ".github/workflows/movie-buff-core-v6-race-browser-v2.yml"
      - ".github/workflows/movie-buff-release-train-combined-runtime.yml"
      - "scripts/movie-buff-release-train-combined-runtime-lab.sh"
      - "scripts/movie-buff-release-train-canonical-leave-race.mjs"
      - "scripts/movie-buff-release-train-patch-owner-fixtures.py"
      - "docs/validation/movie-buff-release-train-combined-runtime.manifest.json"
  pull_request:
    branches:
      - validation/movie-buff-release-train-runner-base-20260806
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: validation/movie-buff-release-train-runner-trigger-20260806
  PRODUCT_SHA: c3a6aff9138f6e12b50e54f5b3c0f4bddcc101f6
  PRODUCT_TREE: a995a9aeb2fca76d2c1b216ece3a2645c2393c71
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  combined-runtime:
    name: Disposable MOV-15/MOV-16/MOV-17 race matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_DIR: ${{ runner.temp }}/movie-buff-release-train-runtime
      STACK_ROOT: ${{ runner.temp }}/movie-buff-release-train-stack
      PROOF_ROOT: ${{ runner.temp }}/movie-buff-release-train-worktree
      USERS_FILE: ${{ runner.temp }}/movie-buff-release-train-users.json

    steps:
      - name: Check out exact controller
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Supabase CLI 2.111.0
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Verify runner-base identity
        shell: bash
        run: |
          set -euo pipefail
          resolved_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${resolved_ref}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          git merge-base --is-ancestor "${PRODUCT_SHA}" HEAD
          test "$(git rev-parse "${PRODUCT_SHA}^{tree}")" = "${PRODUCT_TREE}"
          allowed='^(\.github/workflows/movie-buff-core-v6-race-browser-v2\.yml|\.github/workflows/movie-buff-release-train-combined-runtime\.yml|docs/validation/movie-buff-release-train-combined-runtime\.manifest\.json|scripts/movie-buff-release-train-combined-runtime-lab\.sh|scripts/movie-buff-release-train-canonical-leave-race\.mjs|scripts/movie-buff-release-train-patch-owner-fixtures\.py)$'
          unexpected="$(git diff --name-only "${PRODUCT_SHA}..HEAD" | grep -Ev "${allowed}" || true)"
          test -z "${unexpected}"
          test -z "$(git status --porcelain)"
          test ! -f supabase/.temp/project-ref
          test "$(supabase --version)" = "2.111.0"
          bash -n scripts/movie-buff-release-train-combined-runtime-lab.sh
          node --check scripts/movie-buff-release-train-canonical-leave-race.mjs
          python3 -m py_compile scripts/movie-buff-release-train-patch-owner-fixtures.py
          docker --version
          psql --version

      - name: Execute exact disposable runtime matrix
        shell: bash
        run: |
          cp scripts/movie-buff-release-train-combined-runtime-lab.sh "${RUNNER_TEMP}/runtime-lab.sh"
          python3 - "${RUNNER_TEMP}/runtime-lab.sh" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          text=p.read_text()
          old='[[ "$(git -C "$SOURCE_ROOT" rev-parse HEAD^)" == "$PRODUCT_SHA" ]] || { fail_step wrong-product-parent; return; }'
          new='git -C "$SOURCE_ROOT" merge-base --is-ancestor "$PRODUCT_SHA" HEAD || { fail_step product-not-ancestor; return; }'
          if old not in text: raise SystemExit('runtime identity marker missing')
          p.write_text(text.replace(old,new,1))
          PY
          bash "${RUNNER_TEMP}/runtime-lab.sh" \
            "${EXPECTED_SHA}" \
            "${PRODUCT_SHA}" \
            "${PRODUCT_TREE}" \
            "${EXPECTED_BRANCH}" \
            "${EVIDENCE_DIR}" \
            "${STACK_ROOT}" \
            "${PROOF_ROOT}" \
            "${USERS_FILE}"

      - name: Upload combined runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-release-train-runtime-${{ env.EXPECTED_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7
