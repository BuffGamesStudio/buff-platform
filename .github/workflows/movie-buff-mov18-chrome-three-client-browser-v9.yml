name: Movie Buff MOV-18 exact Chrome validation v9

on:
  pull_request:
    branches: [validation/movie-buff-mov18-chrome-runner-base-v9-20260807]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  PRODUCT_BRANCH: fix/movie-buff-history-authoritative-reconciliation-20260807
  PRODUCT_SHA: 51e22cdf383b037607a874da410f088bbfeab890
  PRODUCT_TREE: 6ab306f913f42f5448a9c842849fe30295fb769d
  CONTROLLER_BRANCH: validation/movie-buff-mov18-chrome-runner-base-v9-20260807
  EXPECTED_TRIGGER_BRANCH: validation/movie-buff-mov18-chrome-browser-run-v9-20260807
  EXPECTED_BRANCH: validation/movie-buff-mov18-chrome-runner-base-v9-20260807
  PARENT_SHA: 51e22cdf383b037607a874da410f088bbfeab890
  CONTROLLER_SHA: ${{ github.event.pull_request.base.sha }}
  TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
  ARCHIVE_SOURCE_SHA: d90a7eb73ef724b4ef5205343e655c7597dcf978
  ARCHIVE_WORKFLOW_BLOB: d85c32f629de0dbacb9c6d0f00efef79c256867a
  ORIGINAL_HARNESS_BLOB: 3b08204937f26af9287f303906509dc057b399dc
  ARTIFACT_NAME: movie-buff-mov18-chrome-three-client-v9-${{ github.run_id }}-${{ github.run_attempt }}
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  exact-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Bind exact product and materialize preserved journey
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${{ github.event.pull_request.base.ref }}" = "${CONTROLLER_BRANCH}"
          test "${{ github.event.pull_request.head.ref }}" = "${EXPECTED_TRIGGER_BRANCH}"
          test "$(git rev-parse HEAD)" = "${CONTROLLER_SHA}"
          git merge-base --is-ancestor "${PRODUCT_SHA}" HEAD
          test "$(git rev-parse "${PRODUCT_SHA}^{tree}")" = "${PRODUCT_TREE}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD:scripts/movie-buff-three-client-full-journey-v2.mjs)" = "${ORIGINAL_HARNESS_BLOB}"
          python3 - <<'PY'
          import os, subprocess
          expected={".github/workflows/movie-buff-mov18-chrome-three-client-browser-v9.yml"}
          actual=set(subprocess.check_output(
              ["git","diff","--name-only",f"{os.environ['PRODUCT_SHA']}..HEAD"], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected product-to-controller delta: {sorted(actual)}")
          PY

          git fetch --no-tags --depth=1 origin "${ARCHIVE_SOURCE_SHA}"
          test "$(git rev-parse "${ARCHIVE_SOURCE_SHA}:.github/validation-archive/movie-buff-three-client-full-journey-v2.yml")" = "${ARCHIVE_WORKFLOW_BLOB}"
          git show "${ARCHIVE_SOURCE_SHA}:.github/validation-archive/movie-buff-three-client-full-journey-v2.yml" > "${RUNNER_TEMP}/reviewed-lab.yml"

          python3 - "${RUNNER_TEMP}" "${RUNNER_TEMP}/reviewed-lab.yml" <<'PY'
          from pathlib import Path
          import json, os, sys

          output=Path(sys.argv[1])
          lines=Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()

          def extract(step_name):
              marker=f"- name: {step_name}"
              start=next(i for i,line in enumerate(lines) if line.strip()==marker)
              run_line=next(i for i in range(start+1,len(lines)) if lines[i].strip()=="run: |")
              run_indent=len(lines[run_line])-len(lines[run_line].lstrip())
              body=[]
              for line in lines[run_line+1:]:
                  if line.strip() and len(line)-len(line.lstrip()) <= run_indent:
                      break
                  body.append(line[run_indent+2:] if line.strip() else "")
              if not body:
                  raise SystemExit(f"empty run block for {step_name}")
              return "\n".join(body)+"\n"

          preflight=extract("Bind exact source and validate harness")
          execute=extract("Execute disposable exact-SHA browser journey v2")
          for old,new in (
              ("${GITHUB_REF_NAME}","${CONTROLLER_BRANCH}"),
              ("${GITHUB_SHA}","${CONTROLLER_SHA}"),
          ):
              preflight=preflight.replace(old,new)
              execute=execute.replace(old,new)

          execute=execute.replace(
              'git status --porcelain >"${raw}/git-status-before-repair.txt"',
              'git status --porcelain --untracked-files=all >"${raw}/git-status-before-repair.txt"',
          )
          old_status='\n'.join([
              'allowed={"next-env.d.ts",fixture}',
              "unexpected=[]",
              "for line in status:",
              '    path=line[3:].strip()',
              '    if " -> " in path: path=path.split(" -> ",1)[1]',
              "    if path not in allowed: unexpected.append(line)",
              'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))',
          ])
          new_status='\n'.join([
              'allowed={"next-env.d.ts",fixture}',
              'allowed_prefixes=("public/media/movie-buff/runtime-generated/",)',
              "unexpected=[]",
              "for line in status:",
              '    path=line[3:].strip()',
              '    if " -> " in path: path=path.split(" -> ",1)[1]',
              "    if path not in allowed and not path.startswith(allowed_prefixes): unexpected.append(line)",
              'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))',
          ])
          if old_status not in execute:
              raise SystemExit("postflight status-shape anchor missing")
          execute=execute.replace(old_status,new_status)

          old_cleanup='\n'.join([
              'rm -f "${fixture}"',
              "git checkout -- next-env.d.ts >/dev/null 2>&1 || true",
              "rmdir public/media/movie-buff public/media 2>/dev/null || true",
          ])
          new_cleanup='\n'.join([
              'rm -f "${fixture}"',
              "rm -rf public/media/movie-buff/runtime-generated",
              "git checkout -- next-env.d.ts >/dev/null 2>&1 || true",
              "rmdir public/media/movie-buff public/media 2>/dev/null || true",
          ])
          if old_cleanup not in execute:
              raise SystemExit("runtime-generated cleanup anchor missing")
          execute=execute.replace(old_cleanup,new_cleanup)

          source=Path("scripts/movie-buff-three-client-full-journey-v2.mjs").read_text(encoding="utf-8")

          vip_anchor='body.includes("Private VIP Selection")'
          vip_replacement='body.toLowerCase().includes("private vip selection")'
          if source.count(vip_anchor) != 1:
              raise SystemExit(f"unexpected private-VIP assertion anchor count: {source.count(vip_anchor)}")
          corrected=source.replace(vip_anchor,vip_replacement,1)

          route_anchor=r'/\/games\/movie-buff\/board\?/'
          route_replacement=r'/\/games\/movie-buff\/board-preview\?/'
          route_count=corrected.count(route_anchor)
          if route_count != 2:
              raise SystemExit(f"unexpected board-route assertion anchor count: {route_count}")
          corrected=corrected.replace(route_anchor,route_replacement)

          observer_anchor='\n'.join([
              '    const enabledTiles = await pages[index].locator("button").filter({ hasText: "Select this scene" }).evaluateAll((buttons) => buttons.filter((button) => !button.disabled).length);',
              '    const observerLabels = await pages[index].getByText("Waiting for selector", { exact: false }).count();',
              '    boardUi.push({ player: index + 1, enabledTiles, observerLabels });',
              '    if (index === selectorIndex) assert.ok(enabledTiles > 0 && observerLabels === 0);',
              '    else assert.ok(enabledTiles === 0 && observerLabels > 0);',
          ])
          observer_replacement='\n'.join([
              '    const enabledTiles = await pages[index].locator("button").filter({ hasText: "Select this scene" }).evaluateAll((buttons) => buttons.filter((button) => !button.disabled).length);',
              '    const observerTileLabels = await pages[index].getByText("Waiting for selector", { exact: false }).count();',
              '    const observerBanner = await pages[index].getByText("You are watching the shared board. Only the current active human selector can choose a tile.", { exact: true }).count();',
              '    boardUi.push({ player: index + 1, enabledTiles, observerTileLabels, observerBanner });',
              '    if (index === selectorIndex) assert.ok(enabledTiles > 0 && observerTileLabels === 0 && observerBanner === 0);',
              '    else assert.ok(enabledTiles === 0 && observerTileLabels > 0 && observerBanner === 1);',
          ])
          observer_count=corrected.count(observer_anchor)
          if observer_count != 1:
              raise SystemExit(f"unexpected observer assertion anchor count: {observer_count}")
          corrected=corrected.replace(observer_anchor,observer_replacement,1)

          browser_anchor='const browser = await chromium.launch({ headless: true, args: ["--autoplay-policy=no-user-gesture-required"] });'
          browser_replacement='const browser = await chromium.launch({ channel: "chrome", headless: true, args: ["--autoplay-policy=no-user-gesture-required"] });'
          browser_count=corrected.count(browser_anchor)
          if browser_count != 1:
              raise SystemExit(f"unexpected browser-launch anchor count: {browser_count}")
          corrected=corrected.replace(browser_anchor,browser_replacement,1)

          arrays_anchor='const offlineExercise = [false, false, false];\nconst responseInspections = [];'
          arrays_replacement='const offlineExercise = [false, false, false];\nconst mov18FallbackExercise = [false, false, false];\nconst responseInspections = [];'
          arrays_count=corrected.count(arrays_anchor)
          if arrays_count != 1:
              raise SystemExit(f"unexpected exercise-array anchor count: {arrays_count}")
          corrected=corrected.replace(arrays_anchor,arrays_replacement,1)

          fallback_response_anchor='\n'.join([
              'function isExpectedFallbackResponse(response) {',
              '  const parsed = new URL(response.url());',
              '  return response.request().method() === "HEAD"',
              '    && response.status() === 404',
              '    && parsed.origin === target.origin',
              '    && parsed.pathname.startsWith("/movie-buff/animations/")',
              '    && parsed.pathname.endsWith(".riv");',
              '}',
          ])
          fallback_response_replacement='\n'.join([
              'function isExpectedFallbackResponse(response) {',
              '  const parsed = new URL(response.url());',
              '  return response.request().method() === "GET"',
              '    && response.status() === 404',
              '    && parsed.origin === target.origin',
              '    && parsed.pathname.startsWith("/movie-buff/rive/")',
              '    && parsed.pathname.endsWith(".riv");',
              '}',
          ])
          fallback_response_count=corrected.count(fallback_response_anchor)
          if fallback_response_count != 1:
              raise SystemExit(f"unexpected fallback-response anchor count: {fallback_response_count}")
          corrected=corrected.replace(fallback_response_anchor,fallback_response_replacement,1)

          console_anchor='\n'.join([
              '  page.on("console", (message) => {',
              '    if (message.type() === "error") evidence.consoleErrors.push({ player: index + 1, message: redact(message.text()) });',
              '  });',
          ])
          console_replacement='\n'.join([
              '  page.on("console", (message) => {',
              '    if (message.type() !== "error") return;',
              '    const text = redact(message.text());',
              '    evidence.consoleErrors.push({',
              '      player: index + 1,',
              '      message: text,',
              '      expectedOfflineExercise: offlineExercise[index] && /net::ERR_INTERNET_DISCONNECTED/i.test(text),',
              '      expectedMov18FallbackExercise: mov18FallbackExercise[index] && (',
              '        /Failed to fetch the Rive file: HTTP 404/i.test(text) ||',
              '        /Failed to load resource: the server responded with a status of 404/i.test(text)',
              '      ),',
              '    });',
              '  });',
          ])
          console_observer_count=corrected.count(console_anchor)
          if console_observer_count != 1:
              raise SystemExit(f"unexpected console-observer anchor count: {console_observer_count}")
          corrected=corrected.replace(console_anchor,console_replacement,1)

          console_assert_anchor='  assert.equal(evidence.consoleErrors.length, 0, `Console errors: ${JSON.stringify(evidence.consoleErrors)}`);'
          console_assert_replacement='\n'.join([
              '  const unexpectedConsoleErrors = evidence.consoleErrors.filter((entry) => !entry.expectedOfflineExercise && !entry.expectedMov18FallbackExercise);',
              '  assert.equal(unexpectedConsoleErrors.length, 0, `Console errors: ${JSON.stringify(unexpectedConsoleErrors)}`);',
          ])
          console_assert_count=corrected.count(console_assert_anchor)
          if console_assert_count != 1:
              raise SystemExit(f"unexpected console-assertion anchor count: {console_assert_count}")
          corrected=corrected.replace(console_assert_anchor,console_assert_replacement,1)

          used_tile_anchor='  const usedTiles = await Promise.all(pages.map((page) => page.evaluate(() => {'
          used_tile_replacement='\n'.join([
              '  await Promise.all(pages.map(async (page) => {',
              '    await page.getByText("Scene Complete", { exact: false }).first().waitFor({ state: "visible", timeout: 60_000 });',
              '    await page.getByText("Buster slate stamped", { exact: false }).first().waitFor({ state: "visible", timeout: 60_000 });',
              '  }));',
              '  const usedTiles = await Promise.all(pages.map((page) => page.evaluate(() => {',
          ])
          used_tile_count=corrected.count(used_tile_anchor)
          if used_tile_count != 1:
              raise SystemExit(f"unexpected used-tile assertion anchor count: {used_tile_count}")
          corrected=corrected.replace(used_tile_anchor,used_tile_replacement,1)

          fallback_text_anchor='  await pages[0].getByText("The motion asset or renderer could not load", { exact: false }).waitFor({ timeout: 60_000 });'
          fallback_text_replacement='  await pages[0].getByText("The motion asset, parser, or renderer could not initialize", { exact: false }).waitFor({ timeout: 60_000 });'
          fallback_text_count=corrected.count(fallback_text_anchor)
          if fallback_text_count != 1:
              raise SystemExit(f"unexpected MOV-18 fallback-text anchor count: {fallback_text_count}")
          corrected=corrected.replace(fallback_text_anchor,fallback_text_replacement,1)

          page0_goto_anchor='  await pages[0].goto(`${target.origin}/games/movie-buff/visual-runtime-preview`, { waitUntil: "domcontentloaded", timeout: 60_000 });'
          page0_goto_replacement='\n'.join([
              '  mov18FallbackExercise[0] = true;',
              '  await pages[0].goto(`${target.origin}/games/movie-buff/visual-runtime-preview`, { waitUntil: "domcontentloaded", timeout: 60_000 });',
          ])
          page0_goto_count=corrected.count(page0_goto_anchor)
          if page0_goto_count != 1:
              raise SystemExit(f"unexpected MOV-18 page-1 anchor count: {page0_goto_count}")
          corrected=corrected.replace(page0_goto_anchor,page0_goto_replacement,1)

          page1_goto_anchor='  await pages[1].goto(`${target.origin}/games/movie-buff/visual-runtime-preview`, { waitUntil: "domcontentloaded", timeout: 60_000 });'
          page1_goto_replacement='\n'.join([
              '  mov18FallbackExercise[1] = true;',
              '  await pages[1].goto(`${target.origin}/games/movie-buff/visual-runtime-preview`, { waitUntil: "domcontentloaded", timeout: 60_000 });',
          ])
          page1_goto_count=corrected.count(page1_goto_anchor)
          if page1_goto_count != 1:
              raise SystemExit(f"unexpected MOV-18 page-2 anchor count: {page1_goto_count}")
          corrected=corrected.replace(page1_goto_anchor,page1_goto_replacement,1)

          corrected_path=output/"movie-buff-three-client-full-journey-v9-chrome.mjs"
          corrected_path.write_text(corrected,encoding="utf-8")
          if "scripts/movie-buff-three-client-full-journey-v2.mjs" not in execute:
              raise SystemExit("journey harness invocation anchor missing")
          execute=execute.replace("scripts/movie-buff-three-client-full-journey-v2.mjs",str(corrected_path))

          (output/"browser-preflight.sh").write_text(preflight,encoding="utf-8")
          (output/"browser-execute.sh").write_text(execute,encoding="utf-8")
          (output/"harness-correction.json").write_text(json.dumps({
              "classification":"PASS",
              "scope":"validation-harness-only",
              "sourceBlob":os.environ["ORIGINAL_HARNESS_BLOB"],
              "priorV2Correction":"case-insensitive Private VIP Selection visibility",
              "v3Corrections":[
                  "authoritative board route is /games/movie-buff/board-preview with roomId query",
                  "observer semantics assert both the observer banner and disabled Waiting for selector tiles",
              ],
              "v6BrowserCorrection":"system Google Chrome required for H.264/AAC fixture decoding",
              "v7ConsoleCorrection":"only deliberate offline ERR_INTERNET_DISCONNECTED console errors are expected",
              "v8UsedTileCorrection":"wait for each persisted board preview to converge before unchanged used-tile assertion",
              "v9Mov18Correction":"align missing-Rive path/method/fallback copy with shipped runtime and tag only deliberate missing-Rive 404 diagnostics during MOV-18 proof",
              "routeReplacementCount":route_count,
              "observerReplacementCount":observer_count,
              "browserReplacementCount":browser_count,
              "exerciseArrayReplacementCount":arrays_count,
              "fallbackResponseReplacementCount":fallback_response_count,
              "consoleObserverReplacementCount":console_observer_count,
              "consoleAssertionReplacementCount":console_assert_count,
              "usedTileReplacementCount":used_tile_count,
              "fallbackTextReplacementCount":fallback_text_count,
              "mov18Page1ReplacementCount":page0_goto_count,
              "mov18Page2ReplacementCount":page1_goto_count,
              "productBytesChanged":False,
              "journeyContract":"V3 substantive requirements preserved",
          },indent=2)+"\n",encoding="utf-8")
          PY

          bash -n "${RUNNER_TEMP}/browser-preflight.sh"
          bash -n "${RUNNER_TEMP}/browser-execute.sh"
          node --check "${RUNNER_TEMP}/movie-buff-three-client-full-journey-v9-chrome.mjs"
          node --check scripts/movie-buff-core-v11-local-users.mjs

      - name: Provision runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg postgresql-client
          command -v google-chrome || command -v google-chrome-stable
          command -v ffmpeg
          command -v ffprobe
          command -v psql
          command -v supabase

      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - id: preflight
        name: Execute reviewed preflight
        continue-on-error: true
        shell: bash
        run: |
          set +e
          evidence="${RUNNER_TEMP}/movie-buff-three-client-full-v2"
          mkdir -p "${evidence}"
          bash -x "${RUNNER_TEMP}/browser-preflight.sh" >"${evidence}/reviewed-preflight.log" 2>&1
          exit_code=$?
          echo "${exit_code}" >"${evidence}/reviewed-preflight.exit"
          cat "${evidence}/reviewed-preflight.log"
          exit "${exit_code}"

      - id: browser
        name: Execute preserved V3 journey in codec-capable Chrome
        if: ${{ steps.preflight.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: bash "${RUNNER_TEMP}/browser-execute.sh"

      - name: Bind and hash V9 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/movie-buff-three-client-full-v2"
          mkdir -p "${evidence}"
          cp "${RUNNER_TEMP}/harness-correction.json" "${evidence}/harness-correction.json"
          controller_tree="$(git rev-parse HEAD^{tree})"
          python3 - "${evidence}/v9-binding.json" "${controller_tree}" <<'PY'
          import json,os,pathlib,sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
            "repository":"BuffGamesStudio/buff-platform",
            "productBranch":os.environ["PRODUCT_BRANCH"],
            "productSha":os.environ["PRODUCT_SHA"],
            "productTree":os.environ["PRODUCT_TREE"],
            "controllerBranch":os.environ["CONTROLLER_BRANCH"],
            "controllerSha":os.environ["CONTROLLER_SHA"],
            "controllerTree":sys.argv[2],
            "triggerSha":os.environ["TRIGGER_SHA"],
            "runId":os.environ["GITHUB_RUN_ID"],
            "runAttempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "target":"disposable-localhost-system-chrome",
            "validationVersion":"V9",
            "journeyContract":"V3 substantive requirements preserved",
          },indent=2)+"\n",encoding="utf-8")
          PY
          (
            cd "${evidence}"
            find . -type f ! -name V9-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > V9-SHA256SUMS.txt
            sha256sum -c V9-SHA256SUMS.txt
          )

      - name: Upload exact browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/movie-buff-three-client-full-v2
          if-no-files-found: error
          retention-days: 30

      - name: Verify clean postflight
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enforce V9 browser gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.preflight.outcome }}" = "success"
          test "${{ steps.browser.outcome }}" = "success"
          python3 - "${RUNNER_TEMP}/movie-buff-three-client-full-v2" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          correction=json.loads((root/"harness-correction.json").read_text())
          assert correction["classification"] == "PASS"
          assert correction["routeReplacementCount"] == 2
          assert correction["observerReplacementCount"] == 1
          assert correction["browserReplacementCount"] == 1
          assert correction["exerciseArrayReplacementCount"] == 1
          assert correction["fallbackResponseReplacementCount"] == 1
          assert correction["consoleObserverReplacementCount"] == 1
          assert correction["consoleAssertionReplacementCount"] == 1
          assert correction["usedTileReplacementCount"] == 1
          assert correction["fallbackTextReplacementCount"] == 1
          assert correction["mov18Page1ReplacementCount"] == 1
          assert correction["mov18Page2ReplacementCount"] == 1
          assert correction["productBytesChanged"] is False
          journey=json.loads((root/"three-client-full-journey-v2.json").read_text())
          assert journey["classification"] == "PASS", journey.get("failure")
          assert journey["target"]["kind"] == "disposable-localhost"
          PY

  independent-artifact-inspection:
    needs: exact-browser
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: evidence

      - name: Verify exact V9 binding, hashes, redaction, and browser PASS
        shell: bash
        run: |
          set -euo pipefail
          cd evidence
          sha256sum -c V9-SHA256SUMS.txt
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('.')
          binding=json.loads((root/'v9-binding.json').read_text())
          assert binding['repository']=='BuffGamesStudio/buff-platform'
          assert binding['productSha']=='51e22cdf383b037607a874da410f088bbfeab890'
          assert binding['productTree']=='6ab306f913f42f5448a9c842849fe30295fb769d'
          assert binding['target']=='disposable-localhost-system-chrome'
          assert binding['validationVersion']=='V9'
          correction=json.loads((root/'harness-correction.json').read_text())
          assert correction['classification']=='PASS'
          assert correction['routeReplacementCount']==2
          assert correction['observerReplacementCount']==1
          assert correction['browserReplacementCount']==1
          assert correction['exerciseArrayReplacementCount']==1
          assert correction['fallbackResponseReplacementCount']==1
          assert correction['consoleObserverReplacementCount']==1
          assert correction['consoleAssertionReplacementCount']==1
          assert correction['usedTileReplacementCount']==1
          assert correction['fallbackTextReplacementCount']==1
          assert correction['mov18Page1ReplacementCount']==1
          assert correction['mov18Page2ReplacementCount']==1
          assert correction['productBytesChanged'] is False
          journey=json.loads((root/'three-client-full-journey-v2.json').read_text())
          assert journey['classification']=='PASS', journey.get('failure')
          text='\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.txt','.log','.json','.env','.csv','.md'})
          forbidden=[
            r'sb_(?:publishable|secret)_[A-Za-z0-9_-]{12,}',
            r'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}',
            r'postgres(?:ql)?://[^\s\"\']+:[^\s\"\']+@[^\s\"\']+',
          ]
          for pattern in forbidden:
              assert re.search(pattern,text) is None, pattern
          PY
