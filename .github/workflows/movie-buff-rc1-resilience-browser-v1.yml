name: RC-1 strict resilience browser evidence v1

on:
  push:
    branches:
      - validation/movie-buff-rc1-resilience-browser-v1-20260808
    paths:
      - ".github/workflows/movie-buff-rc1-resilience-browser-v1.yml"
      - "scripts/validation/movie-buff-rc1-resilience-browser-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_SHA: 81d3618ce7be28a6ce81363a8bda524cd18ece15
  PRODUCT_TREE: 511c3501bd6a73f7556f636bc9e12ef30935d58d
  EXPECTED_BRANCH: validation/movie-buff-rc1-resilience-browser-v1-20260808
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  resilience-browser:
    name: Three-browser reconnect expiry and Buster timing lab
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out exact validation controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Bind exact product plus validation-only composition
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          test "$(git rev-parse "${PRODUCT_SHA}^{tree}")" = "${PRODUCT_TREE}"
          git merge-base --is-ancestor "${PRODUCT_SHA}" HEAD
          git diff --name-only "${PRODUCT_SHA}"...HEAD > "${RUNNER_TEMP}/composition-paths.txt"
          test -s "${RUNNER_TEMP}/composition-paths.txt"
          if grep -Ev '^(\.github/workflows/movie-buff-rc1-resilience-browser-v1\.yml|scripts/validation/movie-buff-rc1-resilience-browser-v1\.mjs)$' "${RUNNER_TEMP}/composition-paths.txt"; then
            echo "Unexpected product-owned path in validation composition" >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          test ! -f supabase/.temp/project-ref
          test "$(supabase --version)" = "2.111.0"
          node --version
          npm --version
          docker --version
          psql --version
          node --check scripts/validation/movie-buff-rc1-resilience-browser-v1.mjs
          test -f scripts/movie-buff-core-v11-local-users.mjs
          test -f scripts/generated/movie-buff-launch-bootstrap.sql

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run disposable localhost resilience browser lab
        shell: bash
        run: |
          set +e
          set -uo pipefail
          evidence="${RUNNER_TEMP}/movie-buff-rc1-resilience-browser-v1"
          raw="${RUNNER_TEMP}/movie-buff-rc1-resilience-browser-v1-raw"
          work="${RUNNER_TEMP}/movie-buff-rc1-resilience-browser-v1-stack"
          users="${RUNNER_TEMP}/movie-buff-rc1-resilience-browser-v1-users.json"
          playwright_root="${RUNNER_TEMP}/movie-buff-rc1-resilience-browser-v1-playwright"
          app_pid=""
          overall=0
          failure_step=""
          mkdir -p "${evidence}" "${raw}" "${work}"
          cp -a supabase "${work}/supabase"

          python3 - "${work}/supabase/config.toml" "rc1-resilience-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); text=p.read_text(encoding='utf-8'); project=sys.argv[2]
          text,n=re.subn(r'(?m)^project_id\s*=\s*"[^"]+"\s*$',f'project_id = "{project}"',text,count=1)
          text,m=re.subn(r'(?ms)(^\[db\.seed\]\s*.*?^enabled\s*=\s*)true(\s*$)',r'\1false\2',text,count=1)
          if n != 1 or m != 1: raise SystemExit('ephemeral config rewrite failed')
          p.write_text(text,encoding='utf-8')
          PY
          config_exit=$?; echo "${config_exit}" >"${raw}/config.exit"
          if [ "${config_exit}" -ne 0 ]; then overall=1; failure_step=config; fi

          if [ "${overall}" -eq 0 ]; then
            (cd "${work}" && supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor) >"${raw}/supabase-start.log" 2>&1
            start_exit=$?; echo "${start_exit}" >"${raw}/supabase-start.exit"
            if [ "${start_exit}" -ne 0 ]; then overall=1; failure_step=supabase-start; fi
          fi
          if [ "${overall}" -eq 0 ]; then
            (cd "${work}" && supabase db reset --local) >"${raw}/database-reset.log" 2>&1
            reset_exit=$?; echo "${reset_exit}" >"${raw}/database-reset.exit"
            if [ "${reset_exit}" -ne 0 ]; then overall=1; failure_step=database-reset; fi
          fi
          if [ "${overall}" -eq 0 ]; then
            status_env="$(cd "${work}" && supabase status -o env 2>"${raw}/supabase-status.error")"
            status_exit=$?; echo "${status_exit}" >"${raw}/supabase-status.exit"
            if [ "${status_exit}" -eq 0 ]; then
              eval "${status_env}"
              api_url="${API_URL:-http://127.0.0.1:54321}"
              publishable_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
              service_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
              database_url="${DB_URL:-}"
              case "${api_url}" in http://127.0.0.1:*|http://localhost:*) ;; *) overall=1; failure_step=nonlocal-api ;; esac
              if [ -z "${publishable_key}" ] || [ -z "${service_key}" ] || [ -z "${database_url}" ]; then overall=1; failure_step=credential-shape; fi
            else overall=1; failure_step=supabase-status; fi
          fi
          if [ "${overall}" -eq 0 ]; then
            psql "${database_url}" -X -v ON_ERROR_STOP=1 \
              -c "truncate table public.movie_categories, public.clips, public.movies, public.categories, public.content_types restart identity cascade" \
              >"${raw}/content-reset.log" 2>&1
            content_reset_exit=$?; echo "${content_reset_exit}" >"${raw}/content-reset.exit"
            if [ "${content_reset_exit}" -ne 0 ]; then overall=1; failure_step=content-reset; fi
          fi
          if [ "${overall}" -eq 0 ]; then
            psql "${database_url}" -X -v ON_ERROR_STOP=1 -f scripts/generated/movie-buff-launch-bootstrap.sql \
              >"${raw}/content-bootstrap.log" 2>&1
            bootstrap_exit=$?; echo "${bootstrap_exit}" >"${raw}/content-bootstrap.exit"
            if [ "${bootstrap_exit}" -ne 0 ]; then overall=1; failure_step=content-bootstrap; fi
          fi
          if [ "${overall}" -eq 0 ]; then
            NEXT_PUBLIC_SUPABASE_URL="${api_url}" \
            SUPABASE_SERVICE_ROLE_KEY="${service_key}" \
            MOVIE_BUFF_LOCAL_USERS_OUTPUT="${users}" \
            MOVIE_BUFF_LOCAL_RUN_ID="rc1-resilience-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              node scripts/movie-buff-core-v11-local-users.mjs >"${raw}/local-users.log" 2>&1
            users_exit=$?; echo "${users_exit}" >"${raw}/local-users.exit"
            if [ "${users_exit}" -ne 0 ]; then overall=1; failure_step=local-users; fi
          fi
          if [ "${overall}" -eq 0 ]; then
            NEXT_PUBLIC_SUPABASE_URL="${api_url}" \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${publishable_key}" \
            SUPABASE_SERVICE_ROLE_KEY="${service_key}" \
            MOVIE_BUFF_APP_URL="http://127.0.0.1:3001" \
              npm run build >"${raw}/build.log" 2>&1
            build_exit=$?; echo "${build_exit}" >"${raw}/build.exit"
            if [ "${build_exit}" -ne 0 ]; then overall=1; failure_step=build; fi
          fi
          if [ "${overall}" -eq 0 ]; then
            NEXT_PUBLIC_SUPABASE_URL="${api_url}" \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${publishable_key}" \
            SUPABASE_SERVICE_ROLE_KEY="${service_key}" \
            MOVIE_BUFF_APP_URL="http://127.0.0.1:3001" \
              npm run start -- --hostname 127.0.0.1 --port 3001 >"${raw}/application.log" 2>&1 &
            app_pid=$!
            app_health=1
            for attempt in $(seq 1 90); do
              if curl --fail --silent --show-error http://127.0.0.1:3001/sign-in >/dev/null 2>>"${raw}/application-health.log"; then app_health=0; break; fi
              sleep 1
            done
            echo "${app_health}" >"${raw}/application-health.exit"
            if [ "${app_health}" -ne 0 ]; then overall=1; failure_step=application-health; fi
          fi
          if [ "${overall}" -eq 0 ]; then
            mkdir -p "${playwright_root}"
            (
              cd "${playwright_root}"
              npm init -y >/dev/null 2>&1
              npm install --ignore-scripts --no-audit --no-fund playwright@1.54.2
              npx playwright install --with-deps chromium
            ) >"${raw}/playwright-install.log" 2>&1
            playwright_exit=$?; echo "${playwright_exit}" >"${raw}/playwright-install.exit"
            if [ "${playwright_exit}" -ne 0 ]; then overall=1; failure_step=playwright-install; fi
          fi
          if [ "${overall}" -eq 0 ]; then
            MOVIE_BUFF_PRODUCT_SHA="${PRODUCT_SHA}" \
            MOVIE_BUFF_PRODUCT_TREE="${PRODUCT_TREE}" \
            MOVIE_BUFF_CONTROLLER_SHA="${GITHUB_SHA}" \
            MOVIE_BUFF_APP_URL="http://127.0.0.1:3001" \
            NEXT_PUBLIC_SUPABASE_URL="${api_url}" \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${publishable_key}" \
            SUPABASE_SERVICE_ROLE_KEY="${service_key}" \
            MOVIE_BUFF_LOCAL_USERS_OUTPUT="${users}" \
            MOVIE_BUFF_EVIDENCE_DIR="${evidence}" \
            PLAYWRIGHT_PACKAGE_ROOT="${playwright_root}" \
              node scripts/validation/movie-buff-rc1-resilience-browser-v1.mjs >"${raw}/resilience-browser.log" 2>&1
            browser_exit=$?; echo "${browser_exit}" >"${raw}/resilience-browser.exit"
            if [ "${browser_exit}" -ne 0 ]; then overall=1; failure_step=resilience-browser; fi
          fi

          if [ -n "${app_pid}" ]; then kill "${app_pid}" >/dev/null 2>&1 || true; wait "${app_pid}" >/dev/null 2>&1 || true; fi
          (cd "${work}" && supabase stop --no-backup) >"${raw}/cleanup.log" 2>&1
          cleanup_exit=$?; echo "${cleanup_exit}" >"${raw}/cleanup.exit"
          [ "${cleanup_exit}" -eq 0 ] || { overall=1; [ -n "${failure_step}" ] || failure_step=cleanup; }
          rm -rf "${work}" "${users}" "${playwright_root}"

          python3 - "${raw}" "${evidence}" <<'PY'
          import pathlib,re,sys
          raw=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); out.mkdir(parents=True,exist_ok=True)
          patterns=[
            (r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+','[REDACTED_JWT]'),
            (r'postgres(?:ql)?://[^\s]+','[REDACTED_LOCAL_DB_URL]'),
            (r'sb_(?:secret|publishable)_[A-Za-z0-9_-]+','[REDACTED_SUPABASE_KEY]'),
            (r'(?i)(authorization:\s*bearer\s+)[A-Za-z0-9._-]+',r'\1[REDACTED]'),
            (r'(?i)((?:password|token|secret|key)\s*[=:]\s*)[^\s,;]+',r'\1[REDACTED]'),
          ]
          for p in raw.iterdir():
            if not p.is_file(): continue
            text=p.read_text(encoding='utf-8',errors='replace')
            for pattern,replacement in patterns: text=re.sub(pattern,replacement,text)
            (out/p.name).write_text(text,encoding='utf-8')
          PY

          cp "${RUNNER_TEMP}/composition-paths.txt" "${evidence}/composition-paths.txt"
          {
            echo "classification=$([ "${overall}" -eq 0 ] && echo PASS || echo FAIL)"
            echo "failure_step=${failure_step}"
            echo "repository=BuffGamesStudio/buff-platform"
            echo "controller_branch=${GITHUB_REF_NAME}"
            echo "controller_sha=$(git rev-parse HEAD)"
            echo "controller_tree=$(git rev-parse HEAD^{tree})"
            echo "product_sha=${PRODUCT_SHA}"
            echo "product_tree=${PRODUCT_TREE}"
            echo "target=disposable-localhost"
            echo "supabase_cli=$(supabase --version)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "cleanup_exit=${cleanup_exit}"
            echo "physical_windows_cursor_equivalence=UNKNOWN"
            echo "production_state=NOT APPLICABLE"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >"${evidence}/metadata.txt"

          python3 - "${evidence}" <<'PY'
          import pathlib,re,sys
          root=pathlib.Path(sys.argv[1])
          forbidden=[
            re.compile(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'),
            re.compile(r'postgres(?:ql)?://[^\s]+',re.I),
            re.compile(r'sb_(?:secret|publishable)_[A-Za-z0-9_-]+',re.I),
          ]
          hits=[]
          for p in root.rglob('*'):
            if not p.is_file() or p.suffix.lower() in {'.png','.zip'}: continue
            text=p.read_text(encoding='utf-8',errors='replace')
            for pattern in forbidden:
              if pattern.search(text): hits.append(f'{p.name}:{pattern.pattern}')
          if hits: raise SystemExit('unredacted evidence detected: '+','.join(hits))
          PY
          redact_exit=$?; echo "${redact_exit}" >"${evidence}/redaction-scan.exit.txt"
          [ "${redact_exit}" -eq 0 ] || overall=1

          (cd "${evidence}" && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 sha256sum >sha256.txt && sha256sum -c sha256.txt)
          hash_exit=$?; echo "${hash_exit}" >"${evidence}/hash-verification.exit.txt"
          [ "${hash_exit}" -eq 0 ] || overall=1
          git diff --check || overall=1
          test -z "$(git status --porcelain)" || overall=1
          exit "${overall}"

      - name: Upload resilience browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-rc1-resilience-browser-v1-${{ github.sha }}
          path: ${{ runner.temp }}/movie-buff-rc1-resilience-browser-v1
          if-no-files-found: error
          retention-days: 7

  independent-artifact-inspection:
    name: Independent resilience evidence inspection
    runs-on: ubuntu-24.04
    needs: resilience-browser
    if: always()
    steps:
      - name: Download evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: movie-buff-rc1-resilience-browser-v1-${{ github.sha }}
          path: evidence

      - name: Inspect exact identities, hashes, classification, and required checks
        shell: bash
        run: |
          set -euo pipefail
          test -f evidence/metadata.txt
          test -f evidence/resilience-browser-evidence.json
          test -f evidence/sha256.txt
          grep -Fx "product_sha=${PRODUCT_SHA}" evidence/metadata.txt
          grep -Fx "product_tree=${PRODUCT_TREE}" evidence/metadata.txt
          grep -Fx "controller_sha=${GITHUB_SHA}" evidence/metadata.txt
          grep -Fx "target=disposable-localhost" evidence/metadata.txt
          grep -Fx "cleanup_exit=0" evidence/metadata.txt
          grep -Fx "physical_windows_cursor_equivalence=UNKNOWN" evidence/metadata.txt
          grep -Fx "production_state=NOT APPLICABLE" evidence/metadata.txt
          (cd evidence && sha256sum -c sha256.txt)
          python3 - <<'PY'
          import json,pathlib
          data=json.loads(pathlib.Path('evidence/resilience-browser-evidence.json').read_text())
          assert data['classification']=='PASS', data.get('failures')
          assert data['product']['sha']=='81d3618ce7be28a6ce81363a8bda524cd18ece15'
          assert data['product']['tree']=='511c3501bd6a73f7556f636bc9e12ef30935d58d'
          required={
            'browser-reconnect-immediately-before-expiry',
            'browser-reconnect-immediately-after-expiry-fails-closed',
            'concurrent-browser-reconnect-versus-expiry-finalization',
            'duplicate-expiry-workers-converge',
            'buster-inactive-during-private-vip',
            'buster-activates-at-authoritative-safe-boundary',
          }
          names=[case.get('name') for case in data.get('cases', [])]
          assert len(data.get('cases', [])) == 6, f"expected 6 cases, got {len(data.get('cases', []))}"
          assert len(names) == len(set(names)), 'case names must be unique'
          assert set(names) == required, f"unexpected case names: {set(names)}"
          for case in data['cases']:
            assert case.get('classification') == 'PASS', case
            assert case.get('matchId'), case
            assert case.get('roomId'), case
            assert case.get('clockSource'), case
            assert isinstance(case.get('before'), dict), case
            assert isinstance(case.get('after'), dict), case
            assert case['before'].get('serverNow'), case
            assert case['before'].get('phase') is not None, case
            assert case['before'].get('phaseVersion') is not None, case
            assert case['before'].get('seat') is not None, case
            assert case['after'].get('serverNow'), case
            assert case['after'].get('phase') is not None, case
            assert case['after'].get('phaseVersion') is not None, case
            assert case['after'].get('seat') is not None, case
          race_case = next(case for case in data['cases'] if case['name'] == 'concurrent-browser-reconnect-versus-expiry-finalization')
          assert isinstance(race_case['operation'].get('outcomes'), list), race_case
          assert len(race_case['operation']['outcomes']) == 2, race_case
          duplicate_case = next(case for case in data['cases'] if case['name'] == 'duplicate-expiry-workers-converge')
          assert isinstance(duplicate_case['operation'].get('workerOutcomes'), list), duplicate_case
          assert len(duplicate_case['operation']['workerOutcomes']) == 3, duplicate_case
          assert duplicate_case['matchId'] != race_case['matchId'], 'duplicate-worker matchId must differ from reconnect-race matchId'
          assert duplicate_case['roomId'] != race_case['roomId'], 'duplicate-worker roomId must differ from reconnect-race roomId'
          vip_case = next(case for case in data['cases'] if case['name'] == 'buster-inactive-during-private-vip')
          assert vip_case['before']['seat']['controller_type'] == 'human', vip_case
          safe_case = next(case for case in data['cases'] if case['name'] == 'buster-activates-at-authoritative-safe-boundary')
          assert safe_case['after']['seat']['controller_type'] == 'buster', safe_case
          assert safe_case['after']['seat']['controller_player_id'] is None, safe_case
          assert data['browserProcessCount'] == 3
          assert data['browserContextCount'] == 3
          PY