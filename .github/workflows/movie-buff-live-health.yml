name: Movie Buff live health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the reviewed candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --ignore-scripts

      - name: Check Movie Buff live show
        run: node scripts/movie-buff-live-health-check.mjs
        env:
          MOVIE_BUFF_LIVE_HEALTH_ENABLED: "true"
          MOVIE_BUFF_LIVE_SHOW_KEY: main
          MOVIE_BUFF_LIVE_EXPECTED_SUPABASE_REF: yfatwreicmiocdxzyznd
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.MOVIE_BUFF_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.MOVIE_BUFF_SUPABASE_SECRET_KEY }}
          MOVIE_BUFF_LIVE_ALERT_WEBHOOK_URL: ${{ secrets.MOVIE_BUFF_LIVE_ALERT_WEBHOOK_URL }}
