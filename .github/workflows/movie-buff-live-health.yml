name: Movie Buff live health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      MOVIE_BUFF_LIVE_HEALTH_ENABLED: "true"

      MOVIE_BUFF_SUPABASE_URL: ${{ secrets.MOVIE_BUFF_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.MOVIE_BUFF_SUPABASE_URL }}

      MOVIE_BUFF_SUPABASE_SECRET_KEY: ${{ secrets.MOVIE_BUFF_SUPABASE_SECRET_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.MOVIE_BUFF_SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MOVIE_BUFF_SUPABASE_SECRET_KEY }}

      MOVIE_BUFF_LIVE_ALERT_WEBHOOK_URL: ${{ secrets.MOVIE_BUFF_LIVE_ALERT_WEBHOOK_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Movie Buff live show
        run: npm run movie-buff:live-health
