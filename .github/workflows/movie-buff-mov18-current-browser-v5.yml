name: Movie Buff MOV-18 current MOV-17 full three-client browser journey v7

on:
  push:
    branches: [validation/movie-buff-mov18-current-browser-v7]
    paths:
      - ".github/workflows/movie-buff-mov18-current-browser-v5.yml"
      - "scripts/movie-buff-three-client-full-journey-v3-runner.mjs"
      - "scripts/movie-buff-three-client-full-journey-v4-runner.mjs"
      - "src/components/movie-buff/visual/**"
      - "src/components/movie-buff/MovieBuffAuthoritativeResultsClient.tsx"
      - "src/lib/movie-buff/**"
      - "src/app/games/movie-buff/**"
      - "src/app/api/movie-buff/**"
      - "tests/movie-buff-visual-runtime.test.mjs"
      - "tests/movie-buff-round-media-route.test.mjs"
      - "tests/movie-buff-authoritative-phase-runtime.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: validation/movie-buff-mov18-current-browser-v7
  PARENT_SHA: ff9cb32dc6a80819599f61645e6d40068d7e51ed
  CURRENT_MOV17_SHA: f17234debfb8942e1998306a12dc33301c1c5440
  CURRENT_MOV18_SHA: ed9d4f08692c892258415d88d68f06b41a174b24
  V2_WORKFLOW_BLOB: d85c32f629de0dbacb9c6d0f00efef79c256867a
  MOVIE_BUFF_V2_HARNESS_BLOB: 3b08204937f26af9287f303906509dc057b399dc
  MOVIE_BUFF_WRAPPER_BLOB: 53e9ab8816bd25fae84505dbb9477dce2947608c
  MOVIE_BUFF_V3_RUNNER_BLOB: 53e9ab8816bd25fae84505dbb9477dce2947608c
  MOVIE_BUFF_V4_RUNNER_BLOB: ef2e99bcf61662c3776f6824f73f4c01d71929c8
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  exact-current-mov17-mov18-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Install deterministic media tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Extract exact reviewed laboratory blocks
        shell: bash
        run: |
          set -euo pipefail
          archived=".github/validation-archive/movie-buff-three-client-full-journey-v2.yml"
          test "$(git rev-parse HEAD:${archived})" = "${V2_WORKFLOW_BLOB}"
          test "$(git rev-parse HEAD:scripts/movie-buff-three-client-full-journey-v2.mjs)" = "${MOVIE_BUFF_V2_HARNESS_BLOB}"
          test "$(git rev-parse HEAD:scripts/movie-buff-three-client-full-journey-v3-runner.mjs)" = "${MOVIE_BUFF_WRAPPER_BLOB}"
          test "$(git rev-parse HEAD:scripts/movie-buff-three-client-full-journey-v4-runner.mjs)" = "${MOVIE_BUFF_V4_RUNNER_BLOB}"
          node --check scripts/movie-buff-three-client-full-journey-v3-runner.mjs
          node --check scripts/movie-buff-three-client-full-journey-v4-runner.mjs
          python3 - "${RUNNER_TEMP}" "${archived}" <<'PY'
          from pathlib import Path
          import sys

          output = Path(sys.argv[1])
          source = Path(sys.argv[2])
          lines = source.read_text(encoding='utf-8').splitlines()

          def extract(step_name: str) -> str:
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_line = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
              run_indent = len(lines[run_line]) - len(lines[run_line].lstrip())
              body = []
              for line in lines[run_line + 1:]:
                  if line.strip() and len(line) - len(line.lstrip()) <= run_indent:
                      break
                  body.append(line[run_indent + 2:] if line.strip() else '')
              if not body:
                  raise SystemExit(f'empty run block for {step_name}')
              return '\n'.join(body) + '\n'

          preflight = extract('Bind exact source and validate harness')
          execute = extract('Execute disposable exact-SHA browser journey v2')
          execute = execute.replace(
              'git status --porcelain >"${raw}/git-status-before-repair.txt"',
              'git status --porcelain --untracked-files=all >"${raw}/git-status-before-repair.txt"',
          )
          execute = execute.replace(
              'node scripts/movie-buff-three-client-full-journey-v2.mjs >"${raw}/three-client-browser-v2.log" 2>&1',
              'node scripts/movie-buff-three-client-full-journey-v4-runner.mjs >"${raw}/three-client-browser-v2.log" 2>&1',
          )
          chrome_install_anchor = 'npx playwright install --with-deps chromium'
          if execute.count(chrome_install_anchor) != 1:
              raise SystemExit('expected exactly one bundled Chromium install anchor')
          execute = execute.replace(chrome_install_anchor, 'npx playwright install --with-deps chrome')
          old_shape = '\n'.join([
              'allowed={"next-env.d.ts",fixture}',
              'unexpected=[]',
              'for line in status:',
              '    path=line[3:].strip()',
              '    if " -> " in path: path=path.split(" -> ",1)[1]',
              '    if path not in allowed: unexpected.append(line)',
              'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))',
          ])
          new_shape = '\n'.join([
              'allowed={"next-env.d.ts",fixture}',
              'allowed_prefixes=("public/media/movie-buff/runtime-generated/",)',
              'unexpected=[]',
              'for line in status:',
              '    path=line[3:].strip()',
              '    if " -> " in path: path=path.split(" -> ",1)[1]',
              '    if path not in allowed and not path.startswith(allowed_prefixes): unexpected.append(line)',
              'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))',
          ])
          if old_shape not in execute:
              raise SystemExit('postflight status-shape anchor was not found')
          execute = execute.replace(old_shape, new_shape)
          cleanup_anchor = '\n'.join([
              'rm -f "${fixture}"',
              'git checkout -- next-env.d.ts >/dev/null 2>&1 || true',
              'rmdir public/media/movie-buff public/media 2>/dev/null || true',
          ])
          cleanup_replacement = '\n'.join([
              'rm -f "${fixture}"',
              'rm -rf public/media/movie-buff/runtime-generated',
              'git checkout -- next-env.d.ts >/dev/null 2>&1 || true',
              'rmdir public/media/movie-buff public/media 2>/dev/null || true',
          ])
          if cleanup_anchor not in execute:
              raise SystemExit('runtime-generated cleanup anchor was not found')
          execute = execute.replace(cleanup_anchor, cleanup_replacement)
          required = [
              '--untracked-files=all',
              'movie-buff-three-client-full-journey-v4-runner.mjs',
              'npx playwright install --with-deps chrome',
              'allowed_prefixes=("public/media/movie-buff/runtime-generated/",)',
              'rm -rf public/media/movie-buff/runtime-generated',
          ]
          for marker in required:
              if marker not in execute:
                  raise SystemExit(f'missing transformed laboratory marker: {marker}')
          (output / 'movie-buff-mov18-current-preflight.sh').write_text(preflight, encoding='utf-8')
          (output / 'movie-buff-mov18-current-execute.sh').write_text(execute, encoding='utf-8')
          PY
          bash -n "${RUNNER_TEMP}/movie-buff-mov18-current-preflight.sh"
          bash -n "${RUNNER_TEMP}/movie-buff-mov18-current-execute.sh"

      - name: Bind exact source and validate current contracts
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          git merge-base --is-ancestor "${PARENT_SHA}" HEAD
          git merge-base --is-ancestor "${CURRENT_MOV17_SHA}" HEAD
          git merge-base --is-ancestor "${CURRENT_MOV18_SHA}" HEAD
          test -z "$(git status --porcelain)"
          bash "${RUNNER_TEMP}/movie-buff-mov18-current-preflight.sh"
          node --test \
            tests/movie-buff-round-media-route.test.mjs \
            tests/movie-buff-visual-runtime.test.mjs \
            tests/movie-buff-authoritative-phase-runtime.test.mjs

      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Execute disposable exact-SHA current browser journey
        shell: bash
        run: |
          set +e
          bash "${RUNNER_TEMP}/movie-buff-mov18-current-execute.sh"
          code=$?
          root="${RUNNER_TEMP}/movie-buff-three-client-full-v2"
          echo "--- journey metadata ---"
          cat "$root/metadata.txt" 2>/dev/null || true
          echo "--- journey JSON ---"
          cat "$root/three-client-full-journey-v2.json" 2>/dev/null || true
          echo "--- browser log tail ---"
          tail -300 "$root/three-client-browser-v2.log" 2>/dev/null || true
          exit "$code"

      - name: Upload exact current browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-mov18-current-browser-${{ github.sha }}
          path: ${{ runner.temp }}/movie-buff-three-client-full-v2
          if-no-files-found: error
          retention-days: 7

      - name: Verify clean postflight
        if: always()
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
