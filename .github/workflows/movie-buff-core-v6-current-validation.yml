name: Movie Buff core v6 current exact validation laboratories

on:
  push:
    branches:
      - validation/movie-buff-core-v6
    paths:
      - ".github/workflows/movie-buff-core-v6-current-validation.yml"
      - "scripts/movie-buff-core-v6-windows-v2.ps1"
      - "scripts/movie-buff-core-v6-db-v2.sh"
      - "supabase/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: validation/movie-buff-core-v6
  EXPECTED_REPOSITORY: BuffGamesStudio/buff-platform
  EXPECTED_REMOTE: https://github.com/BuffGamesStudio/buff-platform
  RAW_COMPOSITION_SHA: f03a4d74434551e1bcafb067478d4eab6b7993a5
  RAW_COMPOSITION_TREE: 02a579e275d4efeaa7bf0f077cab2e686cc5e448
  MOV15_SHA: 4906147038a5a2deda5c13fdafc6f07b66ae100b
  MOV15_TREE: aab4b0256683ec77a4d9e3373fd84f60ba682e88
  MOV16_SHA: 8eab77a63042911417d6ef16d52ab9b308fc8f0d
  MOV16_TREE: a4aa7c9962389b9894c8a90afe69fdb276313953
  MOV17_SHA: 6d7e9aabe5b07796a3a17fdf6c11df091dd1f978
  MOV17_TREE: 8264d2e30b0c75a8bebaa1ad938df6a635f7d991
  ENCODING_SHA: bf5e6d6f251f6840d17eed2fc68e0d580295437f
  ENCODING_TREE: d97528616454b9e93c6be9a44705d008a901ac66
  INTEGRATION_SHA: bf316a15a2120e32d8a32e479df2ae439081f9a1
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  source-build:
    name: Linux source contracts build and negative paths current
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SHA: ${{ github.sha }}
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-placeholder
      SUPABASE_SERVICE_ROLE_KEY: local-placeholder
      MOVIE_BUFF_APP_URL: http://127.0.0.1:3000

    steps:
      - name: Check out exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bind exact identity and validation ownership
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/movie-buff-core-v6-current-source"
          mkdir -p "${evidence}"
          echo "EVIDENCE_ROOT=${evidence}" >> "${GITHUB_ENV}"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git remote get-url origin)" = "${EXPECTED_REMOTE}"
          git merge-base --is-ancestor "${RAW_COMPOSITION_SHA}" HEAD
          test "$(git rev-parse "${RAW_COMPOSITION_SHA}^{tree}")" = "${RAW_COMPOSITION_TREE}"
          test -z "$(git status --porcelain)"
          git diff --name-only "${RAW_COMPOSITION_SHA}"..HEAD > "${evidence}/validation-owned-paths.txt"
          while IFS= read -r file; do
            case "${file}" in
              .github/workflows/movie-buff-core-v6-validation.yml|.github/workflows/movie-buff-core-v6-current-validation.yml|scripts/movie-buff-core-v6-guard.mjs|scripts/movie-buff-core-v6-windows.ps1|scripts/movie-buff-core-v6-db.sh|scripts/movie-buff-core-v6-windows-v2.ps1|scripts/movie-buff-core-v6-db-v2.sh) ;;
              *) echo "Unexpected validation-owned change: ${file}"; exit 1 ;;
            esac
          done < "${evidence}/validation-owned-paths.txt"
          echo "MOVIE_BUFF_EXPECTED_REPOSITORY=${EXPECTED_REPOSITORY}" >> "${GITHUB_ENV}"
          echo "MOVIE_BUFF_EXPECTED_SHA=${EXPECTED_SHA}" >> "${GITHUB_ENV}"
          echo "MOVIE_BUFF_EXPECTED_TREE=$(git rev-parse HEAD^{tree})" >> "${GITHUB_ENV}"
          echo "MOVIE_BUFF_RAW_COMPOSITION_SHA=${RAW_COMPOSITION_SHA}" >> "${GITHUB_ENV}"
          echo "MOVIE_BUFF_EVIDENCE_ROOT=${evidence}" >> "${GITHUB_ENV}"

      - name: Guard actual and deliberate negative paths
        shell: bash
        run: |
          set -o pipefail
          node scripts/movie-buff-core-v6-guard.mjs 2>&1 | tee "${EVIDENCE_ROOT}/guard-actual.json"
          node scripts/movie-buff-core-v6-guard.mjs --self-test 2>&1 | tee "${EVIDENCE_ROOT}/guard-negative-paths.json"

      - name: Install committed lock
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee "${EVIDENCE_ROOT}/npm-ci.txt"

      - name: Run combined contracts
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/movie-buff-public-matchmaking-contract.test.mjs \
            tests/movie-buff-public-matchmaking-handoff.test.mjs \
            tests/movie-buff-vip-authority.test.mjs \
            tests/movie-buff-vip-finalize-contract.test.mjs \
            tests/movie-buff-vip-phase-policy.test.mjs \
            tests/movie-buff-server-phase-machine.test.mjs \
            tests/movie-buff-authoritative-phase-runtime.test.mjs \
            tests/movie-buff-buster-safe-boundary.test.mjs \
            tests/movie-buff-phase-tile-mutation-guard.test.mjs \
            tests/movie-buff-match-start-handoff.test.mjs \
            tests/movie-buff-migration-encoding.test.mjs \
            2>&1 | tee "${EVIDENCE_ROOT}/combined-contracts.tap"

      - name: Validate migration encoding and exact BOM-only repair
        shell: bash
        env:
          MOVIE_BUFF_MIGRATION_ENCODING_OUTPUT: ${{ runner.temp }}/movie-buff-core-v6-current-source/encoding-report.json
          MOVIE_BUFF_BOM_ONLY_OUTPUT: ${{ runner.temp }}/movie-buff-core-v6-current-source/bom-only-report.json
        run: |
          set -euo pipefail
          node scripts/movie-buff-migration-encoding-check.mjs \
            supabase/migrations supabase/rollbacks supabase/tests \
            > "${EVIDENCE_ROOT}/encoding.stdout.txt"
          node scripts/movie-buff-migration-bom-only-check.mjs "${INTEGRATION_SHA}" \
            > "${EVIDENCE_ROOT}/bom-only.stdout.txt"

      - name: TypeScript and localhost production build
        shell: bash
        run: |
          set -o pipefail
          npx --no-install tsc --noEmit 2>&1 | tee "${EVIDENCE_ROOT}/typescript.txt"
          npm run build 2>&1 | tee "${EVIDENCE_ROOT}/build.txt"

      - name: Finalize source evidence
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          evidence="${EVIDENCE_ROOT:-${RUNNER_TEMP}/movie-buff-core-v6-current-source}"
          mkdir -p "${evidence}"
          classification=FAIL
          if [ "${JOB_STATUS}" = "success" ]; then classification=PASS; fi
          git diff --check > "${evidence}/git-diff-check.txt" 2>&1 || classification=FAIL
          if [ -n "$(git status --porcelain)" ]; then classification=FAIL; fi
          {
            echo "lane=movie-buff-core-v6-current-source"
            echo "classification=${classification}"
            echo "repository=${EXPECTED_REPOSITORY}"
            echo "remote=$(git remote get-url origin)"
            echo "source_branch=${GITHUB_REF_NAME}"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "raw_composition_sha=${RAW_COMPOSITION_SHA}"
            echo "raw_composition_tree=${RAW_COMPOSITION_TREE}"
            echo "mov15_sha=${MOV15_SHA}"
            echo "mov15_tree=${MOV15_TREE}"
            echo "mov16_sha=${MOV16_SHA}"
            echo "mov16_tree=${MOV16_TREE}"
            echo "mov17_sha=${MOV17_SHA}"
            echo "mov17_tree=${MOV17_TREE}"
            echo "encoding_sha=${ENCODING_SHA}"
            echo "encoding_tree=${ENCODING_TREE}"
            echo "integration_sha=${INTEGRATION_SHA}"
            echo "node=$(node --version 2>/dev/null || echo UNKNOWN)"
            echo "npm=$(npm --version 2>/dev/null || echo UNKNOWN)"
            echo "database_behavior=UNKNOWN"
            echo "race_behavior=UNKNOWN"
            echo "browser_behavior=UNKNOWN"
            echo "hosted_state=UNKNOWN"
            echo "physical_windows_cursor_equivalence=UNKNOWN"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${evidence}/metadata.txt"
          python3 - "${evidence}" <<'PY'
          import pathlib,re,sys
          root=pathlib.Path(sys.argv[1])
          patterns=[
            (r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+','[REDACTED_JWT]'),
            (r'postgres(?:ql)?://[^\s]+','postgresql://[REDACTED_LOCAL_DB_URL]'),
            (r'sb_(?:secret|publishable)_[A-Za-z0-9_-]+','[REDACTED_SUPABASE_KEY]'),
            (r'(?i)(authorization:\s*bearer\s+)[A-Za-z0-9._-]+',r'\1[REDACTED]'),
          ]
          for p in root.iterdir():
            if not p.is_file() or p.name=='sha256.txt': continue
            text=p.read_text(encoding='utf-8',errors='replace')
            for pattern,replacement in patterns: text=re.sub(pattern,replacement,text)
            p.write_text(text,encoding='utf-8')
          PY
          (cd "${evidence}" && find . -maxdepth 1 -type f ! -name sha256.txt -print0 | sort -z | xargs -0 sha256sum > sha256.txt && sha256sum -c sha256.txt)
          test "${classification}" = PASS

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-core-v6-current-source-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/movie-buff-core-v6-current-source
          if-no-files-found: error
          retention-days: 7

  windows-command-shell:
    name: Windows PowerShell command-shell digital twin current
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ github.sha }}
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-placeholder
      SUPABASE_SERVICE_ROLE_KEY: local-placeholder
      MOVIE_BUFF_APP_URL: http://127.0.0.1:3000

    steps:
      - name: Check out exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Parse checked-in wrapper
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./scripts/movie-buff-core-v6-windows-v2.ps1),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error }

      - name: Execute checked-in wrapper from repository root
        shell: pwsh
        run: |
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          ./scripts/movie-buff-core-v6-windows-v2.ps1 `
            -ExpectedSha $env:EXPECTED_SHA `
            -ExpectedTree $tree `
            -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'movie-buff-core-v6-current-windows')

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-core-v6-current-windows-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}\movie-buff-core-v6-current-windows
          if-no-files-found: error
          retention-days: 7

  disposable-database:
    name: Disposable local Supabase migrations pgTAP and rollback current
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: Check out exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Verify tools and parse wrapper
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git remote get-url origin)" = "${EXPECTED_REMOTE}"
          git merge-base --is-ancestor "${RAW_COMPOSITION_SHA}" HEAD
          test "$(git rev-parse "${RAW_COMPOSITION_SHA}^{tree}")" = "${RAW_COMPOSITION_TREE}"
          test -z "$(git status --porcelain)"
          test ! -f supabase/.temp/project-ref
          test "$(supabase --version)" = "2.111.0"
          bash -n scripts/movie-buff-core-v6-db-v2.sh
          bash -n scripts/movie-buff-core-v6-db.sh
          docker --version
          psql --version
          python3 --version

      - name: Execute checked-in database wrapper
        shell: bash
        run: |
          bash scripts/movie-buff-core-v6-db-v2.sh \
            "${EXPECTED_SHA}" \
            "$(git rev-parse HEAD^{tree})" \
            "${RUNNER_TEMP}/movie-buff-core-v6-current-db"

      - name: Verify source remained clean
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Upload database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-core-v6-current-database-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/movie-buff-core-v6-current-db
          if-no-files-found: error
          retention-days: 7
