name: Movie Buff RC 2026-08-06-01 exact product hash audit

on:
  push:
    branches:
      - release/movie-buff-rc-2026-08-06-01
    paths:
      - ".github/workflows/movie-buff-rc-2026-08-06-01-hash-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Verify six-path successor delta and hashes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OLD_PRODUCT_SHA: c3a6aff9138f6e12b50e54f5b3c0f4bddcc101f6
      OLD_PRODUCT_TREE: a995a9aeb2fca76d2c1b216ece3a2645c2393c71
      NEW_PRODUCT_SHA: 78c35aa15ec7f1bb3cb3de316f260fec438f00dc
      NEW_PRODUCT_TREE: f8d3b3901ad0c0b1db1cfa4a6374f2a979dd5613
      EVIDENCE_DIR: ${{ runner.temp }}/movie-buff-rc-hash-audit

    steps:
      - name: Check out old product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OLD_PRODUCT_SHA }}
          path: old
          fetch-depth: 1
          persist-credentials: false

      - name: Check out successor product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NEW_PRODUCT_SHA }}
          path: new
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable identities and exact delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C old rev-parse HEAD)" = "${OLD_PRODUCT_SHA}"
          test "$(git -C old rev-parse HEAD^{tree})" = "${OLD_PRODUCT_TREE}"
          test "$(git -C new rev-parse HEAD)" = "${NEW_PRODUCT_SHA}"
          test "$(git -C new rev-parse HEAD^{tree})" = "${NEW_PRODUCT_TREE}"
          test -z "$(git -C old status --porcelain)"
          test -z "$(git -C new status --porcelain)"

          git -C new fetch --no-tags --depth=1 origin "${OLD_PRODUCT_SHA}"
          git -C new diff --name-only "${OLD_PRODUCT_SHA}" "${NEW_PRODUCT_SHA}" | sort > actual-paths.txt
          cat > expected-paths.txt <<'EOF'
          .github/workflows/movie-buff-agent6-security-package.yml
          .github/workflows/movie-buff-mov19-validation.yml
          docs/security/movie-buff-agent6-expected-state.json
          src/app/games/movie-buff/lobby/LobbyAuthBootstrap.tsx
          tests/movie-buff-independent-security-validation.test.mjs
          tests/movie-buff-lobby-auth-bootstrap.test.mjs
          EOF
          sort -o expected-paths.txt expected-paths.txt
          diff -u expected-paths.txt actual-paths.txt

      - name: Generate blob and SHA-256 audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          from datetime import datetime, timezone

          paths = [
              ".github/workflows/movie-buff-agent6-security-package.yml",
              ".github/workflows/movie-buff-mov19-validation.yml",
              "docs/security/movie-buff-agent6-expected-state.json",
              "src/app/games/movie-buff/lobby/LobbyAuthBootstrap.tsx",
              "tests/movie-buff-independent-security-validation.test.mjs",
              "tests/movie-buff-lobby-auth-bootstrap.test.mjs",
          ]

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          records = []
          for path in paths:
              old_bytes = pathlib.Path("old", path).read_bytes()
              new_bytes = pathlib.Path("new", path).read_bytes()
              old_blob = git("-C", "old", "hash-object", path)
              new_blob = git("-C", "new", "hash-object", path)
              records.append({
                  "path": path,
                  "old": {
                      "gitBlob": old_blob,
                      "sha256": hashlib.sha256(old_bytes).hexdigest(),
                      "bytes": len(old_bytes),
                  },
                  "new": {
                      "gitBlob": new_blob,
                      "sha256": hashlib.sha256(new_bytes).hexdigest(),
                      "bytes": len(new_bytes),
                  },
                  "classification": "IDENTICAL" if old_bytes == new_bytes else "CHANGED",
              })

          output = {
              "schemaVersion": 1,
              "generatedAtUtc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "repository": "BuffGamesStudio/buff-platform",
              "oldProduct": {
                  "sha": os.environ["OLD_PRODUCT_SHA"],
                  "tree": os.environ["OLD_PRODUCT_TREE"],
              },
              "newProduct": {
                  "sha": os.environ["NEW_PRODUCT_SHA"],
                  "tree": os.environ["NEW_PRODUCT_TREE"],
              },
              "changedPathCount": len(records),
              "files": records,
              "allOtherTrackedPaths": "BYTE_IDENTICAL_BY_GIT_TREE_DIFF",
          }
          target = pathlib.Path(os.environ["EVIDENCE_DIR"], "manifest-audit.json")
          target.write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
          PY
          sha256sum "${EVIDENCE_DIR}/manifest-audit.json" > "${EVIDENCE_DIR}/sha256.txt"
          cat "${EVIDENCE_DIR}/manifest-audit.json"
          cat "${EVIDENCE_DIR}/sha256.txt"

      - name: Verify clean postflight
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C old status --porcelain)"
          test -z "$(git -C new status --porcelain)"

      - name: Upload exact hash audit
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-rc-2026-08-06-01-hash-audit
          path: ${{ runner.temp }}/movie-buff-rc-hash-audit
          if-no-files-found: error
          retention-days: 30
