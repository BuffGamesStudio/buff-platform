name: Movie Buff successor v7 exact three-client browser validation

on:
  pull_request:
    branches:
      - validation/movie-buff-v7-runner-base
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  PRODUCT_SHA: 886b914ef83398b6384ce49e18955e026103a27c
  PRODUCT_TREE: 7e1fe5b4cdc4787976b8929664e966b2aa09d83d
  EXPECTED_PRODUCT_BRANCH: release-candidate/movie-buff-2026-08-06-01-v7
  PARENT_SHA: c3a6aff9138f6e12b50e54f5b3c0f4bddcc101f6
  ARCHIVE_SOURCE_SHA: d90a7eb73ef724b4ef5205343e655c7597dcf978
  ARCHIVE_WORKFLOW_BLOB: d85c32f629de0dbacb9c6d0f00efef79c256867a
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  exact-three-client-browser:
    name: Exact successor v7 three-client journey
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out immutable product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Bind product and materialize reviewed laboratory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${PRODUCT_TREE}"
          test "$(git rev-parse HEAD^)" = "${PARENT_SHA}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags --depth=1 origin "${ARCHIVE_SOURCE_SHA}"
          test "$(git rev-parse "${ARCHIVE_SOURCE_SHA}:.github/validation-archive/movie-buff-three-client-full-journey-v2.yml")" = "${ARCHIVE_WORKFLOW_BLOB}"
          git show "${ARCHIVE_SOURCE_SHA}:.github/validation-archive/movie-buff-three-client-full-journey-v2.yml" >"${RUNNER_TEMP}/movie-buff-v7-reviewed-browser.yml"
          python3 - "${RUNNER_TEMP}" "${RUNNER_TEMP}/movie-buff-v7-reviewed-browser.yml" <<'PY'
          from pathlib import Path
          import sys

          output = Path(sys.argv[1])
          lines = Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()

          def extract(step_name: str) -> str:
              marker = f"- name: {step_name}"
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_line = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == "run: |")
              run_indent = len(lines[run_line]) - len(lines[run_line].lstrip())
              body = []
              for line in lines[run_line + 1:]:
                  if line.strip() and len(line) - len(line.lstrip()) <= run_indent:
                      break
                  body.append(line[run_indent + 2:] if line.strip() else "")
              if not body:
                  raise SystemExit(f"empty run block for {step_name}")
              return "\n".join(body) + "\n"

          preflight = extract("Bind exact source and validate harness")
          execute = extract("Execute disposable exact-SHA browser journey v2")
          for old, new in [
              ("${GITHUB_SHA}", "${PRODUCT_SHA}"),
              ("${GITHUB_REF_NAME}", "${EXPECTED_PRODUCT_BRANCH}"),
          ]:
              preflight = preflight.replace(old, new)
              execute = execute.replace(old, new)

          execute = execute.replace(
              'git status --porcelain >"${raw}/git-status-before-repair.txt"',
              'git status --porcelain --untracked-files=all >"${raw}/git-status-before-repair.txt"',
          )
          old_shape = "\n".join([
              'allowed={"next-env.d.ts",fixture}',
              "unexpected=[]",
              "for line in status:",
              "    path=line[3:].strip()",
              '    if " -> " in path: path=path.split(" -> ",1)[1]',
              "    if path not in allowed: unexpected.append(line)",
              'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))',
          ])
          new_shape = "\n".join([
              'allowed={"next-env.d.ts",fixture}',
              'allowed_prefixes=("public/media/movie-buff/runtime-generated/",)',
              "unexpected=[]",
              "for line in status:",
              "    path=line[3:].strip()",
              '    if " -> " in path: path=path.split(" -> ",1)[1]',
              "    if path not in allowed and not path.startswith(allowed_prefixes): unexpected.append(line)",
              'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))',
          ])
          if old_shape not in execute:
              raise SystemExit("postflight status-shape anchor missing")
          execute = execute.replace(old_shape, new_shape)
          cleanup_anchor = "\n".join([
              'rm -f "${fixture}"',
              "git checkout -- next-env.d.ts >/dev/null 2>&1 || true",
              "rmdir public/media/movie-buff public/media 2>/dev/null || true",
          ])
          cleanup_replacement = "\n".join([
              'rm -f "${fixture}"',
              "rm -rf public/media/movie-buff/runtime-generated",
              "git checkout -- next-env.d.ts >/dev/null 2>&1 || true",
              "rmdir public/media/movie-buff public/media 2>/dev/null || true",
          ])
          if cleanup_anchor not in execute:
              raise SystemExit("runtime-generated cleanup anchor missing")
          execute = execute.replace(cleanup_anchor, cleanup_replacement)
          (output / "movie-buff-v7-browser-preflight.sh").write_text(preflight, encoding="utf-8")
          (output / "movie-buff-v7-browser-execute.sh").write_text(execute, encoding="utf-8")
          PY
          bash -n "${RUNNER_TEMP}/movie-buff-v7-browser-preflight.sh"
          bash -n "${RUNNER_TEMP}/movie-buff-v7-browser-execute.sh"
          node --check scripts/movie-buff-three-client-full-journey-v2.mjs
          node --check scripts/movie-buff-core-v11-local-users.mjs
      - name: Execute reviewed preflight
        shell: bash
        env:
          EXPECTED_BRANCH: ${{ env.EXPECTED_PRODUCT_BRANCH }}
        run: bash "${RUNNER_TEMP}/movie-buff-v7-browser-preflight.sh"
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute disposable full browser journey
        shell: bash
        env:
          EXPECTED_BRANCH: ${{ env.EXPECTED_PRODUCT_BRANCH }}
        run: bash "${RUNNER_TEMP}/movie-buff-v7-browser-execute.sh"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-v7-three-client-${{ env.PRODUCT_SHA }}
          path: ${{ runner.temp }}/movie-buff-three-client-full-v2
          if-no-files-found: error
          retention-days: 14
      - name: Verify clean product postflight
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
