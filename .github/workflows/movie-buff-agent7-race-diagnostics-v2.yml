name: Movie Buff Agent 7 race diagnostics v2

on:
  push:
    branches:
      - validation/MOV-17-encoding-twin-v2
    paths:
      - .github/workflows/movie-buff-agent7-race-diagnostics-v2.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  mov16-diagnostic-v2:
    name: MOV-16 adversarial diagnostic v2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Execute isolated MOV-16 diagnostic
        shell: bash
        run: |
          bash scripts/movie-buff-agent7-race-diagnostics.sh \
            mov16-diagnostic \
            "$GITHUB_SHA" \
            "$(git rev-parse HEAD^{tree})" \
            "$RUNNER_TEMP/movie-buff-agent7-mov16-diagnostic-v2"
      - name: Upload MOV-16 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent7-mov16-diagnostic-v2-${{ github.sha }}
          path: ${{ runner.temp }}/movie-buff-agent7-mov16-diagnostic-v2
          if-no-files-found: error
          retention-days: 14

  remaining-races-v2:
    name: VIP finalizer, phase, reconnect races v2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Execute remaining independent race suites
        shell: bash
        run: |
          bash scripts/movie-buff-agent7-race-diagnostics.sh \
            remaining-races \
            "$GITHUB_SHA" \
            "$(git rev-parse HEAD^{tree})" \
            "$RUNNER_TEMP/movie-buff-agent7-remaining-races-v2"
      - name: Upload remaining-race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent7-remaining-races-v2-${{ github.sha }}
          path: ${{ runner.temp }}/movie-buff-agent7-remaining-races-v2
          if-no-files-found: error
          retention-days: 14
