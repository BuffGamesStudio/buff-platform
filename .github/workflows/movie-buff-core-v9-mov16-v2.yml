name: Movie Buff core v9 MOV-16 structured authority diagnostic v2

on:
  push:
    branches:
      - validation/movie-buff-core-v9
    paths:
      - ".github/workflows/movie-buff-core-v9-mov16-v2.yml"
      - "scripts/movie-buff-core-v9-mov16-v2.sh"
      - "scripts/movie-buff-vip-authority-adversarial.mjs"
      - "scripts/movie-buff-core-v6-local-users.mjs"
      - "src/app/api/movie-buff/vip/**"
      - "src/lib/game/movieBuffVipService.ts"
      - "src/lib/server/movieBuffVipRoute*.ts"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: validation/movie-buff-core-v9
  RAW_COMPOSITION_SHA: 7582d07b0d8d80c8e5ecea4fedb079667a488d76
  RAW_COMPOSITION_TREE: 44f331ac926172d9d824c9ea40e2f83301e7a0bf
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  mov16-authority-diagnostic:
    name: Exact local structured VIP authority diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Bind exact identity and parse checked-in wrapper
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          git merge-base --is-ancestor "${RAW_COMPOSITION_SHA}" HEAD
          test "$(git rev-parse "${RAW_COMPOSITION_SHA}^{tree}")" = "${RAW_COMPOSITION_TREE}"
          test -z "$(git status --porcelain)"
          test ! -f supabase/.temp/project-ref
          test "$(supabase --version)" = "2.111.0"
          bash -n scripts/movie-buff-core-v9-mov16-v2.sh
          node --check scripts/movie-buff-vip-authority-adversarial.mjs
          node --check scripts/movie-buff-core-v6-local-users.mjs
          docker --version
          psql --version
          python3 --version

      - name: Execute checked-in exact local wrapper
        shell: bash
        run: |
          bash scripts/movie-buff-core-v9-mov16-v2.sh \
            "${GITHUB_SHA}" \
            "$(git rev-parse HEAD^{tree})" \
            "${RUNNER_TEMP}/movie-buff-core-v9-mov16-v2-evidence"

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-core-v9-mov16-v2-${{ github.sha }}
          path: ${{ runner.temp }}/movie-buff-core-v9-mov16-v2-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Verify clean postflight
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
