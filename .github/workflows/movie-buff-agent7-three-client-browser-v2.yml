name: Movie Buff Agent 7 exact three-client browser journey v2

on:
  push:
    branches:
      - validation/movie-buff-three-client-browser
    paths:
      - .github/workflows/movie-buff-agent7-three-client-browser-v2.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: validation/movie-buff-three-client-browser
  CANDIDATE_SHA: 4c27ae357e16a48ccc5d8885d11cc5411643b218
  VALIDATOR_SOURCE_SHA: d90a7eb73ef724b4ef5205343e655c7597dcf978
  V2_WORKFLOW_BLOB: d85c32f629de0dbacb9c6d0f00efef79c256867a
  MOVIE_BUFF_V2_HARNESS_BLOB: 3b08204937f26af9287f303906509dc057b399dc
  MOVIE_BUFF_WRAPPER_BLOB: 53e9ab8816bd25fae84505dbb9477dce2947608c
  MOVIE_BUFF_LOCAL_USERS_BLOB: 15c4741814ff0b7df9f4a21a771d3040cfdfbeff
  PARENT_SHA: 4c27ae357e16a48ccc5d8885d11cc5411643b218
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  exact-three-client-browser:
    name: Exact three-client browser journey v2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Bind candidate and import immutable browser laboratory
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${CANDIDATE_SHA}" HEAD
          test "$(git remote get-url origin)" = "https://github.com/BuffGamesStudio/buff-platform"
          test -z "$(git status --porcelain --untracked-files=all)"

          python3 - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/movie-buff-agent7-three-client-browser.yml",
              ".github/workflows/movie-buff-agent7-three-client-browser-v2.yml",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only", "4c27ae357e16a48ccc5d8885d11cc5411643b218..HEAD"],
              text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected candidate delta: {sorted(actual)}")
          PY

          git fetch --no-tags --depth=1 origin "${VALIDATOR_SOURCE_SHA}"
          test "$(git rev-parse "${VALIDATOR_SOURCE_SHA}:.github/validation-archive/movie-buff-three-client-full-journey-v2.yml")" = "${V2_WORKFLOW_BLOB}"
          test "$(git rev-parse "${VALIDATOR_SOURCE_SHA}:scripts/movie-buff-three-client-full-journey-v2.mjs")" = "${MOVIE_BUFF_V2_HARNESS_BLOB}"
          test "$(git rev-parse "${VALIDATOR_SOURCE_SHA}:scripts/movie-buff-three-client-full-journey-v3-runner.mjs")" = "${MOVIE_BUFF_WRAPPER_BLOB}"
          test "$(git rev-parse "${VALIDATOR_SOURCE_SHA}:scripts/movie-buff-core-v11-local-users.mjs")" = "${MOVIE_BUFF_LOCAL_USERS_BLOB}"

          git show "${VALIDATOR_SOURCE_SHA}:.github/validation-archive/movie-buff-three-client-full-journey-v2.yml" > "${RUNNER_TEMP}/agent7-reviewed-browser-lab.yml"
          git show "${VALIDATOR_SOURCE_SHA}:scripts/movie-buff-three-client-full-journey-v2.mjs" > scripts/movie-buff-three-client-full-journey-v2.mjs
          git show "${VALIDATOR_SOURCE_SHA}:scripts/movie-buff-three-client-full-journey-v3-runner.mjs" > scripts/movie-buff-three-client-full-journey-v3-runner.mjs
          git show "${VALIDATOR_SOURCE_SHA}:scripts/movie-buff-core-v11-local-users.mjs" > scripts/movie-buff-core-v11-local-users.mjs

          python3 - <<'PY'
          from pathlib import Path
          wrapper = Path("scripts/movie-buff-three-client-full-journey-v3-runner.mjs")
          text = wrapper.read_text(encoding="utf-8")
          old = '["rev-parse", `HEAD:${sourcePath}`]'
          new = '["rev-parse", `${process.env.VALIDATOR_SOURCE_SHA}:${sourcePath}`]'
          if text.count(old) != 1:
              raise SystemExit("immutable wrapper source anchor missing or duplicated")
          text = text.replace(old, new)
          if text.count(new) != 1 or old in text:
              raise SystemExit("immutable wrapper source patch failed")
          wrapper.write_text(text, encoding="utf-8")
          PY

          node --check scripts/movie-buff-three-client-full-journey-v2.mjs
          node --check scripts/movie-buff-three-client-full-journey-v3-runner.mjs
          node --check scripts/movie-buff-core-v11-local-users.mjs

          python3 - "${RUNNER_TEMP}" "${RUNNER_TEMP}/agent7-reviewed-browser-lab.yml" <<'PY'
          from pathlib import Path
          import sys

          output = Path(sys.argv[1])
          source = Path(sys.argv[2])
          lines = source.read_text(encoding="utf-8").splitlines()

          def extract(step_name: str) -> str:
              marker = f"- name: {step_name}"
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_line = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == "run: |")
              run_indent = len(lines[run_line]) - len(lines[run_line].lstrip())
              body = []
              for line in lines[run_line + 1:]:
                  if line.strip() and len(line) - len(line.lstrip()) <= run_indent:
                      break
                  body.append(line[run_indent + 2:] if line.strip() else "")
              if not body:
                  raise SystemExit(f"empty run block for {step_name}")
              return "\n".join(body) + "\n"

          preflight = extract("Bind exact source and validate harness")
          execute = extract("Execute disposable exact-SHA browser journey v2")

          preflight_status_anchor = 'test -z "$(git status --porcelain)"'
          preflight_status_replacement = "\n".join([
              "expected_temp_status=$'?? scripts/movie-buff-core-v11-local-users.mjs\\n?? scripts/movie-buff-three-client-full-journey-v2.mjs\\n?? scripts/movie-buff-three-client-full-journey-v3-runner.mjs'",
              'actual_temp_status="$(git status --porcelain --untracked-files=all | sort)"',
              'test "${actual_temp_status}" = "${expected_temp_status}"',
          ])
          if preflight.count(preflight_status_anchor) != 1:
              raise SystemExit("expected one inherited preflight status anchor")
          preflight = preflight.replace(preflight_status_anchor, preflight_status_replacement)

          execute = execute.replace(
              'git status --porcelain >"${raw}/git-status-before-repair.txt"',
              'git status --porcelain --untracked-files=all >"${raw}/git-status-before-repair.txt"',
          )
          execute = execute.replace(
              'node scripts/movie-buff-three-client-full-journey-v2.mjs >"${raw}/three-client-browser-v2.log" 2>&1',
              'node scripts/movie-buff-three-client-full-journey-v3-runner.mjs >"${raw}/three-client-browser-v2.log" 2>&1',
          )

          chrome_install_anchor = "npx playwright install --with-deps chromium"
          if execute.count(chrome_install_anchor) != 1:
              raise SystemExit("expected exactly one Chromium install anchor")
          execute = execute.replace(chrome_install_anchor, "npx playwright install --with-deps chrome")

          cleanup_temp_anchor = 'rm -rf "${work}" "${users}" "${playwright_root}"'
          cleanup_temp_replacement = "\n".join([
              cleanup_temp_anchor,
              "rm -f scripts/movie-buff-three-client-full-journey-v2.mjs",
              "rm -f scripts/movie-buff-three-client-full-journey-v3-runner.mjs",
              "rm -f scripts/movie-buff-core-v11-local-users.mjs",
          ])
          if cleanup_temp_anchor not in execute:
              raise SystemExit("temporary-validator cleanup anchor missing")
          execute = execute.replace(cleanup_temp_anchor, cleanup_temp_replacement, 1)

          old_shape = "\n".join([
              'allowed={"next-env.d.ts",fixture}',
              "unexpected=[]",
              "for line in status:",
              "    path=line[3:].strip()",
              '    if " -> " in path: path=path.split(" -> ",1)[1]',
              "    if path not in allowed: unexpected.append(line)",
              'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))',
          ])
          new_shape = "\n".join([
              'allowed={"next-env.d.ts",fixture}',
              'allowed_prefixes=("public/media/movie-buff/runtime-generated/",)',
              "unexpected=[]",
              "for line in status:",
              "    path=line[3:].strip()",
              '    if " -> " in path: path=path.split(" -> ",1)[1]',
              "    if path not in allowed and not path.startswith(allowed_prefixes): unexpected.append(line)",
              'if unexpected: raise SystemExit("unexpected worktree changes: "+repr(unexpected))',
          ])
          if old_shape not in execute:
              raise SystemExit("postflight status-shape anchor missing")
          execute = execute.replace(old_shape, new_shape)

          cleanup_anchor = "\n".join([
              'rm -f "${fixture}"',
              "git checkout -- next-env.d.ts >/dev/null 2>&1 || true",
              "rmdir public/media/movie-buff public/media 2>/dev/null || true",
          ])
          cleanup_replacement = "\n".join([
              'rm -f "${fixture}"',
              "rm -rf public/media/movie-buff/runtime-generated",
              "git checkout -- next-env.d.ts >/dev/null 2>&1 || true",
              "rmdir public/media/movie-buff public/media 2>/dev/null || true",
          ])
          if cleanup_anchor not in execute:
              raise SystemExit("runtime-generated cleanup anchor missing")
          execute = execute.replace(cleanup_anchor, cleanup_replacement)

          required = [
              "--untracked-files=all",
              "movie-buff-three-client-full-journey-v3-runner.mjs",
              "npx playwright install --with-deps chrome",
              'allowed_prefixes=("public/media/movie-buff/runtime-generated/",)',
              "rm -rf public/media/movie-buff/runtime-generated",
              "rm -f scripts/movie-buff-core-v11-local-users.mjs",
              "expected_temp_status=",
          ]
          for marker in required:
              if marker not in execute and marker not in preflight:
                  raise SystemExit(f"missing transformed laboratory marker: {marker}")

          (output / "agent7-preflight.sh").write_text(preflight, encoding="utf-8")
          (output / "agent7-execute.sh").write_text(execute, encoding="utf-8")
          PY

          bash -n "${RUNNER_TEMP}/agent7-preflight.sh"
          bash -n "${RUNNER_TEMP}/agent7-execute.sh"

      - name: Install deterministic media tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Validate exact candidate and browser harness
        shell: bash
        run: |
          set -euo pipefail
          bash "${RUNNER_TEMP}/agent7-preflight.sh"
          git merge-base --is-ancestor "${CANDIDATE_SHA}" HEAD
          test "$(git rev-parse "${VALIDATOR_SOURCE_SHA}:scripts/movie-buff-three-client-full-journey-v2.mjs")" = "${MOVIE_BUFF_V2_HARNESS_BLOB}"

      - name: Install exact application dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Execute disposable exact-SHA three-client journey
        shell: bash
        run: bash "${RUNNER_TEMP}/agent7-execute.sh"

      - name: Upload Agent 7 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-buff-agent7-three-client-v2-${{ github.sha }}
          path: ${{ runner.temp }}/movie-buff-three-client-full-v2
          if-no-files-found: error
          retention-days: 14

      - name: Final cleanup and clean postflight
        if: always()
        shell: bash
        run: |
          rm -f scripts/movie-buff-three-client-full-journey-v2.mjs
          rm -f scripts/movie-buff-three-client-full-journey-v3-runner.mjs
          rm -f scripts/movie-buff-core-v11-local-users.mjs
          rm -f public/media/movie-buff/browser-journey-fixture.mp4
          rm -rf public/media/movie-buff/runtime-generated
          git checkout -- next-env.d.ts >/dev/null 2>&1 || true
          rmdir public/media/movie-buff public/media 2>/dev/null || true
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
